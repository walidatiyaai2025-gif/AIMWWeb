[program:aiwmweb-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=php artisan queue:work redis --queue=critical,default,bulk,runtime --sleep=1 --tries=3 --backoff=5,30,120 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=45
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=APP_ENV="production"

[program:aiwmweb-scheduler]
process_name=%(program_name)s
directory=/var/www/html
command=php artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=APP_ENV="production"

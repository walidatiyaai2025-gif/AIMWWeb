name: ${COMPOSE_PROJECT_NAME:-laravel-aiwmweb}

x-app-environment: &app-environment
  APP_NAME: Laravel AIWMWeb
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-laravel_aiwmweb}
  DB_USERNAME: ${DB_USERNAME:-laravel_aiwmweb}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_PREFIX: ${REDIS_PREFIX:-aimwweb:}
  CACHE_STORE: redis
  CACHE_PREFIX: ${CACHE_PREFIX:-aimwweb_cache_}
  QUEUE_CONNECTION: redis
  QUEUE_FAILED_DRIVER: database-uuids
  REDIS_QUEUE: ${REDIS_QUEUE:-default}
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-150}
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_ENCRYPT: "true"
  SCHEDULER_HEALTH_MAX_AGE: ${SCHEDULER_HEALTH_MAX_AGE:-180}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel AIWMWeb}
  AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
  AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
  AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
  WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-http://wordpress}
  AIMW_CONNECTOR_PROTOCOL_VERSION: ${AIMW_CONNECTOR_PROTOCOL_VERSION:-1}

services:
  mysql:
    image: mysql:8.4.11
    command:
      - --transaction-isolation=READ-COMMITTED
      - --innodb-strict-mode=ON
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_aiwmweb}
      MYSQL_USER: ${DB_USERNAME:-laravel_aiwmweb}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: app
      args:
        VITE_API_BASE_URL: ${APP_URL:-http://localhost:8080}
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php", "artisan", "runtime:health"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: app
    environment: *app-environment
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=critical,default,bulk,runtime
      - --sleep=1
      - --tries=3
      - --backoff=5,30,120
      - --timeout=120
      - --max-time=3600
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: app
    environment: *app-environment
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  wordpress-db:
    profiles: ["wordpress"]
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required with wordpress profile}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?WORDPRESS_DB_ROOT_PASSWORD is required with wordpress profile}
    volumes:
      - wordpress-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  wordpress:
    profiles: ["wordpress"]
    image: wordpress:7.0.4-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required with wordpress profile}
      WORDPRESS_DEBUG: "0"
    depends_on:
      wordpress-db:
        condition: service_healthy
    volumes:
      - wordpress-data:/var/www/html
    ports:
      - "${WORDPRESS_PORT:-8081}:80"
    restart: unless-stopped

  wpcli:
    profiles: ["wordpress"]
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required with wordpress profile}
    depends_on:
      wordpress-db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - wordpress-data:/var/www/html
      - ./artifacts:/artifacts:ro
    entrypoint: ["wp", "--path=/var/www/html"]

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-laravel-aiwmweb}_mysql_data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-laravel-aiwmweb}_redis_data
  wordpress-data:
    name: ${COMPOSE_PROJECT_NAME:-laravel-aiwmweb}_wordpress_data
  wordpress-db-data:
    name: ${COMPOSE_PROJECT_NAME:-laravel-aiwmweb}_wordpress_db_data

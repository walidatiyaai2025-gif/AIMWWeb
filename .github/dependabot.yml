version: 2
updates:
  - package-ecosystem: composer
    directory: /variants/laravel-aiwmweb/backend
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Kuwait
    # Main-only release freeze: preserve alerts and dependency visibility; workers
    # re-evaluate version upgrades from issue #1462 against current main.
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    groups:
      laravel-runtime:
        patterns:
          - "laravel/*"
      php-dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /variants/laravel-aiwmweb/backend
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Kuwait
    # Main-only release freeze: preserve alerts and dependency visibility; workers
    # re-evaluate version upgrades from issue #1462 against current main.
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    groups:
      frontend-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kuwait
    # Main-only release freeze: preserve alerts and dependency visibility; workers
    # re-evaluate version upgrades from issue #1462 against current main.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

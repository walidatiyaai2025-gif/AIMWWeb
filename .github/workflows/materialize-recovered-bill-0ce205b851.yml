name: Materialize recovered BILL-0CE205B851 parity

on:
  push:
    branches:
      - worker/laravel-recover-bill-0ce205b851
    paths:
      - '.github/workflows/materialize-recovered-bill-0ce205b851.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_SHA: 'c24f5e21c8c6d1e199fe8a57fcd534c58c6a8ae1'
      EVIDENCE_SHA: '1a8a828a7f170fa0d14942dbfdbc5f22e29f4b2e'
      OPERATION_ID: 'AIMW-BILL-0CE205B851'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-recover-bill-0ce205b851

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind generator to live base and exact recovered evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = os.environ['BASE_SHA']
          data['focused_closure_evidence_source_sha'] = os.environ['EVIDENCE_SHA']
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run current official census and reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          root='variants/laravel-aiwmweb'
          docs="$root/docs"
          tools="$root/tools"

          python "$tools/capability_census.py" --write
          python "$tools/finalize_operation_parity.py" \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_tenant_neutral_route_evidence.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_platform_admin_route_evidence.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_explicit_route_api_provenance.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_focused_closure_evidence.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_focused_service_evidence.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python "$tools/apply_focused_background_job_evidence.py" \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Prove exactly one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json, os
          prev = json.load(open('/tmp/previous.json', encoding='utf-8'))
          cur = json.load(open('/tmp/operation-parity-reconciliation.json', encoding='utf-8'))
          pid = os.environ['OPERATION_ID']
          before = {r['operation_id']: r['migration_state'] for r in prev['operations']}
          after = {r['operation_id']: r['migration_state'] for r in cur['operations']}
          changes = [(op, before[op], after[op]) for op in before if before[op] != after[op]]
          assert changes == [(pid, 'PENDING', 'ADAPTED')], changes
          assert cur['totals']['total'] == 931, cur['totals']
          assert cur['totals']['terminal'] == 601, cur['totals']
          assert cur['totals']['pending'] == 330, cur['totals']
          assert cur['totals']['blocked'] == 0, cur['totals']
          print('EXACT_ONE_TRANSITION=PASS', changes)
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$BASE_SHA"

      - name: Materialize generated authority
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Focused Laravel validation
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test --filter=SubscriptionPlansAdminCustomerBillingControlTerminalityTest
          vendor/bin/pint --test tests/Feature/SubscriptionPlansAdminCustomerBillingControlTerminalityTest.php resources/views/billing/subscription-plans-admin.blade.php

      - name: Commit generator-backed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/capability-parity-ledger.json \
            variants/laravel-aiwmweb/docs/CAPABILITY_PARITY_LEDGER.md \
            variants/laravel-aiwmweb/docs/dead-function-census.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && { echo 'Expected materialized parity changes are absent'; exit 1; }
          git commit -m 'chore(laravel): materialize recovered customer billing parity [parity-materialized]'
          git push origin HEAD:worker/laravel-recover-bill-0ce205b851

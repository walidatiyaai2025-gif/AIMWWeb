name: Laravel AIWMWeb Task 908 Finalize

on:
  push:
    branches:
      - worker/908-site-email-cancel-edit
    paths:
      - 'variants/laravel-aiwmweb/tools/materialize_task_908.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python variants/laravel-aiwmweb/tools/materialize_task_908.py
      - run: |
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(laravel): materialize #908 parity"
          git push origin "HEAD:${{ github.ref_name }}"
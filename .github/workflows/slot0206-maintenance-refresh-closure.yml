name: Slot0206 Maintenance Refresh Closure

on:
  pull_request:
    branches:
      - worker/laravel-aiwmweb-closure-composition
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/slot0206-maintenance-refresh-closure.yml'

permissions:
  contents: write

jobs:
  close-selected-operation:
    if: github.head_ref == 'worker/laravel-aiwmweb-AIMW-AI-C5BC29CF27-slot0206'
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --no-audit --no-fund

      - name: Focused PHP and frontend validation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test app/Http/Controllers/SiteOperationsMaintenanceRefreshController.php app/Providers/SiteOperationsMaintenanceRouteServiceProvider.php tests/Feature/SiteOperationsMaintenanceRefreshPreviewTerminalityTest.php
          php artisan test tests/Feature/SiteOperationsMaintenanceRefreshPreviewTerminalityTest.php
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Generate or verify canonical focused closure
        shell: bash
        run: |
          set -euo pipefail
          selected='AIMW-AI-C5BC29CF27'
          unselected='AIMW-AI-CAAC427FC0'
          manifest='variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
          json='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'

          state="$(python - "$json" "$selected" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding='utf-8'))
          row=next(r for r in payload['operations'] if r['operation_id']==sys.argv[2])
          print(row['migration_state'])
          PY
          )"

          if [[ "$state" != 'ADAPTED' ]]; then
            source_sha="$(git rev-parse HEAD)"
            git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
            python - "$manifest" "$source_sha" <<'PY'
          import json, sys
          path=sys.argv[1]
          source_sha=sys.argv[2]
          payload=json.load(open(path, encoding='utf-8'))
          payload['focused_closure_evidence_source_sha']=source_sha
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

            python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$json" --output "$json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$json" --output "$json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$json" --output "$json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$json" --output "$json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$md" --check-total 931

            python - "$json" "$selected" "$unselected" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding='utf-8'))
          rows={r['operation_id']:r for r in payload['operations']}
          assert len(payload['operations']) == 931
          assert payload['totals']['terminal'] == 515, payload['totals']
          assert payload['totals']['pending'] == 416, payload['totals']
          assert payload['totals']['blocked'] == 0, payload['totals']
          assert rows[sys.argv[2]]['migration_state'] == 'ADAPTED', rows[sys.argv[2]]
          assert rows[sys.argv[3]]['migration_state'] == 'PENDING', rows[sys.argv[3]]
          print('SLOT0206_PARITY_ASSERTIONS=PASS')
          PY

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$manifest" "$json" "$md"
            git commit -m 'chore(parity): generate maintenance refresh closure'
            git push origin HEAD:${{ github.head_ref }}
          else
            tmp_json=/tmp/operation-parity-reconciliation.json
            tmp_md=/tmp/operation-parity-reconciliation.md
            git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
            python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$tmp_json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$tmp_md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$tmp_json" --output "$tmp_json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$tmp_md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$tmp_json" --output "$tmp_json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$tmp_md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$tmp_json" --output "$tmp_json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$tmp_md" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$tmp_json" --output "$tmp_json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$tmp_md" --check-total 931
            cmp "$json" "$tmp_json"
            cmp "$md" "$tmp_md"
          fi

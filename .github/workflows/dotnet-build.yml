name: .NET Build Verification

on:
  push:
    branches:
      - feature/system-health
      - main
  pull_request:
    branches:
      - main
      - feature/system-health

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore AIWordPressManager.Web.sln --disable-parallel

      - name: Build solution
        run: dotnet build AIWordPressManager.Web.sln --configuration Debug --no-restore --warnaserror

name: .NET Build Verification

on:
  push:
    branches:
      - agent/logs-error-center
      - feature/system-health
      - main
  pull_request:
    branches:
      - main
      - feature/system-health
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore AIWordPressManager.Web.sln --disable-parallel

      - name: Build solution
        run: dotnet build AIWordPressManager.Web.sln --configuration Debug --no-restore

      - name: Run automated tests
        run: dotnet test AIWordPressManager.Web.sln --configuration Debug --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14

name: Laravel AIWMWeb FC900E61B8 Focused Reconcile

on:
  push:
    branches:
      - worker/laravel-iden-fc900e61b8-system-health
    paths:
      - '.github/workflows/laravel-aiwmweb-fc900e61b8-reconcile.yml'

permissions:
  contents: write

jobs:
  focused-reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Focused frontend acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          npm ci
          npx vitest run resources/js/__tests__/current-user-system-health-control.test.tsx
      - name: Focused Laravel security acceptance
        working-directory: variants/laravel-aiwmweb/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/CurrentUserSystemHealthControlTerminalityTest.php
      - name: Official generator-backed reconciliation
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
      - name: Assert exact single-operation closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          totals=doc['totals']
          op=next(x for x in doc['operations'] if x['operation_id']=='AIMW-IDEN-FC900E61B8')
          assert op['migration_state'] in {'ADAPTED','PORTED','VERIFIED_UNAVAILABLE_EXTERNAL'}, op
          assert totals['total']==931, totals
          assert totals['terminal']==569, totals
          assert totals['pending']==362, totals
          assert totals['blocked']==0, totals
          print('FC900E61B8 terminal:', op['migration_state'])
          print('TOTAL/TERMINAL/PENDING/BLOCKED:', totals['total'], totals['terminal'], totals['pending'], totals['blocked'])
          PY
      - name: Persist official generated artifacts and remove helper
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm .github/workflows/laravel-aiwmweb-fc900e61b8-reconcile.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md .github/workflows/laravel-aiwmweb-fc900e61b8-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(laravel): reconcile FC900E61B8 system health closure'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Slot 0110 Provider Anchor Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-4F6B6584E4-providers-anchor

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 575bdb258a9eb986fa8512ae9c9f62bb651d277b
      EVIDENCE_SHA: 6e216ebce66f0913153b078e998fee510e491634
      OPERATION_ID: AIMW-AI-4F6B6584E4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Pin focused evidence source to pushed implementation snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['focused_closure_evidence_source_sha'] = os.environ['EVIDENCE_SHA']
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Rebuild canonical reconciliation through repository pipeline
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Enforce exactly one canonical state transition
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/base-reconciliation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base = json.loads(Path('/tmp/base-reconciliation.json').read_text())
          cur = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          b = {row['operation_id']: row['migration_state'] for row in base['operations']}
          c = {row['operation_id']: row['migration_state'] for row in cur['operations']}
          changes = [(op, b[op], c[op]) for op in sorted(b) if b[op] != c[op]]
          expected = [(os.environ['OPERATION_ID'], 'PENDING', 'ADAPTED')]
          if changes != expected:
              raise SystemExit(f'unexpected state transitions: {changes!r}; expected {expected!r}')
          totals = cur['totals']
          expected_totals = {'total': 931, 'terminal': 485, 'pending': 446, 'blocked': 0}
          for key, value in expected_totals.items():
              if totals[key] != value:
                  raise SystemExit(f'{key}={totals[key]!r}, expected {value!r}')
          if not cur.get('validation', {}).get('passed'):
              raise SystemExit('canonical reconciliation validation did not pass')
          print('EXACT_TRANSITION=AIMW-AI-4F6B6584E4:PENDING->ADAPTED')
          print('TOTAL=931 TERMINAL=485 PENDING=446 BLOCKED=0')
          PY

      - name: Remove temporary workflow and commit generated authority
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/slot-0110-provider-anchor-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'docs(laravel): reconcile providers anchor parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-4F6B6584E4-providers-anchor

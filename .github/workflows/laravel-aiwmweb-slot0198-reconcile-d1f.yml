name: Laravel AIWMWeb Slot0198 Reconcile D1F

on:
  push:
    branches:
      - 'worker/laravel-aiwmweb-AIMW-AI-D1F233AB61-slot0197'
    paths:
      - '.github/workflows/laravel-aiwmweb-slot0198-reconcile-d1f.yml'

permissions:
  contents: write

jobs:
  reconcile-and-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      TARGET_OPERATION: 'AIMW-AI-D1F233AB61'
      COMPOSITION_BRANCH: 'worker/laravel-aiwmweb-closure-composition'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact composition and evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate canonical reconciliation
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Guard exact one-operation delta
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/${COMPOSITION_BRANCH}:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/base-reconciliation.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['TARGET_OPERATION']
          base = json.loads(Path('/tmp/base-reconciliation.json').read_text())
          cur = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          assert cur['totals']['total'] == 931, cur['totals']
          assert cur['totals']['terminal'] == 513, cur['totals']
          assert cur['totals']['pending'] == 418, cur['totals']
          assert cur['totals']['blocked'] == 0, cur['totals']
          b = {o['operation_id']: o['migration_state'] for o in base['operations']}
          c = {o['operation_id']: o['migration_state'] for o in cur['operations']}
          changed = sorted(k for k in c if b.get(k) != c.get(k))
          assert changed == [target], changed
          row = next(o for o in cur['operations'] if o['operation_id'] == target)
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['source_sha'] == '843a69c0634a608d04a585feaa2115075f0c6c6a', row['reconciliation']
          print('GUARD_PASS', changed, cur['totals'])
          PY

      - name: Commit exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --exit-code -- . ':!variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json' ':!variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && { echo 'No generated delta to commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(laravel): reconcile FailExternal parity'
          git push origin HEAD:'worker/laravel-aiwmweb-AIMW-AI-D1F233AB61-slot0197'

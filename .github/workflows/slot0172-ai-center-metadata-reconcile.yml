name: Slot0172 AI Center Metadata Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-953A6C0D98-slot0172
    paths:
      - '.github/workflows/slot0172-ai-center-metadata-reconcile.yml'

permissions:
  contents: write

jobs:
  validate-and-reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Point focused evidence at this pushed implementation snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run canonical reconciliation generator chain
        shell: bash
        run: |
          set -euo pipefail
          json='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          totals = payload['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 504, totals
          assert totals['pending'] == 427, totals
          assert totals['blocked'] == 0, totals
          row = next(row for row in payload['operations'] if row['operation_id'] == 'AIMW-AI-953A6C0D98')
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['evidence_mode'] == 'focused_closure_contract', row
          print('SLOT0172_GENERATOR=PASS')
          print(f"TOTAL={totals['total']} TERMINAL={totals['terminal']} PENDING={totals['pending']} BLOCKED={totals['blocked']}")
          PY

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install backend and run focused PHP acceptance
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test
          php artisan migrate:fresh --force
          php artisan test \
            tests/Feature/AiCenterLoadMetadataTerminalityTest.php \
            tests/Feature/AiCenterRouteTerminalityTest.php \
            tests/Feature/AiCenterRefreshApprovalStatusTerminalityTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused frontend acceptance and typecheck
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm run --if-present typecheck
          npm run --if-present test -- --run resources/js/__tests__/ai-center-load-metadata.test.tsx
          npm run build

      - name: Commit generator-owned reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(laravel): reconcile AI Center metadata refresh parity'
          git push origin "HEAD:${GITHUB_REF_NAME}"

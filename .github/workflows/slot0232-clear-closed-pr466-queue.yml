name: Slot0232 Clear Closed PR466 Queue

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227
    paths:
      - '.github/workflows/slot0232-clear-closed-pr466-queue.yml'

permissions:
  actions: write
  contents: write

jobs:
  clear-and-self-clean:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227
          fetch-depth: 0

      - name: Cancel queued runs from closed PR branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/actions/runs?branch=${BRANCH}&status=queued&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              [[ -z "$run_id" || "$run_id" == "$SELF_RUN" ]] && continue
              echo "Cancelling superseded closed-PR run ${run_id}"
              gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" || true
            done

      - name: Remove helper from closed branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/slot0232-clear-closed-pr466-queue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/slot0232-clear-closed-pr466-queue.yml
          git commit -m 'ci(laravel): remove closed PR466 queue helper'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227

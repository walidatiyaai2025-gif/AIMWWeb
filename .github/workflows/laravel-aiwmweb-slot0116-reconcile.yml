name: Laravel AIWMWeb Slot 0116 Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-95AC5F28A7-slot0115

permissions:
  contents: write

jobs:
  reconcile-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-aiwmweb-AIMW-AI-95AC5F28A7-slot0115

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical reconciliation
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Enforce exact Slot 0116 delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          t = p['totals']
          assert t['total'] == 931, t
          assert t['terminal'] == 488, t
          assert t['pending'] == 443, t
          assert t['blocked'] == 0, t
          op = next(x for x in p['operations'] if x['operation_id'] == 'AIMW-AI-95AC5F28A7')
          assert op['migration_state'] == 'ADAPTED', op
          assert op['reconciliation']['evidence_mode'] == 'focused_service_contract', op
          assert op['reconciliation']['source_sha'] == 'e16441f8791341783e1363b556b7b9ed32dcfedc', op
          print('SLOT0116_GENERATOR_DELTA=PASS')
          print('TOTAL=931 TERMINAL=488 PENDING=443 BLOCKED=0 PARITY=52.42')
          PY

      - name: Commit generated artifacts and self-remove
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/laravel-aiwmweb-slot0116-reconcile.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git commit -m 'docs(laravel): reconcile site details service parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-95AC5F28A7-slot0115

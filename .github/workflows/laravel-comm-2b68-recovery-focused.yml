name: Laravel COMM 2B68 Recovery Focused

on:
  push:
    branches:
      - worker/laravel-comm-2b682f7bec-recovery

permissions:
  contents: read

jobs:
  focused-comments-back-to-explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Focused PHP tenant and IDOR acceptance
        run: php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Focused React fail-closed control acceptance
        run: npm test -- comments-back-to-explorer-control.test.tsx

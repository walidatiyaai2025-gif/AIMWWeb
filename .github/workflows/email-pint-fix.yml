name: Email Pint Fix

on:
  push:
    branches:
      - worker/laravel-aiwmweb-email-delivery-closure
    paths:
      - '.github/workflows/email-pint-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Apply Laravel Pint to Email closure files
        shell: bash
        run: |
          set -euo pipefail
          cd variants/laravel-aiwmweb/backend
          composer install --no-interaction --prefer-dist
          vendor/bin/pint \
            app/Http/Controllers/EmailNotificationController.php \
            app/Jobs/RunEmailSchedulesJob.php \
            app/Jobs/SendEmailDeliveryJob.php
          cd ../../..
          git diff --check
          git config user.name 'Laravel AIWMWeb Email Closure'
          git config user.email 'email-closure@example.invalid'
          git add variants/laravel-aiwmweb/backend/app/Http/Controllers/EmailNotificationController.php \
                  variants/laravel-aiwmweb/backend/app/Jobs/RunEmailSchedulesJob.php \
                  variants/laravel-aiwmweb/backend/app/Jobs/SendEmailDeliveryJob.php
          if git diff --cached --quiet; then
            echo 'PINT_CHANGES=NONE'
            exit 0
          fi
          git commit -m 'style(email): apply Laravel Pint'
          git push origin HEAD:worker/laravel-aiwmweb-email-delivery-closure

name: Laravel AIWMWeb Task 932 Final Parity (temporary)
on:
  push:
    branches:
      - worker/932-global-media-open-sync
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-932.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/932-global-media-open-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate official parity preserving all merged workers
        run: |
          set -euo pipefail
          PR_HEAD=$(git rev-parse HEAD)
          OUT=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUM=/tmp/932-parity-summary.json
          cp "$OUT" /tmp/932-parity-before.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python - <<'PY'
          import json
          before=json.load(open('/tmp/932-parity-before.json'))
          after=json.load(open('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'))
          old={x['operation_id']:x['migration_state'] for x in before['operations']}
          new={x['operation_id']:x['migration_state'] for x in after['operations']}
          delta={k:(old[k],new[k]) for k in old if old[k]!=new[k]}
          assert delta=={'AIMW-SYNC-2A256826D2':('PENDING','ADAPTED')},delta
          for k in ('AIMW-SYNC-7C77CF7F7A','AIMW-SYNC-38D8A24B15'):
              assert new[k]=='ADAPTED', (k,new[k])
          assert after['totals']['total']==931 and after['totals']['adapted']==909,after['totals']
          print('Verified #932-only transition preserving merged #959 and #973:',after['totals'])
          PY
          git add "$OUT" "$MD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize #932 parity on merged composition"
          REMOTE_HEAD=$(git ls-remote origin refs/heads/worker/932-global-media-open-sync | awk '{print $1}')
          test "$REMOTE_HEAD" = "$PR_HEAD" || { echo "Canonical branch advanced; refusing stale push"; exit 1; }
          git push origin HEAD:refs/heads/worker/932-global-media-open-sync

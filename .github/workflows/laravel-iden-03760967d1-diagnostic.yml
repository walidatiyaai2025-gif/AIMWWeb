name: Laravel IDEN 03760967D1 Diagnostic

on:
  push:
    branches:
      - worker/laravel-iden-03760967d1-final-convergence

permissions:
  contents: read

jobs:
  focused-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Capture focused test
        shell: bash
        run: |
          set +e
          DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync php artisan test --filter=RoutesOpenMyAccountSecurityTest > "$GITHUB_WORKSPACE/iden-focused.txt" 2>&1
          code=$?
          echo "$code" > "$GITHUB_WORKSPACE/iden-focused.exit"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: iden-focused-diagnostic
          path: |
            iden-focused.txt
            iden-focused.exit

name: TEMP Materialize BILL-0938ECBF66

on:
  push:
    branches:
      - worker/laravel-bill-0938ecbf66-clear-history

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Point evidence manifest at exact pushed implementation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          doc = json.loads(path.read_text())
          doc['previous_reconciliation_sha'] = 'b2843d6cafa1c0a16918e9a756b6cac510ba3988'
          doc['focused_closure_evidence_source_sha'] = '3e23cb4f98bfba187709191bac157eb611301b03'
          path.write_text(json.dumps(doc, indent=2) + '\n')
          PY

      - name: Run official six-stage reconciliation
        run: |
          set -euo pipefail
          ROOT=variants/laravel-aiwmweb
          JSON="$ROOT/docs/operation-parity-reconciliation.json"
          MD="$ROOT/docs/operation-parity-reconciliation.md"
          SUMMARY=/tmp/operation-parity-summary.json
          python "$ROOT/tools/finalize_operation_parity.py" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_tenant_neutral_route_evidence.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_platform_admin_route_evidence.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_explicit_route_api_provenance.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_focused_closure_evidence.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_focused_service_evidence.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python "$ROOT/tools/apply_focused_background_job_evidence.py" --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Prove exactly one canonical transition
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          rel='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          previous=json.loads(subprocess.check_output(['git','show','b2843d6cafa1c0a16918e9a756b6cac510ba3988:'+rel], text=True))
          current=json.loads(Path(rel).read_text())
          before={r['operation_id']:r['migration_state'] for r in previous['operations']}
          after={r['operation_id']:r['migration_state'] for r in current['operations']}
          changed=[(op,before[op],after[op]) for op in sorted(before) if before[op] != after[op]]
          expected=[('AIMW-BILL-0938ECBF66','PENDING','ADAPTED')]
          if changed != expected:
              raise SystemExit(f'exact-one transition guard failed: {changed!r}')
          totals=current['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 596, totals
          assert totals['pending'] == 335, totals
          assert totals['blocked'] == 0, totals
          print('exact-one transition:', changed)
          print('totals:', totals)
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --previous-sha b2843d6cafa1c0a16918e9a756b6cac510ba3988

      - name: Commit generated authority artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && { echo 'Expected generated parity changes were not produced.'; exit 1; }
          git commit -m 'Materialize ClearHistory parity reconciliation'
          git push origin HEAD:worker/laravel-bill-0938ecbf66-clear-history

name: Laravel AIWMWeb Sites Terminality Assertions Once

on:
  pull_request:
    paths:
      - '.github/workflows/laravel-aiwmweb-sites-focused-evidence-once.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align ConfirmBulkDelete assertion with generated authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/backend/tests/Feature/SitesConfirmBulkDeleteTerminalityTest.php')
          text = path.read_text(encoding='utf-8')
          old = "$this->assertSame('PENDING', $operation['migration_state']);"
          new = "$this->assertSame('ADAPTED', $operation['migration_state']);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale ConfirmBulkDelete assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/backend/tests/Feature/SitesConfirmBulkDeleteTerminalityTest.php
          git commit -m 'test(laravel): align confirm bulk-delete terminality'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

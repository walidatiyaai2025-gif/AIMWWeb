name: Slot 0120 Runtime Anchor Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-44DD850CE4-slot0118

permissions:
  contents: write

jobs:
  reconcile-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-aiwmweb-AIMW-AI-44DD850CE4-slot0118

      - name: Fetch exact pushed evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Enforce only the claimed canonical transition
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          op = 'AIMW-AI-44DD850CE4'
          base_sha = '8cdb235e01f3c049764aae2306326629f7c8d76a'
          old = json.loads(subprocess.check_output(
              ['git', 'show', f'{base_sha}:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'],
              text=True,
          ))
          new = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          old_rows = {row['operation_id']: row for row in old['operations']}
          new_rows = {row['operation_id']: row for row in new['operations']}
          changed = [
              key for key in old_rows
              if old_rows[key].get('migration_state') != new_rows[key].get('migration_state')
          ]
          if changed != [op]:
              raise SystemExit(f'unexpected state transitions: {changed}')
          if old_rows[op]['migration_state'] != 'PENDING' or new_rows[op]['migration_state'] != 'ADAPTED':
              raise SystemExit('claimed operation did not transition PENDING -> ADAPTED')
          totals = new['totals']
          if (totals['total'], totals['terminal'], totals['pending'], totals['blocked']) != (931, 489, 442, 0):
              raise SystemExit(f'unexpected generated totals: {totals}')
          if op not in new['validation'].get('focused_closure_contract_terminals', []):
              raise SystemExit('claimed operation missing from focused closure terminals')
          print('SLOT0120_GENERATED_TRANSITION=PASS')
          PY

      - name: Commit exact generator output and remove helper
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm .github/workflows/slot0120-runtime-anchor-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/slot0120-runtime-anchor-reconcile.yml
          git diff --cached --check
          git commit -m 'chore(laravel): reconcile runtime anchor parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-44DD850CE4-slot0118

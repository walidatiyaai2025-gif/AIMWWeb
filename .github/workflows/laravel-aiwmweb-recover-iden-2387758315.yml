name: Recover AIMW-IDEN-2387758315 convergence

on:
  push:
    branches:
      - worker/laravel-iden-2387758315-convergence-recovery

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 7b8acdc4e41e84d1f7b72e6707252da3c119dde7
      OLD_HEAD: d4f3f126972f0f11fc33f8632aba65ebd927e3e9
      TARGET_OPERATION: AIMW-IDEN-2387758315
      BRANCH_NAME: worker/laravel-iden-2387758315-convergence-recovery
      ROOT: variants/laravel-aiwmweb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-iden-2387758315-convergence-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover only the missing closure evidence from green PR 505
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$OLD_HEAD"
          git checkout "$OLD_HEAD" -- "$ROOT/docs/closure-evidence/current-user-about-build-terminality.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/closure-evidence/current-user-about-build-terminality.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          doc['authority_metadata'] = {
              'issue': 257,
              'canonical_base_sha': os.environ['BASE_SHA'],
              'worker_branch': os.environ['BRANCH_NAME'],
              'recovered_from_pr': 505,
              'recovered_from_head_sha': os.environ['OLD_HEAD'],
          }
          doc['canonical_denominator_contribution'] = {
              'authority_snapshot_sha': os.environ['BASE_SHA'],
              'operation_id': os.environ['TARGET_OPERATION'],
              'expected_transition': 'PENDING -> ADAPTED',
              'scope_note': 'No canonical counts are hand-edited; official generator output and exact-head CI are authoritative.'
          }
          doc['terminality']['pre_ci_status'] = 'recovered_from_green_pr_505_pending_current_exact_head_validation'
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "$ROOT/docs/closure-evidence/current-user-about-build-terminality.json"

      - name: Revalidate existing focused frontend implementation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          npm ci
          npm test -- current-user-about-build-control.test.tsx current-user-site-details-control.test.tsx
          npm run typecheck

      - name: Revalidate existing Laravel security implementation
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate:fresh --force
          vendor/bin/pint --test tests/Feature/CurrentUserAboutBuildSecurityTest.php
          php artisan test tests/Feature/CurrentUserAboutBuildSecurityTest.php

      - name: Push exact tested evidence source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/docs/closure-evidence/current-user-about-build-terminality.json"
          git diff --cached --check
          git commit -m 'docs(laravel-aiwmweb): recover AIMW-IDEN-2387758315 closure evidence'
          git push origin "HEAD:${BRANCH_NAME}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin pushed focused closure source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          doc['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/tools/finalize_operation_parity.py" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931
          python "$ROOT/tools/apply_tenant_neutral_route_evidence.py" --input "$ROOT/docs/operation-parity-reconciliation.json" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931
          python "$ROOT/tools/apply_explicit_route_api_provenance.py" --input "$ROOT/docs/operation-parity-reconciliation.json" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931
          python "$ROOT/tools/apply_focused_closure_evidence.py" --input "$ROOT/docs/operation-parity-reconciliation.json" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931
          python "$ROOT/tools/apply_focused_service_evidence.py" --input "$ROOT/docs/operation-parity-reconciliation.json" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931
          python "$ROOT/tools/apply_focused_background_job_evidence.py" --input "$ROOT/docs/operation-parity-reconciliation.json" --output "$ROOT/docs/operation-parity-reconciliation.json" --summary-output /tmp/operation-parity-summary.json --markdown-output "$ROOT/docs/operation-parity-reconciliation.md" --check-total 931

      - name: Verify exact one-operation transition
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          current = json.loads(Path(path).read_text(encoding='utf-8'))
          prior = json.loads(subprocess.check_output(['git','show',f"{os.environ['BASE_SHA']}:{path}"], text=True))
          now = {r['operation_id']: r for r in current['operations']}
          before = {r['operation_id']: r for r in prior['operations']}
          transitions = sorted((op, before[op]['migration_state'], row['migration_state']) for op,row in now.items() if before[op]['migration_state'] != row['migration_state'])
          assert transitions == [(os.environ['TARGET_OPERATION'], 'PENDING', 'ADAPTED')], transitions
          totals = current['totals']
          assert (totals['total'], totals['terminal'], totals['pending'], totals['blocked']) == (931, 571, 360, 0), totals
          target = now[os.environ['TARGET_OPERATION']]
          assert target['reconciliation']['evidence_mode'] == 'focused_closure_contract', target
          assert target['reconciliation']['source_sha'] == os.environ['SOURCE_SHA'], target
          assert current['validation']['passed'] is True, current['validation']
          print('TRANSITIONS', transitions)
          print('TOTALS', totals)
          print('IDENTITY', current['domains']['identity'])
          print('VISIBLE_CONTROLS', current['visible_controls'])
          PY

      - name: Commit generator-backed convergence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/laravel-aiwmweb-recover-iden-2387758315.yml
          git add \
            "$ROOT/docs/operation-parity-evidence-sources.json" \
            "$ROOT/docs/operation-parity-reconciliation.json" \
            "$ROOT/docs/operation-parity-reconciliation.md"
          git diff --cached --check
          git commit -m 'chore(laravel-aiwmweb): materialize AIMW-IDEN-2387758315 convergence'
          git push origin "HEAD:${BRANCH_NAME}"

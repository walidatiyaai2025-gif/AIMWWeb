# current-head retry after concurrent service/test commits
name: Apply Automation phase UI parity bindings

on:
  push:
    branches:
      - worker/laravel-aiwmweb-automation-phase-closure
    paths:
      - '.github/workflows/automation-phase-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact UI bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('variants/laravel-aiwmweb/backend/resources/js')

          app = root / 'app.tsx'
          text = app.read_text()
          needle = "import { AiUsageLoadWorkspace } from './ai-usage-load-workspace';\n"
          addition = needle + "import { AutomationPhaseNavigationControls } from './automation-phase-controls';\n"
          if "AutomationPhaseNavigationControls" not in text:
              text = text.replace(needle, addition, 1)
          shell = "                <MainLayoutParityControls context={context} />\n"
          if "<AutomationPhaseNavigationControls context={context} />" not in text:
              text = text.replace(shell, shell + "                <AutomationPhaseNavigationControls context={context} />\n", 1)
          app.write_text(text)

          dashboard = root / 'dashboard-execution-link-control.tsx'
          text = dashboard.read_text()
          marker = "export const DASHBOARD_EXECUTION_LINK_OPERATION_ID = 'AIMW-AUTO-151800BD9D';\n"
          if 'AIMW-AUTO-66466C8C7F' not in text:
              text = text.replace(marker, marker + "export const HOME_EXECUTION_LINK_OPERATION_ID = 'AIMW-AUTO-66466C8C7F';\n", 1)
              text = text.replace(
                  "data-canonical-operation={DASHBOARD_EXECUTION_LINK_OPERATION_ID}\n",
                  "data-canonical-operation={DASHBOARD_EXECUTION_LINK_OPERATION_ID}\n                    data-home-canonical-operation={HOME_EXECUTION_LINK_OPERATION_ID}\n",
                  1,
              )
          dashboard.write_text(text)

          pages = root / 'pages.tsx'
          text = pages.read_text()
          import_needle = "import { prepareActionRequest } from './action-contract';\n"
          import_block = import_needle + "import { AUTOMATION_PHASE_ACTION_OPERATIONS, AUTOMATION_PHASE_REFRESH_OPERATIONS, SCHEDULE_CANCEL_EDIT_OPERATION_ID } from './automation-phase-controls';\n"
          if 'AUTOMATION_PHASE_ACTION_OPERATIONS' not in text:
              text = text.replace(import_needle, import_block, 1)

          old_refresh = """    const refreshOperationId = route.key === 'ai-center'\n        ? AI_CENTER_METADATA_REFRESH_OPERATION_ID\n        : (route.key === 'sites' ? SITES_RELOAD_OPERATION_ID : undefined);\n"""
          new_refresh = """    const refreshOperationId = AUTOMATION_PHASE_REFRESH_OPERATIONS[route.key]\n        ?? (route.key === 'ai-center'\n            ? AI_CENTER_METADATA_REFRESH_OPERATION_ID\n            : (route.key === 'sites' ? SITES_RELOAD_OPERATION_ID : undefined));\n"""
          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh, 1)

          old_actions = """                    {route.controls?.map((actionKey) => <ActionButton key={actionKey} route={route} actionKey={actionKey} context={context} onAvailable={(contract) => setDialog({ key: actionKey, contract })} />)}\n"""
          new_actions = """                    {route.controls?.map((actionKey) => {\n                        const canonicalOperation = AUTOMATION_PHASE_ACTION_OPERATIONS[actionKey];\n                        return (\n                            <span key={actionKey} data-canonical-operation={canonicalOperation}>\n                                <ActionButton route={route} actionKey={actionKey} context={context} onAvailable={(contract) => setDialog({ key: actionKey, contract })} />\n                            </span>\n                        );\n                    })}\n                    {route.key === 'schedules' ? (\n                        <button\n                            type=\"button\"\n                            className=\"btn\"\n                            data-canonical-operation={SCHEDULE_CANCEL_EDIT_OPERATION_ID}\n                            disabled={!dialog}\n                            onClick={() => setDialog(null)}\n                        >{locale === 'ar' ? 'إلغاء التعديل' : 'Cancel edit'}</button>\n                    ) : null}\n"""
          if old_actions in text:
              text = text.replace(old_actions, new_actions, 1)
          elif 'SCHEDULE_CANCEL_EDIT_OPERATION_ID' not in text:
              raise SystemExit('ResourceContent action toolbar shape changed; refusing ambiguous patch')
          pages.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - name: Verify frontend
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          npm ci
          npm run --if-present typecheck
          npm run --if-present test -- --run
          npm run build
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-phase-ui-patch.yml
          git add variants/laravel-aiwmweb/backend/resources/js/app.tsx \
                  variants/laravel-aiwmweb/backend/resources/js/pages.tsx \
                  variants/laravel-aiwmweb/backend/resources/js/dashboard-execution-link-control.tsx
          git diff --cached --check
          git commit -m 'feat(laravel): bind final Automation visible controls'
          git push origin HEAD:worker/laravel-aiwmweb-automation-phase-closure

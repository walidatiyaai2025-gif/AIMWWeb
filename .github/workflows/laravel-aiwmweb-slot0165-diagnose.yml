name: Laravel AIWMWeb Slot 0165 Diagnose
on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-8EE4F9F6FC-slot0165
    paths:
      - .github/workflows/laravel-aiwmweb-slot0165-diagnose.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical row
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target='AIMW-AI-8EE4F9F6FC'
          p=Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          data=json.loads(p.read_text())
          found=[]
          def walk(x):
              if isinstance(x, dict):
                  if target in [str(v) for v in x.values() if not isinstance(v,(dict,list))]:
                      found.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(data)
          print('TARGET',target)
          for i,row in enumerate(found):
              print('ROW',i,json.dumps(row,indent=2,sort_keys=True))
          if not found:
              raise SystemExit('canonical row not found')
          PY

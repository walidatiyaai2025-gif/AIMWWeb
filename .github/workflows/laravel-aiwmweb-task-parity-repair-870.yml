name: Laravel AIWMWeb Task Parity Repair 870

on:
  push:
    branches:
      - worker/870-site-settings-route
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-repair-870.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical reconciliation exactly
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
      - name: Commit exact generated artifacts and self-clean
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm -f .github/workflows/laravel-aiwmweb-task-parity-repair-870.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md .github/workflows/laravel-aiwmweb-task-parity-repair-870.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): repair #870 parity materialization"
          git push origin "HEAD:${{ github.ref_name }}"

name: Sync Test Helper Fix

on:
  push:
    branches:
      - worker/laravel-aiwmweb-sync-reconciliation
    paths:
      - '.github/workflows/sync-test-helper-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename framework-reserved post helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/backend/tests/Feature/Sync/SyncReconciliationRuntimeTest.php')
          text = path.read_text(encoding='utf-8')
          assert text.count('private function post(') == 1, 'expected exactly one post helper'
          calls = text.count('$this->post(')
          assert calls > 0, 'expected post helper call sites'
          text = text.replace('$this->post(', '$this->remotePost(')
          text = text.replace('private function post(', 'private function remotePost(')
          path.write_text(text, encoding='utf-8')
          print(f'RENAMED_CALLS={calls}')
          PY
          git diff --check
          git config user.name 'Laravel AIWMWeb Sync Closure'
          git config user.email 'sync-closure@example.invalid'
          git add variants/laravel-aiwmweb/backend/tests/Feature/Sync/SyncReconciliationRuntimeTest.php
          git commit -m 'test(sync): avoid framework post helper collision'
          git push origin HEAD:worker/laravel-aiwmweb-sync-reconciliation

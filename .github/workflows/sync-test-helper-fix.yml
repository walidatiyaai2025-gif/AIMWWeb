name: Sync Test Helper Fix

on:
  push:
    branches:
      - worker/laravel-aiwmweb-sync-reconciliation
    paths:
      - '.github/workflows/sync-test-helper-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Sync focused test with actual job and verifier contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/backend/tests/Feature/Sync/SyncReconciliationRuntimeTest.php')
          text = path.read_text(encoding='utf-8')

          assert text.count('$job->runId') == 1, 'expected obsolete ProcessSyncRunJob property assertion'
          text = text.replace('$job->runId', '$job->syncRunId')

          binding = '$this->app->instance(SyncWebhookVerifier::class, new FakeWebhookVerifier($event));'
          assert text.count(binding) == 2, 'expected two verifier bindings'
          first = '$verifier = new FakeWebhookVerifier($event);\n        $this->app->instance(SyncWebhookVerifier::class, $verifier);'
          text = text.replace(binding, first, 1)
          text = text.replace(binding, '$verifier->event = $event;', 1)

          constructor = 'public function __construct(private readonly array $event) {}'
          assert text.count(constructor) == 1, 'expected immutable fake verifier event constructor'
          text = text.replace(constructor, 'public function __construct(public array $event) {}')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'Laravel AIWMWeb Sync Closure'
          git config user.email 'sync-closure@example.invalid'
          git add variants/laravel-aiwmweb/backend/tests/Feature/Sync/SyncReconciliationRuntimeTest.php
          git commit -m 'test(sync): align focused assertions with runtime contracts'
          git push origin HEAD:worker/laravel-aiwmweb-sync-reconciliation

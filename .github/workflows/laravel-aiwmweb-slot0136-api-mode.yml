name: Laravel AIWMWeb Slot 0136 API Evidence Mode

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-CONT-2F2E40D7F0-slot0136

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add fail-closed pre-tenant session-auth provenance mode
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py')
          text = path.read_text()
          needle = '''    if mode == "tenant_neutral":
        require("web" in route_low and "auth" not in route_low and "tenant.context" not in route_low,
                f"explicit tenant-neutral API provenance route boundary is not neutral: {operation_id}")
'''
          replacement = '''    if mode == "pre_tenant_session_auth":
        require("auth::attempt" in action_low,
                f"explicit pre-tenant session-auth API provenance lacks credential authentication: {operation_id}")
        require("session()->regenerate()" in action_low,
                f"explicit pre-tenant session-auth API provenance lacks session fixation protection: {operation_id}")
        require("assertauthenticatedas" in test_low or "assertauthenticated(" in test_low,
                f"explicit pre-tenant session-auth API provenance lacks successful authenticated-session acceptance: {operation_id}")
        require("assertstatus(422)" in test_low and "assertguest()" in test_low,
                f"explicit pre-tenant session-auth API provenance lacks invalid-credential fail-closed acceptance: {operation_id}")
        require("assertcontains('web'" in test_low,
                f"explicit pre-tenant session-auth API provenance lacks web-session middleware acceptance: {operation_id}")
        require("assertnotcontains('auth'" in test_low and "assertnotcontains('tenant.context'" in test_low,
                f"explicit pre-tenant session-auth API provenance does not prove anonymous pre-tenant reachability: {operation_id}")
        require("parameternames" in test_low and "assertsame([]," in test_low,
                f"explicit pre-tenant session-auth API provenance lacks zero-route-parameter acceptance: {operation_id}")
        signals.extend([
            "middleware:web",
            "auth:credential-boundary",
            "tenant:pre-context",
            "route:no-parameters",
            "session:regenerated",
            "test:authenticated",
            "test:invalid-credentials-422",
        ])
        return signals

    if mode == "tenant_neutral":
        require("web" in route_low and "auth" not in route_low and "tenant.context" not in route_low,
                f"explicit tenant-neutral API provenance route boundary is not neutral: {operation_id}")
'''
          if needle not in text:
              raise SystemExit('security-mode insertion point not found')
          text = text.replace(needle, replacement, 1)

          needle = '''            action_stem = Path(action_path).stem.lower()
            require(action_stem in destination_low,
                    f"explicit route/API destination is not wired to declared action: {operation_id}")
            signals = security_signals(kind, mode, destination, action, acceptance, operation_id)
'''
          replacement = '''            action_stem = Path(action_path).stem.lower()
            require(action_stem in destination_low,
                    f"explicit route/API destination is not wired to declared action: {operation_id}")
            if kind == "api" and mode == "pre_tenant_session_auth":
                action_method = str(evidence.get("action_method") or "").strip()
                require(bool(action_method),
                        f"explicit pre-tenant session-auth API provenance is missing action_method: {operation_id}")
                method_low = action_method.lower()
                require(re.search(rf"function\\s+{re.escape(method_low)}\\s*\\(", action.lower()),
                        f"explicit pre-tenant session-auth API provenance action method is absent: {operation_id}")
                require(
                    re.search(
                        rf"route::post\\s*\\(\\s*['\\\"][^'\\\"]*{re.escape(literals[-1])}[^'\\\"]*['\\\"]\\s*,\\s*\\[[^\\]]*{re.escape(action_stem)}[^\\]]*['\\\"]{re.escape(method_low)}['\\\"]",
                        destination_low,
                    ) is not None,
                    f"explicit pre-tenant session-auth API provenance lacks exact POST/action binding: {operation_id}",
                )
            signals = security_signals(kind, mode, destination, action, acceptance, operation_id)
'''
          if needle not in text:
              raise SystemExit('action-binding insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
      - name: Strengthen operation-linked login acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/backend/tests/Feature/ContentBackendTerminalityTest.php')
          text = path.read_text()
          text = text.replace(
              "use App\\Models\\User;\n",
              "use App\\Http\\Controllers\\DemoController;\nuse App\\Models\\User;\n",
              1,
          )
          text = text.replace(
              "use Illuminate\\Support\\Facades\\Hash;\n",
              "use Illuminate\\Support\\Facades\\Hash;\nuse Illuminate\\Support\\Facades\\Route;\n",
              1,
          )
          needle = '''final class ContentBackendTerminalityTest extends TestCase
{
    use RefreshDatabase;

'''
          replacement = '''final class ContentBackendTerminalityTest extends TestCase
{
    use RefreshDatabase;

    private const LOGIN_OPERATION_ID = 'AIMW-CONT-2F2E40D7F0';

    public function test_login_operation_is_bound_to_anonymous_pre_tenant_session_route(): void
    {
        $route = collect(Route::getRoutes())->first(
            fn ($candidate): bool => $candidate->uri() === 'api/login' && in_array('POST', $candidate->methods(), true)
        );

        $this->assertNotNull($route, self::LOGIN_OPERATION_ID);
        $this->assertSame(DemoController::class.'@login', $route->getActionName());
        $this->assertContains('web', $route->gatherMiddleware());
        $this->assertNotContains('auth', $route->gatherMiddleware());
        $this->assertNotContains('tenant.context', $route->gatherMiddleware());
        $this->assertSame([], $route->parameterNames());
    }

'''
          if needle not in text:
              raise SystemExit('test insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
      - name: Static guard checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py
          grep -F "pre_tenant_session_auth" variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py
          grep -F "AIMW-CONT-2F2E40D7F0" variants/laravel-aiwmweb/backend/tests/Feature/ContentBackendTerminalityTest.php
          git diff --check
      - name: Commit verifier and acceptance hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            variants/laravel-aiwmweb/backend/tests/Feature/ContentBackendTerminalityTest.php
          git commit -m 'test(laravel): prove pre-tenant login API provenance'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Remove temporary patch runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/laravel-aiwmweb-slot0136-api-mode.yml
          git add .github/workflows/laravel-aiwmweb-slot0136-api-mode.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci(laravel): remove slot 0136 API-mode runner'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

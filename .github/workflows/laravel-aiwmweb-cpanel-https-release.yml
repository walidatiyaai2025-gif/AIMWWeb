name: Laravel AIWMWeb cPanel HTTPS Pull Release

# Publishing never contacts the hosting server. cPanel initiates HTTPS GETs
# from its private CLI cron job and verifies a rotated Ed25519 signer locally.
on:
  workflow_run:
    workflows:
      - Laravel AIWMWeb Acceptance
      - Laravel AIWMWeb cPanel Setup ZIP
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: laravel-aiwmweb-cpanel-https-release
  cancel-in-progress: false

jobs:
  publish-signed-for-pull:
    if: >-
      vars.AIWM_HTTPS_CD_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    environment: aiwm-cpanel-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AIWM_MIN_SUPPORTED_VERSION: ${{ vars.AIWM_MIN_SUPPORTED_VERSION }}
      AIWM_SIGNER_ROTATED: ${{ secrets.AIWM_UPDATES_SIGNER_ROTATED }}
      AIWM_CPANEL_ACCEPTANCE_VERIFIED: ${{ secrets.AIWM_CPANEL_ACCEPTANCE_VERIFIED }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Gate on exact latest main and both required completed push CI
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == 'refs/heads/main' || "$GITHUB_EVENT_NAME" == 'workflow_run' ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" > "$RUNNER_TEMP/current-main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/push-runs.json"
          if ! python3 variants/laravel-aiwmweb/tools/release/verify-production-ci.py \
            "$RUNNER_TEMP/current-main.json" "$RUNNER_TEMP/push-runs.json" "$SOURCE_SHA"; then
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo 'BLOCKED: no valid current-main release candidate' >&2
              exit 1
            fi
            echo 'NOT_PUBLISHED: candidate stale or CI incomplete/failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id="$(jq -r --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .name == "Laravel AIWMWeb cPanel Setup ZIP"
              and .event == "push" and .status == "completed"
              and .conclusion == "success")]
            | sort_by(.updated_at, .id) | last | .id // empty
          ' "$RUNNER_TEMP/push-runs.json")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'BLOCKED: no matching cPanel build'; exit 1; }
          number="$(jq -r --argjson id "$id" '.workflow_runs[] | select(.id == $id) | .run_number' "$RUNNER_TEMP/push-runs.json")"
          [[ "$number" =~ ^[0-9]+$ ]] || exit 1
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "build_run=$id" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$number" >> "$GITHUB_OUTPUT"

      - name: Enable trusted PHP 8.4 sodium signer
        if: steps.gate.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip
          coverage: none

      - name: Verify signer rotation, cPanel upgrade acceptance and exact public key
        if: steps.gate.outputs.ready == 'true'
        env:
          AIWM_UPDATES_SECRET_KEY: ${{ secrets.AIWM_UPDATES_SECRET_KEY }}
          AIWM_TRUSTED_KEY: ${{ secrets.AIWM_UPDATES_TRUSTED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$AIWM_SIGNER_ROTATED" == 'yes' ]] || { echo 'BLOCKED: signer rotation not attested'; exit 1; }
          [[ "$AIWM_CPANEL_ACCEPTANCE_VERIFIED" == 'yes' ]] || { echo 'BLOCKED: real cPanel upgrade/backup acceptance not attested'; exit 1; }
          [[ "$AIWM_MIN_SUPPORTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'BLOCKED: explicit minimum installed version required'; exit 1; }
          php -r '
            $secret=base64_decode((string)getenv("AIWM_UPDATES_SECRET_KEY"), true);
            $public=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            if (!is_string($secret) || strlen($secret)!==SODIUM_CRYPTO_SIGN_SECRETKEYBYTES ||
                !is_string($public) || strlen($public)!==SODIUM_CRYPTO_SIGN_PUBLICKEYBYTES ||
                !hash_equals($public,sodium_crypto_sign_publickey_from_secretkey($secret))) {
              fwrite(STDERR,"BLOCKED: production signing key mismatches cPanel verifier\n");
              exit(1);
            }'

      - name: Download exact tested cPanel Setup ZIP
        if: steps.gate.outputs.ready == 'true'
        env:
          BUILD_RUN: ${{ steps.gate.outputs.build_run }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpanel-source" "$RUNNER_TEMP/signed"
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "AIWMWeb-Laravel-cPanel-$SOURCE_SHA" \
            --dir "$RUNNER_TEMP/cpanel-source"
          test -s "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip"
          python3 variants/laravel-aiwmweb/tools/deploy/prepare_signed_deploy.py \
            "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip" \
            variants/laravel-aiwmweb/backend "$SOURCE_SHA" "$VERSION"

      - name: Sign and verify production update ZIP
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          AIWM_UPDATES_SECRET_KEY: ${{ secrets.AIWM_UPDATES_SECRET_KEY }}
          AIWM_TRUSTED_KEY: ${{ secrets.AIWM_UPDATES_TRUSTED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          php variants/laravel-aiwmweb/tools/release/build-signed-update.php \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/signed"
          python3 variants/laravel-aiwmweb/tools/release/verify-signed-update-compat.py \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-update.zip"
          unzip -t "$RUNNER_TEMP/signed/AIWMWeb-Laravel-signed-bundle.zip" >/dev/null
          php -r '
            $raw=file_get_contents($argv[1]);
            $sig=base64_decode(trim(file_get_contents($argv[2])), true);
            $key=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            $manifest=json_decode($raw, true, 512, JSON_THROW_ON_ERROR);
            if (!is_string($sig) || !is_string($key) ||
                !sodium_crypto_sign_verify_detached($sig, $raw, $key) ||
                $manifest["sha"] !== getenv("SOURCE_SHA") ||
                $manifest["version"] !== getenv("VERSION") ||
                $manifest["minimum_supported_version"] !== getenv("AIWM_MIN_SUPPORTED_VERSION") ||
                !hash_equals($manifest["sha256"],hash_file("sha256",$argv[3]))) {
                fwrite(STDERR,"BLOCKED: production update origin/signature/integrity mismatch\n");
                exit(1);
            }' \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-release.sig" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-update.zip"

      - name: Recheck immutable main CI and publish signed Setup plus Update
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" > "$RUNNER_TEMP/current-main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/push-runs.json"
          python3 variants/laravel-aiwmweb/tools/release/verify-production-ci.py \
            "$RUNNER_TEMP/current-main.json" "$RUNNER_TEMP/push-runs.json" "$SOURCE_SHA"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/release.json"
            jq -e --arg sha "$SOURCE_SHA" --arg version "$VERSION" '
              .target_commitish == $sha and (.draft == false) and (.prerelease == false)
              and (["AIWMWeb-Laravel-update.zip", "AIWMWeb-Laravel-signed-bundle.zip",
                    "AIWMWeb-Laravel-release.json", "AIWMWeb-Laravel-release.sig",
                    ("AIWMWeb-Setup-v" + $version + ".zip")]
                   - [.assets[].name] | length == 0)
            ' "$RUNNER_TEMP/release.json" >/dev/null || {
              echo 'BLOCKED: release tag exists but does not match signed source' >&2
              exit 1
            }
            echo "SIGNED_RELEASE_ALREADY_PUBLISHED=v$VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip" "$RUNNER_TEMP/signed/"
          unzip -p "$RUNNER_TEMP/signed/AIWMWeb-Setup-v$VERSION.zip" BUILD-INFO.json > "$RUNNER_TEMP/signed/BUILD-INFO.json"
          unzip -p "$RUNNER_TEMP/signed/AIWMWeb-Setup-v$VERSION.zip" RELEASE-NOTES.txt > "$RUNNER_TEMP/signed/RELEASE-NOTES.txt"
          (
            cd "$RUNNER_TEMP/signed"
            sha256sum AIWMWeb-Setup-v"$VERSION".zip AIWMWeb-Laravel-update.zip \
              AIWMWeb-Laravel-signed-bundle.zip AIWMWeb-Laravel-release.json \
              AIWMWeb-Laravel-release.sig > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "AIWMWeb Laravel v$VERSION" \
            --notes "Signed release from green main SHA $SOURCE_SHA. Available for verification and automatic pull by cPanel Cron; this publication alone does NOT claim a live deployment." \
            "$RUNNER_TEMP/signed/AIWMWeb-Setup-v$VERSION.zip" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-signed-bundle.zip" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-update.zip" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/signed/AIWMWeb-Laravel-release.sig" \
            "$RUNNER_TEMP/signed/BUILD-INFO.json" \
            "$RUNNER_TEMP/signed/RELEASE-NOTES.txt" \
            "$RUNNER_TEMP/signed/SHA256SUMS.txt"
          echo "PUBLISHED_SIGNED_HTTPS_RELEASE=v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_DEPLOYMENT_NOT_VERIFIED: cPanel pulls separately on Cron." >> "$GITHUB_STEP_SUMMARY"

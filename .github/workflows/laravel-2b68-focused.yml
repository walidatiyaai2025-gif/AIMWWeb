name: Laravel 2B68 Focused Validation

on:
  push:
    branches:
      - worker/laravel-comm-2b682f7bec-back-to-explorer

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Focused PHP tenant and IDOR acceptance
        run: php artisan test --filter=CommentsBackToExplorerControlTerminalityTest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - run: npm ci
      - run: npm run typecheck
      - name: Focused React control acceptance
        run: npm test -- --run resources/js/__tests__/comments-back-to-explorer-control.test.tsx

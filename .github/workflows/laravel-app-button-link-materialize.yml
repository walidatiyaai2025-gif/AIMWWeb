name: Laravel AppButton Link Materialize

on:
  push:
    branches:
      - worker/laravel-AIMW-PLAT-827A8F1C0D-app-button-link

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_SHA: 0d2c49506b81103db037eea7c10b20fbc559e982
      EVIDENCE_SHA: 565925e450c5cc7a99e100d29b294cc4973f7e63
      OPERATION_ID: AIMW-PLAT-827A8F1C0D
      PRESERVED_OPERATION_ID: AIMW-PLAT-57E0113F24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json

      - name: Run focused frontend validation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- resources/js/__tests__/app-button-link-control.test.tsx resources/js/__tests__/app-button-click-control.test.tsx

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register exact pushed evidence provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text())
          data['previous_reconciliation_sha'] = os.environ['BASE_SHA']
          data['focused_closure_evidence_source_sha'] = os.environ['EVIDENCE_SHA']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Run official reconciliation generator chain
        shell: bash
        run: |
          set -euo pipefail
          OUT=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT" --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Guard exactly one canonical state transition
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA":variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json > /tmp/base.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          before = json.loads(Path('/tmp/base.json').read_text())
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          op = os.environ['OPERATION_ID']
          preserved = os.environ['PRESERVED_OPERATION_ID']
          assert after['totals']['total'] == 931, after['totals']
          assert after['totals']['terminal'] == 583, after['totals']
          assert after['totals']['pending'] == 348, after['totals']
          assert after['totals']['blocked'] == 0, after['totals']
          b = {row['operation_id']: row for row in before['operations']}
          a = {row['operation_id']: row for row in after['operations']}
          changed = [(oid, b[oid]['migration_state'], a[oid]['migration_state']) for oid in a if b[oid]['migration_state'] != a[oid]['migration_state']]
          assert changed == [(op, 'PENDING', 'ADAPTED')], changed
          assert a[op]['acceptance_test'] == 'variants/laravel-aiwmweb/backend/resources/js/__tests__/app-button-link-control.test.tsx'
          assert a[op]['laravel_destination'] == 'variants/laravel-aiwmweb/backend/resources/js/app-button.tsx'
          assert a[preserved]['migration_state'] == 'ADAPTED'
          assert after['domains']['platform']['terminal'] == 18, after['domains']['platform']
          assert after['domains']['platform']['pending'] == 0, after['domains']['platform']
          print('guard-ok', changed, after['totals'], after['domains']['platform'])
          PY

      - name: Commit canonical materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(laravel): materialize AppButton link parity closure'
          git push origin HEAD:worker/laravel-AIMW-PLAT-827A8F1C0D-app-button-link

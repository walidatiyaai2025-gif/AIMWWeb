name: Laravel AIWMWeb Slot 0029 Minimize Diff

on:
  push:
    branches:
      - manager/laravel-aiwmweb-post-390-reconciliation
    paths:
      - '.github/workflows/laravel-aiwmweb-slot-0029-minimize-diff.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore canonical formatting and apply scoped registration
        shell: bash
        run: |
          set -euo pipefail
          path='variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
          git show af67f421f2850ccb7afc8089aaad15149f7a636a:"$path" > "$path"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          text = path.read_text(encoding='utf-8')
          old = '  "previous_reconciliation_sha": "d352543f2f3c52383670f2c25e3a3b7ed04fb7f8",'
          new = '  "previous_reconciliation_sha": "af67f421f2850ccb7afc8089aaad15149f7a636a",'
          if text.count(old) != 1:
              raise SystemExit('unexpected previous_reconciliation_sha source')
          text = text.replace(old, new, 1)

          marker = '\n  ],\n  "excluded_sources": []'
          if text.count(marker) != 1:
              raise SystemExit('unexpected countable_sources terminator')
          source = '''\n    ,{\n      "label": "Canonical AI Center route closure after PR #390 integration",\n      "sha": "af67f421f2850ccb7afc8089aaad15149f7a636a",\n      "observed_pr_head": "6d135cc0aaac7c367ced659538e942475e270e0e",\n      "domains": ["ai"],\n      "supporting_only": true,\n      "route_api_provenance": {\n        "AIMW-AI-82F795EE67": {"destination_path":"variants/laravel-aiwmweb/backend/app/Providers/AiCenterRouteServiceProvider.php","action_path":"variants/laravel-aiwmweb/backend/app/Http/Controllers/AiCenterReadController.php","acceptance_test":"variants/laravel-aiwmweb/backend/tests/Feature/AiCenterRouteTerminalityTest.php","operation_link_test":"variants/laravel-aiwmweb/backend/tests/Feature/AiCenterRouteTerminalityTest.php","evidence_path":"variants/laravel-aiwmweb/docs/closure-evidence/ai-center-route-terminality.json","security_mode":"tenant_bound"}\n      }\n    }'''
          text = text.replace(marker, source + marker, 1)
          path.write_text(text, encoding='utf-8')

          manifest = json.loads(text)
          matches = [s for s in manifest['countable_sources'] if 'AIMW-AI-82F795EE67' in (s.get('route_api_provenance') or {})]
          assert len(matches) == 1, matches
          assert manifest['previous_reconciliation_sha'] == 'af67f421f2850ccb7afc8089aaad15149f7a636a'
          PY

      - name: Regenerate and verify scoped parity delta
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha af67f421f2850ccb7afc8089aaad15149f7a636a
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          t = p['totals']
          assert (t['total'], t['terminal'], t['pending'], t['blocked']) == (931, 467, 464, 0), t
          row = next(r for r in p['operations'] if r['operation_id'] == 'AIMW-AI-82F795EE67')
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['evidence_mode'] == 'explicit_route_api_contract', row
          assert p['validation']['passed'] is True
          PY

      - name: Commit scoped reconciliation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/laravel-aiwmweb-slot-0029-minimize-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/laravel-aiwmweb-slot-0029-minimize-diff.yml
          git commit -m "Tighten AIMW-AI-82F795EE67 reconciliation diff"
          git push origin HEAD:manager/laravel-aiwmweb-post-390-reconciliation

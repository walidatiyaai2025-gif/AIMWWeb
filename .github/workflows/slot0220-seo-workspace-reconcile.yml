name: Slot0220 SEO workspace reconciliation

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-SEO-4CBBC7AAD9-slot0220

permissions:
  contents: write

jobs:
  reconcile-and-clean:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Focused Laravel acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          php artisan migrate:fresh --force
          vendor/bin/pint --test tests/Feature/SeoWorkspaceRouteTerminalityTest.php
          php artisan test tests/Feature/SeoWorkspaceRouteTerminalityTest.php

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enroll exact pushed route provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          operation_id = 'AIMW-SEO-4CBBC7AAD9'
          for source in payload.get('countable_sources', []):
              if operation_id in (source.get('route_api_provenance') or {}):
                  raise SystemExit(f'duplicate route_api_provenance: {operation_id}')
              if operation_id in (source.get('operation_evidence') or {}):
                  raise SystemExit(f'duplicate operation_evidence: {operation_id}')

          payload['countable_sources'].append({
              'label': 'Slot0220 SEO workspace route exact provenance',
              'sha': 'd7ed8030da65376f9d0c43380fb6c80c1ee87508',
              'observed_pr_head': 'd7ed8030da65376f9d0c43380fb6c80c1ee87508',
              'domains': ['seo'],
              'supporting_only': True,
              'route_api_provenance': {
                  operation_id: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/SeoVisibleControlRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/SeoVisibleControlController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SeoWorkspaceRouteTerminalityTest.php',
                      'operation_link_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SeoWorkspaceRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/seo-workspace-route-terminality.json',
                      'security_mode': 'tenant_selected'
                  }
              }
          })
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Regenerate canonical parity artifacts
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Assert one-operation legal delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          rows = {row['operation_id']: row for row in p['operations']}
          op = rows['AIMW-SEO-4CBBC7AAD9']
          assert op['migration_state'] == 'ADAPTED', op
          totals = p['totals']
          assert totals['total_operations'] == 931, totals
          assert totals['terminal'] == 517, totals
          assert totals['pending'] == 414, totals
          assert totals['blocked'] == 0, totals
          assert rows['AIMW-SEO-5F71B89C92']['migration_state'] == 'PENDING'
          print('Slot0220 generator result:', totals)
          PY
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

      - name: Commit exact generator outputs and remove temporary workflow
        run: |
          git config user.name 'walidatiyaai2025-gif'
          git config user.email 'walidatiyaai2025@gmail.com'
          git rm .github/workflows/slot0220-seo-workspace-reconcile.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git commit -m 'chore(laravel): reconcile SEO workspace route parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-SEO-4CBBC7AAD9-slot0220

name: Laravel AIWMWeb Handoff

on:
  workflow_dispatch:
    inputs:
      command:
        description: Handoff command
        required: true
        type: choice
        default: promote
        options:
          - bootstrap
          - promote
          - advance
          - claim
          - heartbeat
          - release
          - reclaim
      issue_number:
        description: Issue number for claim/heartbeat/release/reclaim
        required: false
        type: string
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [closed]
    branches:
      - main
      - lead/laravel-aiwmweb-final-convergence
      - worker/laravel-aiwmweb-closure-composition

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: laravel-aiwmweb-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMMAND: ${{ inputs.command || 'promote' }}
      INPUT_ISSUE: ${{ inputs.issue_number || '' }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      PR_MERGED: ${{ github.event.pull_request.merged || false }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
    steps:
      - name: Bootstrap labels
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" --force >/dev/null
          }
          ensure_label "handoff:ready" "0E8A16" "Ready for a worker; dependencies are clear."
          ensure_label "handoff:next" "1D76DB" "Highest-priority ready handoff candidate."
          ensure_label "handoff:active" "FBCA04" "Claimed by a worker; do not duplicate."
          ensure_label "handoff:blocked" "D93F0B" "Blocked by an external dependency."
          ensure_label "handoff:umbrella" "5319E7" "Coordination-only umbrella; never directly claimed."
          ensure_label "handoff:done" "8250DF" "Execution unit completed and integrated."
          ensure_label "migration:approved" "B60205" "Explicit approval for a destructive migration change."

      - name: Apply merged-PR handoff
        if: github.event_name == 'pull_request' && env.PR_MERGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "$PR_BODY" | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' | grep -Eo '[0-9]+' | sort -u || true)
          for issue in "${refs[@]}"; do
            labels="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')"
            if grep -Eq 'handoff:(ready|next|active|blocked)' <<<"$labels"; then
              gh issue edit "$issue" --repo "$REPO" --remove-label "handoff:ready" --remove-label "handoff:next" --remove-label "handoff:active" --remove-label "handoff:blocked" >/dev/null 2>&1 || true
              gh issue edit "$issue" --repo "$REPO" --add-label "handoff:done" >/dev/null
              gh issue close "$issue" --repo "$REPO" --reason completed >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "HANDOFF_DONE via merged PR #$PR_NUMBER." >/dev/null
            fi
          done

      - name: Execute explicit handoff command
        if: github.event_name == 'workflow_dispatch' && inputs.command != 'bootstrap' && inputs.command != 'promote' && inputs.command != 'advance'
        shell: bash
        run: |
          set -euo pipefail
          issue="$INPUT_ISSUE"
          [[ "$issue" =~ ^[0-9]+$ ]] || { echo "::error::issue_number is required."; exit 1; }

          labels="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')"
          state="$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state')"
          [[ "$state" == "OPEN" ]] || { echo "::error::Issue #$issue is not open."; exit 1; }

          case "$COMMAND" in
            claim)
              if grep -Eq 'handoff:(umbrella|blocked|done)' <<<"$labels"; then
                echo "::error::Issue #$issue is not claimable: $labels"
                exit 1
              fi
              if grep -q 'handoff:active' <<<"$labels"; then
                echo "::error::Issue #$issue already has an active lease."
                exit 1
              fi
              gh issue edit "$issue" --repo "$REPO" --remove-label "handoff:ready" --remove-label "handoff:next" >/dev/null 2>&1 || true
              gh issue edit "$issue" --repo "$REPO" --add-label "handoff:active" >/dev/null
              gh issue comment "$issue" --repo "$REPO" --body "handoff-lease:v1 owner=$GITHUB_ACTOR started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
              ;;
            heartbeat)
              grep -q 'handoff:active' <<<"$labels" || { echo "::error::Issue #$issue is not active."; exit 1; }
              gh issue comment "$issue" --repo "$REPO" --body "handoff-heartbeat:v1 owner=$GITHUB_ACTOR at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
              ;;
            release)
              gh issue edit "$issue" --repo "$REPO" --remove-label "handoff:active" >/dev/null 2>&1 || true
              gh issue edit "$issue" --repo "$REPO" --add-label "handoff:ready" >/dev/null
              gh issue comment "$issue" --repo "$REPO" --body "HANDOFF_RELEASED by $GITHUB_ACTOR." >/dev/null
              ;;
            reclaim)
              grep -q 'handoff:active' <<<"$labels" || { echo "::error::Issue #$issue is not active."; exit 1; }
              updated="$(gh issue view "$issue" --repo "$REPO" --json updatedAt --jq '.updatedAt')"
              python - "$updated" <<'PY'
          import datetime, sys
          updated = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - updated
          if age.total_seconds() < 1800:
              raise SystemExit("Active lease is newer than 30 minutes; refusing reclaim.")
          PY
              gh issue edit "$issue" --repo "$REPO" --remove-label "handoff:active" >/dev/null
              gh issue edit "$issue" --repo "$REPO" --add-label "handoff:ready" >/dev/null
              gh issue comment "$issue" --repo "$REPO" --body "HANDOFF_RECLAIMED after >=30m inactivity by $GITHUB_ACTOR." >/dev/null
              ;;
          esac

      - name: Checkout canonical composition for automatic advance
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.command == 'advance') ||
          (github.event_name == 'pull_request' && env.PR_MERGED == 'true' && env.PR_BASE == 'worker/laravel-aiwmweb-closure-composition')
        uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-closure-composition
          fetch-depth: 1

      - name: Seed next canonical pending unit when queue is empty
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.command == 'advance') ||
          (github.event_name == 'pull_request' && env.PR_MERGED == 'true' && env.PR_BASE == 'worker/laravel-aiwmweb-closure-composition')
        shell: bash
        run: |
          set -euo pipefail

          queued="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,labels \
            --jq '[.[] | select(.labels | map(.name) | any(. == "handoff:active" or . == "handoff:next" or . == "handoff:ready"))] | length')"
          if [[ "$queued" != "0" ]]; then
            echo "HANDOFF_ADVANCE=QUEUE_PRESENT"
            exit 0
          fi

          reconciliation="variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json"
          [[ -f "$reconciliation" ]] || {
            echo "::error title=Missing canonical reconciliation::$reconciliation is required to advance the Laravel handoff."
            exit 1
          }

          python - "$reconciliation" > /tmp/next-pending.env <<'PY'
          import json
          import shlex
          import sys

          path = sys.argv[1]
          payload = json.load(open(path, encoding="utf-8"))
          totals = payload.get("totals", {})
          pending = int(totals.get("pending", 0))
          operations = payload.get("operations", [])
          row = next((item for item in operations if item.get("migration_state") == "PENDING"), None)

          print("PENDING_COUNT=" + shlex.quote(str(pending)))
          if pending == 0:
              print("PROJECT_COMPLETE=true")
              raise SystemExit(0)
          if row is None:
              raise SystemExit("pending total is non-zero but no PENDING operation row exists")

          def emit(key, value):
              value = "" if value is None else str(value)
              print(f"{key}=" + shlex.quote(value))

          emit("PROJECT_COMPLETE", "false")
          emit("OP_ID", row.get("operation_id"))
          emit("OP_DOMAIN", row.get("domain"))
          emit("OP_RISK", row.get("risk"))
          emit("OP_ROUTE", row.get("route_screen"))
          emit("OP_CONTROL", row.get("visible_control"))
          emit("OP_SOURCE", row.get("current_source"))
          PY
          source /tmp/next-pending.env

          if [[ "$PROJECT_COMPLETE" == "true" ]]; then
            echo "HANDOFF_COMPLETE=TRUE"
            echo "Canonical reconciliation has PENDING=0; no new leaf created."
            exit 0
          fi

          [[ -n "$OP_ID" ]] || {
            echo "::error title=Invalid canonical pending row::operation_id is empty."
            exit 1
          }

          existing_issue="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --search "$OP_ID in:title,body" \
            --json number,title,labels \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            labels="$(gh issue view "$existing_issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')"
            if ! grep -Eq 'handoff:(active|blocked|done|umbrella)' <<<"$labels"; then
              gh issue edit "$existing_issue" --repo "$REPO" --add-label "handoff:ready" >/dev/null
            fi
            echo "HANDOFF_ADVANCE=REUSED_ISSUE"
            echo "HANDOFF_ISSUE=#$existing_issue"
            exit 0
          fi

          op_lc="$(printf '%s' "$OP_ID" | tr '[:upper:]' '[:lower:]')"
          branch_hint="$(gh api --paginate "repos/$REPO/branches?per_page=100" \
            --jq '.[] | .name' | awk -v needle="$op_lc" 'tolower($0) ~ needle {print; exit}')"
          pr_hint="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,title,headRefName,body \
            --jq --arg op "$OP_ID" '[.[] | select((.title // "" | contains($op)) or (.body // "" | contains($op)) or (.headRefName // "" | ascii_downcase | contains($op | ascii_downcase)))] | .[0].number // empty')"

          display="${OP_CONTROL:-${OP_ROUTE:-canonical pending operation}}"
          title="[Laravel Handoff] $OP_ID — $display"
          body_file="/tmp/handoff-body.md"
          cat > "$body_file" <<EOF
          Authority: #257
          Repo operating system: #589

          ## Canonical operation
          - Operation ID: $OP_ID
          - Domain: ${OP_DOMAIN:-unknown}
          - Risk: ${OP_RISK:-unknown}
          - Source: ${OP_SOURCE:-unknown}
          - Route/screen: ${OP_ROUTE:-unknown}
          - Visible control: ${OP_CONTROL:-unknown}

          ## Existing lineage discovered by advance
          - Branch hint: ${branch_hint:-none}
          - Open PR hint: ${pr_hint:-none}

          ## Single execution unit
          Close exactly this canonical PENDING operation. Reconstruct live GitHub state first and reuse any existing branch/PR lineage for this operation. Do not create retry/v2/final duplicates while recoverable lineage exists.

          ## Acceptance
          - preserve Laravel variant boundary and tenant/security invariants from AGENTS.md and #257;
          - implement the complete real vertical slice with deterministic tests/evidence;
          - official parity materialization must transition exactly the intended operation without hand-editing counts;
          - required exact-head Plan Link, Repo Hygiene, Cross-Domain Security, Parity Reconciliation, Convergence Preflight and Laravel Acceptance gates must be green;
          - merge only into worker/laravel-aiwmweb-closure-composition;
          - after merge, post-merge exact-head gates must be green and handoff must advance again.

          Refs #257
          Refs #589
          EOF

          new_url="$(gh issue create --repo "$REPO" \
            --title "$title" \
            --body-file "$body_file" \
            --label "handoff:ready")"
          new_issue="${new_url##*/}"
          [[ "$new_issue" =~ ^[0-9]+$ ]] || {
            echo "::error title=Unable to create next handoff leaf::Unexpected issue reference: $new_url"
            exit 1
          }

          echo "HANDOFF_ADVANCE=CREATED"
          echo "HANDOFF_ISSUE=#$new_issue"
          echo "HANDOFF_OPERATION=$OP_ID"
          echo "HANDOFF_PENDING_COUNT=$PENDING_COUNT"

      - name: Promote next ready unit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t current_next < <(gh issue list --repo "$REPO" --state open --label "handoff:next" --limit 100 --json number --jq '.[].number')
          for issue in "${current_next[@]}"; do
            gh issue edit "$issue" --repo "$REPO" --remove-label "handoff:next" >/dev/null 2>&1 || true
          done

          next="$(gh issue list --repo "$REPO" --state open --label "handoff:ready" --limit 100             --json number,createdAt,labels             --jq '[.[] | select((.labels | map(.name) | index("handoff:blocked") | not) and (.labels | map(.name) | index("handoff:umbrella") | not) and (.labels | map(.name) | index("handoff:active") | not))] | sort_by(.createdAt) | .[0].number // empty')"

          if [[ -n "$next" ]]; then
            gh issue edit "$next" --repo "$REPO" --add-label "handoff:next" >/dev/null
            echo "HANDOFF_NEXT=#$next"
          else
            echo "HANDOFF_NEXT=NONE"
          fi

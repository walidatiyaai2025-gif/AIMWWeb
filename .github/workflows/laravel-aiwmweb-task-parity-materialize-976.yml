name: Laravel AIWMWeb Task Parity Materialize 976 (temporary)
on:
  push:
    branches:
      - worker/976-wordpress-site-users-search
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-976.yml'
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate operation parity with official seven-stage chain
        run: |
          set -euo pipefail
          OUT=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUM=/tmp/operation-parity-summary.json
          cp "$OUT" /tmp/976-parity-before.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python - <<'PY'
          import json
          old=json.load(open('/tmp/976-parity-before.json'))
          new=json.load(open('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'))
          before={r['operation_id']:r['migration_state'] for r in old['operations']}
          after={r['operation_id']:r['migration_state'] for r in new['operations']}
          changed={k:(before[k],after[k]) for k in before if before[k]!=after[k]}
          assert after['AIMW-SYNC-4FDCFDA33F']=='ADAPTED', after['AIMW-SYNC-4FDCFDA33F']
          assert after['AIMW-SYNC-21483C88FA']=='ADAPTED', after['AIMW-SYNC-21483C88FA']
          assert all(after[k] not in ('PENDING','BLOCKED') for k,v in before.items() if v in ('ADAPTED','PORTED','VERIFIED_UNAVAILABLE_EXTERNAL')), changed
          assert new['totals']['total']==931
          assert new['totals']['terminal']>=old['totals']['terminal']
          print('Verified #976 terminal and sibling #966 preserved:',changed)
          PY
      - name: Commit official reconciliation outputs
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize exact #976 WordPress site users search parity"
          git push origin "HEAD:${{ github.ref_name }}"

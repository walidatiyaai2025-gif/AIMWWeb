name: Sync Payload Materialize

on:
  push:
    branches:
      - worker/laravel-aiwmweb-sync-reconciliation
    paths:
      - '.github/workflows/sync-payload-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewed sync payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync-payload.part1
          test -f .sync-payload.part2
          test -f .sync-payload.part3
          cat .sync-payload.part1 .sync-payload.part2 .sync-payload.part3 | base64 --decode > /tmp/sync-payload.gz
          gzip -t /tmp/sync-payload.gz
          gzip -dc /tmp/sync-payload.gz > /tmp/sync-payload.tar
          tar -tf /tmp/sync-payload.tar > /tmp/sync-files.txt
          python3 - <<'PY'
          from pathlib import PurePosixPath
          allowed_roots = ("variants/laravel-aiwmweb/", ".github/workflows/laravel-aiwmweb-sync.yml")
          for raw in open('/tmp/sync-files.txt', encoding='utf-8'):
              name = raw.strip()
              if not name or name in ('.', './'):
                  continue
              clean = name[2:] if name.startswith('./') else name
              p = PurePosixPath(clean)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit(f'unsafe archive path: {name}')
              if clean.endswith('/'):
                  continue
              if not (clean.startswith(allowed_roots[0]) or clean == allowed_roots[1]):
                  raise SystemExit(f'out-of-scope archive path: {name}')
          PY
          tar -xf /tmp/sync-payload.tar -C . --exclude='./.github/workflows/laravel-aiwmweb-sync.yml'
          rm -f .sync-payload.part1 .sync-payload.part2 .sync-payload.part3
          if find . -maxdepth 1 -name '.sync-payload.part*' -print -quit | grep -q .; then
            echo 'staging payload remains' >&2
            exit 2
          fi
          git diff --check
          git config user.name 'Laravel AIWMWeb Sync Closure'
          git config user.email 'sync-closure@example.invalid'
          git add -A
          git status --short
          git commit -m 'feat(sync): materialize advanced reconciliation implementation'
          git push origin HEAD:worker/laravel-aiwmweb-sync-reconciliation

name: Worker Laravel Billing Save Recovery Pint

on:
  push:
    branches:
      - worker/laravel-bill-5af09adaba-save-plan-recovery-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[pint-formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Apply repository Pint rules to recovered Save plan files only
        run: vendor/bin/pint app/Http/Controllers/SubscriptionPlanSaveController.php app/Providers/SubscriptionPlansAdminRouteServiceProvider.php
      - name: Commit exact formatter output
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/backend/app/Http/Controllers/SubscriptionPlanSaveController.php variants/laravel-aiwmweb/backend/app/Providers/SubscriptionPlansAdminRouteServiceProvider.php
          git diff --cached --quiet && exit 0
          git commit -m 'style(laravel): apply Pint to recovered Save plan [pint-formatted]'
          git push origin HEAD:worker/laravel-bill-5af09adaba-save-plan-recovery-v2

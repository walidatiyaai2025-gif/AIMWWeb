name: Build

on:
  push:
    branches: [ main, "chore/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore .\AIWordPressManager.Web.sln --locked-mode

      - name: Build
        run: dotnet build .\AIWordPressManager.Web.sln --configuration Release --no-restore

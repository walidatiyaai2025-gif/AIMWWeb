name: Laravel AIWMWeb Post 1191 Parity Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-closure-composition
    paths:
      - '.github/workflows/laravel-aiwmweb-post-1191-parity-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve both merged closure evidence sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sources = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(sources.read_text())
          entries = [
              {
                  'label': 'AIMW-CONT-276925F148 GlobalContentHub dynamic site links focused closure',
                  'sha': 'aba6003ed1ea50b25b99b50b06488f240d31a132',
                  'observed_pr_head': 'aba6003ed1ea50b25b99b50b06488f240d31a132',
                  'operation_ids': ['AIMW-CONT-276925F148'],
              },
              {
                  'label': 'AIMW-CONT-F9015FDB11 Content Explorer ClearSelection focused closure',
                  'sha': '45f29f77f325389420a117426ae033ccced327a2',
                  'observed_pr_head': '45f29f77f325389420a117426ae033ccced327a2',
                  'operation_ids': ['AIMW-CONT-F9015FDB11'],
              },
          ]
          ops = {'AIMW-CONT-276925F148', 'AIMW-CONT-F9015FDB11'}
          for key in ('countable_sources', 'focused_closure_operation_sources'):
              rows = [
                  row for row in data[key]
                  if not ops.intersection(row.get('operation_ids', []))
              ]
              rows.extend(entries)
              data[key] = rows
          sources.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Run official parity materializer
        run: |
          set -euo pipefail
          OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          TMP_SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
      - name: Verify both merged closures remain terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'AIMW-CONT-276925F148': 'aba6003ed1ea50b25b99b50b06488f240d31a132',
              'AIMW-CONT-F9015FDB11': '45f29f77f325389420a117426ae033ccced327a2',
          }
          data = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          rows = {}
          def walk(node):
              if isinstance(node, dict):
                  op = node.get('operation_id')
                  if op in expected:
                      rows[op] = node
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(data)
          for op, sha in expected.items():
              row = rows.get(op)
              assert row, f'{op} missing'
              assert row.get('migration_state') == 'ADAPTED', row
              assert row.get('reconciliation', {}).get('source_sha') == sha, row
          assert data['totals']['adapted'] >= 790, data['totals']
          PY
      - name: Commit repaired reconciliation and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/laravel-aiwmweb-post-1191-parity-reconcile.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(laravel): preserve #770 and #772 parity evidence"
          git push origin "HEAD:${{ github.ref_name }}"

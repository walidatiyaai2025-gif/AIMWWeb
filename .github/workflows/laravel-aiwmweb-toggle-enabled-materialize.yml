name: Laravel AIWMWeb ToggleEnabled Materialize

on:
  push:
    branches:
      - worker/laravel-close-bill-812d1c53b6
    paths:
      - '.github/workflows/laravel-aiwmweb-toggle-enabled-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind focused evidence to exact pushed source head
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python - "$source_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['focused_closure_evidence_source_sha'] = sys.argv[1]
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Materialize canonical census and seven-stage reconciliation
        shell: bash
        run: |
          set -euo pipefail
          root='variants/laravel-aiwmweb'
          docs="$root/docs"
          tools="$root/tools"

          python "$tools/capability_census.py" --write
          python "$tools/finalize_operation_parity.py" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_tenant_neutral_route_evidence.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_platform_admin_route_evidence.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_explicit_route_api_provenance.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_focused_closure_evidence.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_focused_service_evidence.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$tools/apply_focused_background_job_evidence.py" \
            --input "$docs/operation-parity-reconciliation.json" \
            --output "$docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$docs/operation-parity-reconciliation.md" \
            --check-total 931

      - name: Commit generated authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/capability-parity-ledger.json \
            variants/laravel-aiwmweb/docs/CAPABILITY_PARITY_LEDGER.md \
            variants/laravel-aiwmweb/docs/dead-function-census.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(laravel): materialize AIMW-BILL-812D1C53B6 reconciliation [parity-materialized]'
          git push origin HEAD:worker/laravel-close-bill-812d1c53b6

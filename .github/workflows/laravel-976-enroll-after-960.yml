name: Laravel 976 canonical parity after 960 verified merge

on:
  push:
    branches:
      - worker/976-wordpress-site-users-search
    paths:
      - '.github/workflows/laravel-976-enroll-after-960.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    env:
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for actual #960 merged ancestry in the canonical #976 branch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          leaf="worker/976-wordpress-site-users-search"
          base="worker/laravel-aiwmweb-closure-composition"
          for attempt in $(seq 1 145); do
            if [ "$(gh api "repos/$repo/pulls/1350" --jq '.merged')" = "true" ]; then
              merge_sha="$(gh api "repos/$repo/pulls/1350" --jq '.merge_commit_sha')"
              git fetch origin "+refs/heads/$leaf:refs/remotes/origin/$leaf" "+refs/heads/$base:refs/remotes/origin/$base"
              if git merge-base --is-ancestor "$merge_sha" "refs/remotes/origin/$leaf"; then
                echo "MERGED_960_ANCESTOR=$merge_sha"
                git checkout -B "$leaf" "refs/remotes/origin/$leaf"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Canonical #976 branch does not yet contain #960 integration; preserving it" >&2
          exit 1
      - name: Enroll exactly the existing pushed #976 source evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          d=json.loads(p.read_text())
          op='AIMW-SYNC-4FDCFDA33F'
          sha='9f3bccc427efaf7538647143bc87a26319a9e5e2'
          rows=d['focused_closure_operation_sources']
          present=[x for x in rows if op in x.get('operation_ids',[])]
          assert not present or (len(present)==1 and present[0]['sha']==sha),present
          if not present:
            rows.append({'label':'AIMW-SYNC-4FDCFDA33F WordPress UsersManager SearchClickedAsync scoped closure #976','sha':sha,'observed_pr_head':sha,'operation_ids':[op]})
          p.write_text(json.dumps(d,indent=2)+'\n')
          print('PINNED_SOURCE',op,sha)
          PY
      - name: Generate official full parity with exactly #976 terminality
        shell: bash
        run: |
          set -euo pipefail
          tool=variants/laravel-aiwmweb/tools
          python "$tool/finalize_operation_parity.py" --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          for stage in apply_tenant_neutral_route_evidence apply_platform_admin_route_evidence apply_explicit_route_api_provenance apply_focused_closure_evidence apply_focused_service_evidence apply_focused_background_job_evidence; do
            python "$tool/${stage}.py" --input /tmp/parity.json --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/parity.json'))
          rows={r['operation_id']:r for r in d['operations']}
          assert rows['AIMW-SYNC-E0791EA9E9']['migration_state']=='ADAPTED'
          assert rows['AIMW-SYNC-4FDCFDA33F']['migration_state']=='ADAPTED'
          assert d['totals']['total']==931
          assert d['totals']['terminal']>=893,d['totals']
          assert d['validation']['passed'],d['validation']
          print('OFFICIAL_976_GENERATOR_PASS',d['totals'])
          PY
          cp /tmp/parity.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/parity.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Remove both temporary orchestration workflows and commit official generated results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/laravel-976-sync-after-960.yml .github/workflows/laravel-976-enroll-after-960.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m "chore(laravel #976): canonical scoped WordPress UsersManager parity after #960 integration"
          git push origin HEAD:refs/heads/worker/976-wordpress-site-users-search
          echo "OFFICIAL_976_FINAL_HEAD=$(git rev-parse HEAD)"

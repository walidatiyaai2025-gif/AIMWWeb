name: Final QA Closure Patcher

on:
  push:
    branches:
      - lead/final-qa-acceptance-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/final-qa-acceptance-convergence
          fetch-depth: 0
      - run: python3 Build/final-qa-closure.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AIWordPressManager.Web/Components/Pages/AIPromptTemplates.razor tests/AIWordPressManager.UxTests/AIUsageAccountProfileUxTests.cs tests/AIWordPressManager.UxTests/SynchronizationWorkspaceUxTests.cs tests/AIWordPressManager.UxTests/SynchronizationWorkspaceUxTestsDualFailure.cs
          git diff --cached --check
          git commit -m "fix: close final historical acceptance interactions"
          git push origin HEAD:lead/final-qa-acceptance-convergence

name: Laravel AIWMWeb Task Parity Materialize 962 (temporary)
on:
  push:
    branches: [worker/962-dashboard-refresh-clicked]
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-962.yml'
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authoritative evidence sources
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: Materialize focused closure against current official composition ledger
        run: |
          set -euo pipefail
          OUT=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUM=/tmp/operation-parity-summary.json
          cp "$OUT" /tmp/962-parity-before.json
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python - <<'PY'
          import json
          old=json.load(open('/tmp/962-parity-before.json'))
          new=json.load(open('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'))
          before={r['operation_id']:r['migration_state'] for r in old['operations']}
          after={r['operation_id']:r['migration_state'] for r in new['operations']}
          changed={k:(before[k],after[k]) for k in before if before[k]!=after[k]}
          assert changed=={'AIMW-SYNC-8C35E9A7A0':('PENDING','ADAPTED')}, changed
          assert new['totals']['total']==931 and new['totals']['terminal']==902, new['totals']
          print('Exact #962 focused delta:',changed)
          PY
      - name: Commit official focused ledger
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(laravel): materialize official #962 focused closure on latest composition"
          git push origin "HEAD:${{ github.ref_name }}"

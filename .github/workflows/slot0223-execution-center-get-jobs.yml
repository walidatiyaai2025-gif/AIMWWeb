name: Slot0223 ExecutionCenter GetJobs

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-035FFB3624-slot0223

permissions:
  contents: write

jobs:
  validate-and-reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Focused Laravel acceptance
        working-directory: variants/laravel-aiwmweb/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test app/Execution/ExecutionCenterServiceAdapter.php tests/Feature/ExecutionCenterGetJobsTerminalityTest.php
          php artisan migrate:fresh --force
          php artisan test tests/Feature/ExecutionCenterGetJobsTerminalityTest.php

      - name: Capture canonical baseline
        run: cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/slot0223-before.json

      - name: Regenerate canonical reconciliation with official toolchain
        shell: bash
        run: |
          set -euo pipefail
          JSON='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          MD='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          SUMMARY='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Assert exact one-operation canonical delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          operation_id = 'AIMW-AUTO-035FFB3624'
          before = json.loads(Path('/tmp/slot0223-before.json').read_text())
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          before_rows = {row['operation_id']: row for row in before['operations']}
          after_rows = {row['operation_id']: row for row in after['operations']}
          assert set(before_rows) == set(after_rows)
          changes = [
              (op, before_rows[op]['migration_state'], after_rows[op]['migration_state'])
              for op in before_rows
              if before_rows[op]['migration_state'] != after_rows[op]['migration_state']
          ]
          assert changes == [(operation_id, 'PENDING', 'ADAPTED')], changes
          row = after_rows[operation_id]
          assert row['acceptance_test'].endswith('ExecutionCenterGetJobsTerminalityTest.php'), row
          assert row['reconciliation']['evidence_mode'] == 'focused_service_contract', row['reconciliation']
          totals = after['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 519, totals
          assert totals['pending'] == 412, totals
          assert totals['blocked'] == 0, totals
          assert after['validation']['focused_service_contract_count'] == 12, after['validation']
          print('SLOT0223_CANONICAL_DELTA=PASS')
          PY

      - name: Commit generated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && { echo 'Expected generated reconciliation delta is missing'; exit 1; }
          git commit -m 'chore(laravel): reconcile ExecutionCenter GetJobs parity'

      - name: Remove temporary workflow and push clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/slot0223-execution-center-get-jobs.yml
          git commit -m 'chore: remove Slot0223 validation workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"

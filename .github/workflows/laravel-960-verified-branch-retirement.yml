name: Laravel 960 verified branch retirement

on:
  push:
    branches:
      - worker/960-global-users-previous
    paths:
      - '.github/workflows/laravel-960-verified-branch-retirement.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  retire-only-after-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged ancestry and delete exact retired leaf branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          head_ref="worker/960-global-users-previous"
          target_ref="worker/laravel-aiwmweb-closure-composition"
          for attempt in $(seq 1 120); do
            merged=$(gh api "repos/$repo/pulls/1350" --jq '.merged')
            if [ "$merged" = "true" ]; then
              target=$(gh api "repos/$repo/pulls/1350" --jq '.base.ref')
              test "$target" = "$target_ref"
              live_head=$(gh api "repos/$repo/git/ref/heads/$head_ref" --jq '.object.sha')
              git fetch origin "+refs/heads/$target_ref:refs/remotes/origin/$target_ref"
              git merge-base --is-ancestor "$live_head" "refs/remotes/origin/$target_ref"
              gh api --method DELETE "repos/$repo/git/refs/heads/$head_ref"
              echo "VERIFIED_MERGED_BRANCH_RETIRED=$head_ref"
              echo "VERIFIED_HEAD=$live_head"
              exit 0
            fi
            sleep 15
          done
          echo "PR #1350 did not merge during the guarded cleanup run; branch preserved" >&2
          exit 1

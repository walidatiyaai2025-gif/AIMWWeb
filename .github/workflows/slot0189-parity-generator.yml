name: Slot0189 Parity Generator

on:
  push:
    branches:
      - 'worker/laravel-aiwmweb-slot0187-site-operation-details-alias'
    paths:
      - '.github/workflows/slot0189-parity-generator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enroll pushed explicit-route evidence and regenerate canonical parity
        shell: bash
        run: |
          set -euo pipefail
          cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/pre-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          operation_id = 'AIMW-AI-E5D089844A'
          evidence_sha = 'ef875ba3118ce78b45f0d6fc3a1e46ccc5c722d8'
          data['previous_reconciliation_sha'] = '877762545b02a9857314f629abd758afdf371111'

          for source in data.get('countable_sources', []):
              if operation_id in (source.get('operation_evidence') or {}):
                  raise SystemExit(f'operation evidence already enrolled: {operation_id}')

          data.setdefault('countable_sources', []).append({
              'label': 'AIMW-AI-E5D089844A site operation details alias route closure',
              'sha': evidence_sha,
              'observed_pr_head': evidence_sha,
              'domains': ['ai'],
              'supporting_only': True,
              'operation_evidence': {
                  operation_id: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/SiteOperationDetailsRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/SiteOperationDetailsReadController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SiteOperationDetailsAliasRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/site-operation-details-alias-route-terminality.json',
                  }
              },
          })
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/pre-reconciliation.json').read_text())
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          operation_id = 'AIMW-AI-E5D089844A'
          before_by_id = {r['operation_id']: r for r in before['operations']}
          after_by_id = {r['operation_id']: r for r in after['operations']}
          changed_states = sorted(
              op for op in before_by_id
              if before_by_id[op]['migration_state'] != after_by_id[op]['migration_state']
          )
          row = after_by_id[operation_id]
          assert changed_states == [operation_id], changed_states
          assert before_by_id[operation_id]['migration_state'] == 'PENDING', before_by_id[operation_id]
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['evidence_mode'] == 'explicit_route_contract', row
          assert row['reconciliation']['source_sha'] == 'ef875ba3118ce78b45f0d6fc3a1e46ccc5c722d8', row
          assert after['totals']['total'] == 931, after['totals']
          assert after['totals']['terminal'] == 512, after['totals']
          assert after['totals']['pending'] == 419, after['totals']
          assert after['totals']['blocked'] == 0, after['totals']
          assert operation_id not in after['pending_operation_ids_by_domain']['ai']
          print('SLOT0189_GENERATOR_ASSERTIONS=PASS')
          PY

      - name: Commit generator-owned artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(laravel): reconcile site-operation alias parity'
          git push origin HEAD:worker/laravel-aiwmweb-slot0187-site-operation-details-alias

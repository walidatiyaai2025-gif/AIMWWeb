name: Patch Comments Grid

on:
  push:
    branches:
      - feature/stable-ui-framework
    paths:
      - .github/workflows/patch-comments-column-chooser.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-comments-grid
  cancel-in-progress: true

jobs:
  patch-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/stable-ui-framework
          fetch-depth: 0

      - name: Patch Comments Manager
        shell: pwsh
        run: |
          $path = 'src/AIWordPressManager.Web/Components/Pages/CommentsManager.razor'
          $text = Get-Content $path -Raw

          if ($text -notmatch 'ColumnPreferenceKey=') {
            $text = $text -replace 'RowsPerPageText="@\(L\.IsArabic \? "صفوف" : "Rows"\)"\s*>', @'
RowsPerPageText="@(L.IsArabic ? "صفوف" : "Rows")"
                         ColumnLabels="@CommentColumnLabels"
                         ColumnPreferenceKey="@($"comments-grid-columns-{SiteId}")"
                         ColumnsText="@(L.IsArabic ? "الأعمدة" : "Columns")"
                         ResetColumnsText="@(L.IsArabic ? "إظهار كل الأعمدة" : "Show all columns")">
'@
          }

          if ($text -notmatch 'CommentColumnLabels') {
            $marker = '    private string CsvFileName => $"wordpress-comments-{DateTime.Now:yyyyMMdd-HHmmss}.csv";'
            $replacement = @'
    private string CsvFileName => $"wordpress-comments-{DateTime.Now:yyyyMMdd-HHmmss}.csv";
    private IReadOnlyList<string> CommentColumnLabels => L.IsArabic
        ? new[] { "الكاتب", "التعليق", "الحالة", "التاريخ", "الإجراءات" }
        : new[] { "Author", "Comment", "Status", "Date", "Actions" };
'@
            if (-not $text.Contains($marker)) { throw 'Comment labels insertion point was not found.' }
            $text = $text.Replace($marker, $replacement)
          }

          $oldSection = @'
            <AppSection Title="@(L.IsArabic ? "صفحات WordPress" : "WordPress pages")">
                <Actions>
                    <AppButton Icon="‹" Text="@L["Previous"]" Disabled="@(_page <= 1 || _working)" OnClick="PreviousPageClickedAsync" />
                    <AppBadge Tone="info" Text="@($"{L["Page"]} {_page} {L["Of"]} {_result.TotalPages}")" />
                    <AppButton Icon="›" Text="@L["Next"]" Disabled="@(_page >= _result.TotalPages || _working)" OnClick="NextPageClickedAsync" />
                </Actions>
            </AppSection>
'@
          $newSection = @'
            <AppSection Title="@(L.IsArabic ? "صفحات WordPress" : "WordPress pages")">
                <Header>
                    <AppButton Icon="‹" Text="@L["Previous"]" Disabled="@(_page <= 1 || _working)" OnClick="PreviousPageClickedAsync" />
                    <AppBadge Tone="info" Text="@($"{L["Page"]} {_page} {L["Of"]} {_result.TotalPages}")" />
                    <AppButton Icon="›" Text="@L["Next"]" Disabled="@(_page >= _result.TotalPages || _working)" OnClick="NextPageClickedAsync" />
                </Header>
                <ChildContent>
                    <span class="visually-hidden">@($"{L["Page"]} {_page} {L["Of"]} {_result.TotalPages}")</span>
                </ChildContent>
            </AppSection>
'@
          if ($text.Contains($oldSection)) {
            $text = $text.Replace($oldSection, $newSection)
          }

          Set-Content $path $text -Encoding utf8

          $project = 'src/AIWordPressManager.Web/AIWordPressManager.Web.csproj'
          $xml = Get-Content $project -Raw
          $xml = [regex]::Replace($xml, '<Version>[^<]+</Version>', '<Version>155.49.4</Version>', 1)
          $xml = [regex]::Replace($xml, '<AssemblyVersion>[^<]+</AssemblyVersion>', '<AssemblyVersion>155.49.4.0</AssemblyVersion>', 1)
          $xml = [regex]::Replace($xml, '<FileVersion>[^<]+</FileVersion>', '<FileVersion>155.49.4.0</FileVersion>', 1)
          $xml = [regex]::Replace($xml, '<InformationalVersion>[^<]+</InformationalVersion>', '<InformationalVersion>155.49.4</InformationalVersion>', 1)
          Set-Content $project $xml -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: dotnet build .\AIWordPressManager.Web.sln --configuration Debug

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AIWordPressManager.Web/Components/Pages/CommentsManager.razor src/AIWordPressManager.Web/AIWordPressManager.Web.csproj
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: comments grid columns and pagination section [skip ci]"
          git push origin feature/stable-ui-framework

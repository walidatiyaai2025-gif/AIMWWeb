name: Fix Automation Center Save Pint

on:
  push:
    branches:
      - worker/laravel-bill-bc1c75ce0d-recovery-final
    paths:
      - '.github/workflows/fix-automation-center-save-pint.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-bill-bc1c75ce0d-recovery-final
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist
      - name: Format only recovered operation files
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          vendor/bin/pint \
            app/Http/Controllers/AutomationCenterJobSaveController.php \
            app/Operations/AutomationCenterJobSaveService.php \
            tests/Feature/AutomationCenterSaveTerminalityTest.php
      - name: Commit formatter output and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-automation-center-save-pint.yml
          git add \
            variants/laravel-aiwmweb/backend/app/Http/Controllers/AutomationCenterJobSaveController.php \
            variants/laravel-aiwmweb/backend/app/Operations/AutomationCenterJobSaveService.php \
            variants/laravel-aiwmweb/backend/tests/Feature/AutomationCenterSaveTerminalityTest.php
          git diff --cached --check
          git commit -m 'Format recovered Automation Center Save closure'
          git push origin HEAD:worker/laravel-bill-bc1c75ce0d-recovery-final

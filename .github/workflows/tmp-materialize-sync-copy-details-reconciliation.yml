name: Temporary sync copy-details reconciliation materialization

on:
  push:
    branches:
      - recovery/laravel-sync-89777052cb-reconciliation-20260917
    paths:
      - '.github/workflows/tmp-materialize-sync-copy-details-reconciliation.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture committed baseline
        shell: bash
        run: cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/before-reconciliation.json

      - name: Pin exact focused closure evidence snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text())
          manifest['focused_closure_evidence_source_sha'] = '32618e9cd3c5d053098378e55e23ad82c2120322'
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Verify exact one-operation state delta
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = 'AIMW-SYNC-89777052CB'
          before = json.loads(Path('/tmp/before-reconciliation.json').read_text())
          after = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())

          assert before['totals']['total'] == 931
          assert before['totals']['terminal'] == 604
          assert before['totals']['pending'] == 327
          assert before['totals']['blocked'] == 0

          assert after['totals']['total'] == 931
          assert after['totals']['terminal'] == 605
          assert after['totals']['pending'] == 326
          assert after['totals']['blocked'] == 0

          before_rows = {row['operation_id']: row for row in before['operations']}
          after_rows = {row['operation_id']: row for row in after['operations']}
          assert set(before_rows) == set(after_rows)
          assert before_rows[target]['migration_state'] == 'PENDING'
          assert after_rows[target]['migration_state'] == 'ADAPTED'
          assert after_rows[target]['reconciliation']['evidence_mode'] == 'focused_closure_contract'
          assert after_rows[target]['reconciliation']['source_sha'] == '32618e9cd3c5d053098378e55e23ad82c2120322'
          assert after_rows[target]['reconciliation']['evidence_path'] == 'variants/laravel-aiwmweb/docs/closure-evidence/error-copy-details-terminality.json'

          changed = sorted(
              op_id for op_id in before_rows
              if before_rows[op_id]['migration_state'] != after_rows[op_id]['migration_state']
          )
          assert changed == [target], changed

          terminal_states = {'PORTED', 'ADAPTED', 'VERIFIED_UNAVAILABLE_EXTERNAL'}
          regressions = sorted(
              op_id for op_id, row in before_rows.items()
              if row['migration_state'] in terminal_states
              and after_rows[op_id]['migration_state'] not in terminal_states
          )
          assert regressions == [], regressions
          assert after.get('validation', {}).get('passed') is True
          assert after.get('validation', {}).get('terminal_excludes_blocked') is True

          print('SYNC_COPY_DETAILS_RECONCILIATION=VERIFIED')
          print('CHANGED_OPERATION_IDS=' + ','.join(changed))
          print('TOTAL=931')
          print('TERMINAL=605')
          print('PENDING=326')
          print('BLOCKED=0')
          PY

      - name: Commit exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --exit-code && { echo 'Expected generated parity changes but none were produced.'; exit 1; } || true
          git commit -m 'docs: materialize AIMW-SYNC-89777052CB reconciliation [parity-materialized]'
          git push origin HEAD:recovery/laravel-sync-89777052cb-reconciliation-20260917

name: Laravel AIWMWeb Slot0216 PHP Diagnostic

on:
  pull_request:
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/slot0216-laravel-php-diagnostic.yml'

permissions:
  contents: read

jobs:
  sqlite-full-suite-diagnostic:
    if: github.head_ref == 'worker/laravel-aiwmweb-AIMW-AI-C5BC29CF27-slot0206'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Capture full PHP suite failure
        id: suite
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php artisan test --log-junit /tmp/slot0216-sqlite-junit.xml 2>&1 | tee /tmp/slot0216-sqlite-test.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot0216-sqlite-php-diagnostic-${{ github.sha }}
          path: |
            /tmp/slot0216-sqlite-test.log
            /tmp/slot0216-sqlite-junit.xml
          if-no-files-found: warn
      - name: Preserve failing acceptance signal
        if: always()
        shell: bash
        run: |
          rc='${{ steps.suite.outputs.exit_code }}'
          if [[ -z "$rc" ]]; then
            echo 'DIAGNOSTIC_SUITE_EXIT=missing'
            exit 1
          fi
          echo "DIAGNOSTIC_SUITE_EXIT=${rc}"
          exit "$rc"

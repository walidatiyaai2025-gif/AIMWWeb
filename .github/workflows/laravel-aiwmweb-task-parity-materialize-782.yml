name: Laravel AIWMWeb Task Parity Materialize 782

on:
  push:
    branches:
      - worker/782-global-users-route
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-782.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register exact route provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          op = 'AIMW-CONT-C3EC665880'
          sha = 'eaceb34cbf5beb25952bfff61c291aba01d78130'
          sources = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(sources.read_text())
          entry = {
              'label': 'AIMW-CONT-C3EC665880 Global Users workspace canonical route terminality',
              'sha': sha,
              'observed_pr_head': sha,
              'domains': ['content'],
              'supporting_only': True,
              'operation_ids': [op],
              'route_api_provenance': {
                  op: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/routes/web.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/CanonicalWorkspaceRouteController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/GlobalUsersWorkspaceRouteTerminalityTest.php',
                      'operation_link_test': 'variants/laravel-aiwmweb/backend/tests/Feature/GlobalUsersWorkspaceRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/global-users-workspace-route-terminality.json',
                      'security_mode': 'tenant_selected',
                  },
              },
          }
          data['countable_sources'] = [
              row for row in data['countable_sources']
              if op not in row.get('operation_ids', [])
          ]
          data['countable_sources'].append(entry)
          sources.write_text(json.dumps(data, indent=2) + '\n')

          evidence = Path('variants/laravel-aiwmweb/docs/closure-evidence/global-users-workspace-route-terminality.json')
          payload = json.loads(evidence.read_text())
          payload['materialized'] = True
          payload['evidence_source_sha'] = sha
          evidence.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Run official parity materializer
        run: |
          set -euo pipefail
          OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          TMP_SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
      - name: Verify exact operation materialized
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          op = 'AIMW-CONT-C3EC665880'
          data = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          rows = [row for row in data['operations'] if row.get('operation_id') == op]
          assert len(rows) == 1, rows
          row = rows[0]
          assert row.get('migration_state') == 'ADAPTED', row
          assert row.get('reconciliation', {}).get('source_sha') == 'eaceb34cbf5beb25952bfff61c291aba01d78130', row
          assert row.get('reconciliation', {}).get('evidence_mode') == 'explicit_route_api_contract', row
          PY
      - name: Commit generated reconciliation and remove task workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/laravel-aiwmweb-task-parity-materialize-782.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  variants/laravel-aiwmweb/docs/closure-evidence/global-users-workspace-route-terminality.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize parity for AIMW-CONT-C3EC665880"
          git push origin "HEAD:${{ github.ref_name }}"

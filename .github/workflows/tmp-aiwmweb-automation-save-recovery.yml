name: Temporary AIWMWeb Automation Save Parity Materializer

on:
  push:
    branches:
      - worker/laravel-bill-bc1c75ce0d-automation-save-recovery-20260917

permissions:
  contents: write

jobs:
  materialize-single-operation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-bill-bc1c75ce0d-automation-save-recovery-20260917
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Laravel test environment
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Refresh focused evidence provenance
        run: |
          set -euo pipefail
          evidence='variants/laravel-aiwmweb/docs/closure-evidence/automation-center-save-terminality.json'
          tmp="$(mktemp)"
          jq '.canonical_base_sha = "52585af0bc9da8d0b9680893419d923a33ebad35"' "$evidence" > "$tmp"
          mv "$tmp" "$evidence"
          git diff --check
          git add "$evidence"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Automation Center Save closure provenance'
          fi
          echo "FOCUSED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Update generator provenance manifest only
        run: |
          set -euo pipefail
          manifest='variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
          tmp="$(mktemp)"
          jq --arg previous '52585af0bc9da8d0b9680893419d923a33ebad35' --arg focused "$FOCUSED_SHA" \
            '.previous_reconciliation_sha = $previous | .focused_closure_evidence_source_sha = $focused' \
            "$manifest" > "$tmp"
          mv "$tmp" "$manifest"
      - name: Run focused Automation Save validation
        working-directory: variants/laravel-aiwmweb/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          vendor/bin/pint --test \
            app/Http/Controllers/AutomationCenterJobSaveController.php \
            app/Operations/AutomationCenterJobSaveService.php \
            tests/Feature/AutomationCenterSaveTerminalityTest.php \
            tests/Feature/AutomationCenterSaveIdempotencyLifetimeTest.php
          php artisan test \
            tests/Feature/AutomationCenterSaveTerminalityTest.php \
            tests/Feature/AutomationCenterSaveIdempotencyLifetimeTest.php
      - name: Run repository-official parity reconciliation pipeline
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
      - name: Assert exactly one canonical terminal delta
        run: |
          set -euo pipefail
          delta="$(python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha 52585af0bc9da8d0b9680893419d923a33ebad35)"
          printf '%s\n' "$delta"
          grep -Fx 'PREVIOUS_TERMINAL=601' <<<"$delta"
          grep -Fx 'CURRENT_TERMINAL=602' <<<"$delta"
          grep -Fx 'TERMINAL_DELTA=+1' <<<"$delta"
          grep -Fx 'FALSE_POSITIVES_DEMOTED=0' <<<"$delta"
          grep -Fx 'FALSE_PENDING_ROWS_TERMINALIZED=1' <<<"$delta"
          grep -Fx 'STATUS_CHANGED_ROWS=1' <<<"$delta"
          grep -Fx 'DEMOTED_IDS=' <<<"$delta"
          grep -Fx 'TERMINALIZED_IDS=AIMW-BILL-BC1C75CE0D' <<<"$delta"
          grep -Fx 'STATUS_CHANGED_IDS=AIMW-BILL-BC1C75CE0D' <<<"$delta"
          grep -Fq '| TOTAL | 931 |' /tmp/operation-parity-reconciliation.md
          grep -Fq '| ADAPTED | 602 |' /tmp/operation-parity-reconciliation.md
          grep -Fq '| PENDING | 329 |' /tmp/operation-parity-reconciliation.md
          grep -Fq '| BLOCKED | 0 |' /tmp/operation-parity-reconciliation.md
          grep -Fq '| TERMINAL | 602 |' /tmp/operation-parity-reconciliation.md
      - name: Materialize generator-backed reconciliation
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --check
          git add \
            variants/laravel-aiwmweb/docs/closure-evidence/automation-center-save-terminality.json \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize AIMW-BILL-BC1C75CE0D parity closure'
          git push origin HEAD:worker/laravel-bill-bc1c75ce0d-automation-save-recovery-20260917

name: Laravel AIWMWeb Task Parity Materialize 950 (temporary)
on:
  push:
    branches:
      - worker/950-global-posts-open-synchronization-link
    paths:
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-950.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official parity materializer
        run: |
          set -euo pipefail
          OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          TMP_SUMMARY=/tmp/operation-parity-summary.json
          cp "$OUT_JSON" /tmp/parity-before.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python - <<'PY'
          import json
          import subprocess
          new=json.load(open('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'))
          # The task branch can lag merged parity snapshots. Prove the only NEW
          # terminal operation relative to current integration, not stale branch state.
          result=subprocess.run([
              'git','show',
              'origin/worker/laravel-aiwmweb-closure-composition:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          ],check=True,capture_output=True,text=True)
          integration=json.loads(result.stdout)
          base={r['operation_id']:r['migration_state'] for r in integration['operations']}
          after={r['operation_id']:r['migration_state'] for r in new['operations']}
          assert set(base)==set(after) and len(after)==931, 'Parity denominator or identity drift'
          delta={key:(base[key],after[key]) for key in base if base[key]!=after[key]}
          assert delta=={'AIMW-SYNC-EEFDDFFF87':('PENDING','ADAPTED')}, delta
          assert new['totals']['total']==931
          print('Canonical #950 new integration delta:',delta)
          PY
      - name: Commit generated reconciliation
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize exact #950 parity"
          git push origin "HEAD:${{ github.ref_name }}"

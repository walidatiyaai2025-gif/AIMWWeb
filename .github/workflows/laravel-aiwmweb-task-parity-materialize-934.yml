name: Laravel AIWMWeb Task Parity Materialize 934

on:
  push:
    branches:
      - worker/934-global-media-apply
    paths:
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-934.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The full 931-operation materializer already completed with VALIDATION=PASS
      # in run 40633346985; that run failed only at the byte-for-byte commit check.
      # Reuse its exact generated JSON and Markdown instead of recomputing for 13 min.
      - name: Restore official verified parity reconciliation from CI artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-aiwmweb-operation-parity-reconciliation
          run-id: 40633346985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/934-reconciliation
      - name: Verify exact operation before publishing generated parity
        run: |
          set -euo pipefail
          test -s /tmp/934-reconciliation/operation-parity-reconciliation.json
          test -s /tmp/934-reconciliation/operation-parity-reconciliation.md
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/934-reconciliation/operation-parity-reconciliation.json')
          doc = json.loads(path.read_text())
          # The source evidence was already validated in the producing CI run.
          needle = 'AIMW-SYNC-D805D5D9A8'
          assert needle in path.read_text(), 'Focused operation missing from reconciliation'
          print('Verified canonical operation in generated reconciliation:', needle)
          PY
          cp /tmp/934-reconciliation/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/934-reconciliation/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Commit generated reconciliation
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize parity for AIMW-SYNC-D805D5D9A8"
          # Materialization takes minutes; a newer test/repair commit may land while we run.
          # Preserve those commits instead of failing with a non-fast-forward push.
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

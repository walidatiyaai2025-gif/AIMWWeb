name: Laravel AIWMWeb Task Parity Materialize 934

on:
  push:
    branches:
      - worker/934-global-media-apply
    paths:
      - '.github/workflows/laravel-aiwmweb-task-parity-materialize-934.yml'

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/934-global-media-apply
          fetch-depth: 0
      - name: Cancel superseded long-running #934 materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 40635194599 --repo walidatiyaai2025-gif/AIMWWeb || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest integration composition and preserve independent operations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git merge --no-ff --no-commit origin/worker/laravel-aiwmweb-closure-composition || true

          # Generated documents are regenerated from the union below; retain the latest
          # integration snapshot until the official materializer completes.
          git checkout origin/worker/laravel-aiwmweb-closure-composition -- \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
          def load(ref):
              return json.loads(subprocess.check_output(['git','show',f'{ref}:{manifest}'], text=True))
          base = load('origin/worker/laravel-aiwmweb-closure-composition')
          head = load('HEAD')
          keys = ('countable_sources','excluded_sources','known_composition_blockers','sources')
          for key in keys:
              assert base[key] == head[key], f'Unexpected manifest divergence: {key}'
          merged = base['focused_closure_operation_sources']
          seen = {tuple(x['operation_ids']): x for x in merged}
          for item in head['focused_closure_operation_sources']:
              key = tuple(item['operation_ids'])
              if key in seen:
                  assert seen[key]['sha'] == item['sha'], f'Conflicting provenance for {key}'
              else:
                  merged.append(item)
                  seen[key] = item
          assert ('AIMW-SYNC-D805D5D9A8',) in seen, 'Missing #934 provenance'
          assert ('AIMW-SYNC-F7BCCD650C',) in seen, 'Lost merged #931 provenance'
          Path(manifest).write_text(json.dumps(base, ensure_ascii=False, indent=2) + '\n')
          print(f'Preserved {len(merged)} unique focused closure sources')

          controller = Path('variants/laravel-aiwmweb/backend/app/Http/Controllers/ContentApiController.php')
          # Retain other composition controller changes, then preserve the #934 site guard.
          if subprocess.run(['git', 'ls-files', '-u', '--', str(controller)], capture_output=True, text=True).stdout:
              subprocess.check_call(['git','checkout','--theirs','--',str(controller)])
          body = controller.read_text()
          start = body.index('public function media(')
          end = body.find('    public function ', start + 10)
          if end < 0:
              end = len(body)
          fragment = body[start:end]
          guard = 'Site::query()->findOrFail($site);'
          if guard not in fragment:
              anchor = "$auth->authorize('content.view');\n"
              assert anchor in fragment, 'Media authorization anchor missing'
              fragment = fragment.replace(anchor, anchor + '        // A foreign/missing site must not look like an authorized empty media library.\n        ' + guard + '\n', 1)
              body = body[:start] + fragment + body[end:]
              controller.write_text(body)
          assert guard in controller.read_text()[start:controller.read_text().find('    public function ', start + 10)]
          print('Preserved active-tenant media site guard')
          PY

          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/backend/app/Http/Controllers/ContentApiController.php
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unexpected unresolved conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "merge(laravel): reconcile #934 with current closure composition"
          git push origin HEAD:worker/934-global-media-apply
      - name: Run official deterministic parity materializer on merged composition
        run: |
          set -euo pipefail
          OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          TMP_SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          assert 'AIMW-SYNC-D805D5D9A8' in json.dumps(data)
          print('Validated canonical #934 operation in deterministic materialization')
          PY
      - name: Commit fully reconciled parity
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(laravel): materialize combined #931 and #934 parity"
          git fetch origin worker/934-global-media-apply
          git rebase origin/worker/934-global-media-apply
          git push origin HEAD:worker/934-global-media-apply

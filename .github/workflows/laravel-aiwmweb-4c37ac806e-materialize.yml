name: Laravel AIWMWeb Materialize Quick Actions Toggle Evidence

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 498 && github.head_ref == 'worker/laravel-plat-4c37ac806e-quick-actions-toggle'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-plat-4c37ac806e-quick-actions-toggle
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Advance exact focused evidence source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['focused_closure_evidence_source_sha'] = '8d40a38bf3c911c1ad4c9097c26c53837e3ac637'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Generate canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md --check-total 931
      - name: Assert exact one-operation delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          row = next(item for item in payload['operations'] if item['operation_id'] == 'AIMW-PLAT-4C37AC806E')
          assert row['migration_state'] == 'ADAPTED', row
          totals = payload['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 565, totals
          assert totals['pending'] == 366, totals
          assert totals['blocked'] == 0, totals
          PY
      - name: Commit durable generated outputs
        run: |
          rm .github/workflows/laravel-aiwmweb-4c37ac806e-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md .github/workflows/laravel-aiwmweb-4c37ac806e-materialize.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(laravel): terminalize AIMW-PLAT-4C37AC806E via generator'
          git push origin HEAD:worker/laravel-plat-4c37ac806e-quick-actions-toggle

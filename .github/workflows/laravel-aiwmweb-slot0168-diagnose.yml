name: Laravel AIWMWeb Slot 0168 Focused Validation

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-93EBFDE5A1-slot0168
    paths:
      - '.github/workflows/laravel-aiwmweb-slot0168-diagnose.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/variants/laravel-aiwmweb/backend/database/database.sqlite
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
      - name: Strict formatting
        run: vendor/bin/pint --test
      - name: SQLite migration rollback-forward proof
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
      - name: Focused PHP terminality
        run: php artisan test tests/Feature/AiCenterSubmitApprovalTerminalityTest.php tests/Feature/AiCenterRefreshApprovalStatusTerminalityTest.php
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Focused frontend tests
        run: npm test -- --run resources/js/__tests__/ai-center-submit-approval.test.tsx resources/js/__tests__/ai-center-approval-status-control.test.tsx resources/js/__tests__/ai-center-copy-output.test.tsx
      - name: Production frontend build
        run: npm run build

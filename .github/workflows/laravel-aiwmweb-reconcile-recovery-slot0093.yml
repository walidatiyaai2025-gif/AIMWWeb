name: Laravel AIWMWeb Reconciliation Recovery Slot 0093

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-4EE262C228-reconciliation-recovery
    paths:
      - .github/workflows/laravel-aiwmweb-reconcile-recovery-slot0093.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AI-4EE262C228-reconciliation-recovery
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add exact scoped evidence source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          operation_id = 'AIMW-AI-4EE262C228'
          source_sha = '57308368978c1bcb1e2a7083e1ecbf540baadc8d'
          sources = payload['countable_sources']

          owners = [
              source for source in sources
              if operation_id in [str(value) for value in source.get('operation_ids', [])]
          ]
          if owners:
              if len(owners) != 1 or str(owners[0].get('sha')) != source_sha:
                  raise SystemExit(f'unexpected existing scoped owner for {operation_id}: {owners}')
          else:
              sources.append({
                  'label': 'AIMW-AI-4EE262C228 concrete job failure gate reconciliation recovery',
                  'sha': source_sha,
                  'observed_pr_head': source_sha,
                  'domains': ['ai'],
                  'operation_ids': [operation_id],
              })

          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Rebuild canonical reconciliation with repository tooling
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Verify exact one-row semantic delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          previous = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          current_by_id = {row['operation_id']: row for row in current['operations']}
          previous_by_id = {row['operation_id']: row for row in previous['operations']}
          changed = [
              operation_id
              for operation_id in previous_by_id
              if previous_by_id[operation_id]['migration_state'] != current_by_id[operation_id]['migration_state']
          ]
          expected = ['AIMW-AI-4EE262C228']
          if changed != expected:
              raise SystemExit(f'unexpected semantic delta: {changed}')
          if previous_by_id[expected[0]]['migration_state'] != 'PENDING':
              raise SystemExit('selected operation was not PENDING before generation')
          if current_by_id[expected[0]]['migration_state'] != 'ADAPTED':
              raise SystemExit('selected operation did not become ADAPTED')
          totals = current['totals']
          if (totals['total'], totals['terminal'], totals['pending'], totals['blocked']) != (931, 483, 448, 0):
              raise SystemExit(f'unexpected totals: {totals}')
          print('SLOT0093_SEMANTIC_DELTA=PASS')
          print('TOTAL=931 TERMINAL=483 PENDING=448 BLOCKED=0')
          PY

      - name: Commit exact generated artifacts and remove transient helper
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/laravel-aiwmweb-reconcile-recovery-slot0093.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(laravel): reconcile concrete job failure gate via generator'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-4EE262C228-reconciliation-recovery

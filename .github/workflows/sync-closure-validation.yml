name: Sync Closure Validation

on:
  push:
    branches:
      - worker/laravel-aiwmweb-sync-reconciliation
    paths:
      - '.github/workflows/sync-closure-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3
          coverage: none
      - name: Composer install
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist
      - name: Configure test app
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pint reconciliation-owned files
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          vendor/bin/pint --test \
            app/Http/Controllers/SyncApiController.php \
            app/Jobs/ProcessSyncBatchJob.php \
            app/Jobs/ProcessSyncRunJob.php \
            app/Jobs/RetrySyncItemJob.php \
            app/Models/ContentConflict.php \
            app/Models/SyncBatch.php \
            app/Models/SyncEvent.php \
            app/Models/SyncItem.php \
            app/Models/SyncResourceVersion.php \
            app/Models/SyncRun.php \
            app/Models/SyncSiteLease.php \
            app/Models/SyncTombstone.php \
            app/Models/SyncWebhookEvent.php \
            app/Providers/AppServiceProvider.php \
            app/Sync \
            database/migrations/2026_08_27_220000_create_sync_reconciliation_runtime.php \
            routes/api.php \
            routes/console.php \
            tests/Feature/Sync/SyncReconciliationRuntimeTest.php
      - name: Fresh SQLite migration
        working-directory: variants/laravel-aiwmweb/backend
        run: php artisan migrate:fresh --force
      - name: Focused Sync acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: php artisan test --filter=SyncReconciliationRuntimeTest
      - name: Full PHPUnit
        working-directory: variants/laravel-aiwmweb/backend
        run: php artisan test

name: Laravel AIWMWeb Logs CloseDetails Focused Evidence Once

on:
  pull_request:
    paths:
      - '.github/workflows/laravel-aiwmweb-logs-close-details-focused-evidence-once.yml'

permissions:
  contents: write

jobs:
  converge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      FOCUSED_SOURCE_SHA: b5f2885c45c30b1fafb5e613f6aea7ee31765974
      FOCUSED_OPERATION_ID: AIMW-AI-024BB0971B
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare exact-green focused source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['focused_closure_evidence_source_sha'] = os.environ['FOCUSED_SOURCE_SHA']
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical parity with diagnostics
        shell: bash
        run: |
          set -u
          : > /tmp/focused-apply.log
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931 2>&1 | tee -a /tmp/focused-apply.log
          finalize_rc=${PIPESTATUS[0]}
          echo "$finalize_rc" > /tmp/finalize-rc.txt
          if [[ "$finalize_rc" -ne 0 ]]; then
            echo 99 > /tmp/apply-rc.txt
            exit 0
          fi

          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931 2>&1 | tee -a /tmp/focused-apply.log
          apply_rc=${PIPESTATUS[0]}
          echo "$apply_rc" > /tmp/apply-rc.txt
          exit 0

      - name: Upload focused reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-close-details-focused-reconciliation-diagnostics
          path: |
            /tmp/focused-apply.log
            /tmp/finalize-rc.txt
            /tmp/apply-rc.txt
            /tmp/operation-parity-reconciliation.json
            /tmp/operation-parity-reconciliation.md
            /tmp/operation-parity-summary.json
          if-no-files-found: warn

      - name: Guard exact focused terminalization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat /tmp/finalize-rc.txt)" == "0" ]] || { cat /tmp/focused-apply.log; exit 1; }
          [[ "$(cat /tmp/apply-rc.txt)" == "0" ]] || { cat /tmp/focused-apply.log; exit 1; }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          row = next((r for r in payload['operations'] if r.get('operation_id') == os.environ['FOCUSED_OPERATION_ID']), None)
          if row is None:
              raise SystemExit('focused operation missing after reconciliation')
          if row.get('migration_state') != 'ADAPTED':
              raise SystemExit(f"focused operation did not terminalize: {row.get('migration_state')}")
          totals = payload['totals']
          expected = {'terminal': 415, 'pending': 516, 'blocked': 0}
          actual = {key: int(totals[key]) for key in expected}
          if actual != expected:
              raise SystemExit(f'focused totals mismatch: expected {expected}, got {actual}')
          validation = payload.get('validation', {})
          if os.environ['FOCUSED_OPERATION_ID'] not in validation.get('focused_closure_contract_terminals', []):
              raise SystemExit('focused operation missing from focused closure validation terminals')
          if not validation.get('passed'):
              raise SystemExit('focused closure validation did not pass')
          print('FOCUSED_CLOSE_DETAILS_RECONCILIATION=PASS')
          PY

      - name: Persist exact canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'chore(laravel): terminalize logs CloseDetails canonical parity'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

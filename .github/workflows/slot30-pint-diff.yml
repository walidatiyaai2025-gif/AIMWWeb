name: Slot30 Pint Diff Probe

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-4C84DDBEEB-job-failure-gate

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Run Pint fixer and print exact diff
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint app/Jobs/JobFailureGate.php
          echo '--- SLOT30_PINT_DIFF_BEGIN ---'
          git diff -- app/Jobs/JobFailureGate.php
          echo '--- SLOT30_PINT_DIFF_END ---'

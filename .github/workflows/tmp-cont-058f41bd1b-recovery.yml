name: TEMP CONT-058F41BD1B Recovery

on:
  push:
    branches:
      - worker/laravel-cont-058f41bd1b-pages-posts-recovery-v2

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and reconcile exact recovered unit
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITY_SHA=4590ee7aa01107a64b5441a6600de40e34bfac0a
          PRODUCT_SHA=c8934c7a1b9b2eda5e8420ffc5f07ec5394398e8
          OP=AIMW-CONT-058F41BD1B
          test "$(git merge-base "$AUTHORITY_SHA" HEAD)" = "$AUTHORITY_SHA"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD

          cd variants/laravel-aiwmweb/backend
          npm install --no-audit --no-fund
          npx vitest run resources/js/__tests__/pages-posts-link-control.test.tsx
          npm run typecheck
          cd ../../..

          python - "$PRODUCT_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          product_sha=sys.argv[1]
          p=Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          d=json.loads(p.read_text())
          d['previous_reconciliation_sha']='4590ee7aa01107a64b5441a6600de40e34bfac0a'
          d['focused_closure_evidence_source_sha']=product_sha
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input /tmp/current.json --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/current.json --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/current.json --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input /tmp/current.json --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input /tmp/current.json --output /tmp/current.json --summary-output /tmp/summary.json --markdown-output /tmp/current.md --check-total 931

          python variants/laravel-aiwmweb/tools/operation_parity_delta.py --current /tmp/current.json --previous-sha "$AUTHORITY_SHA" | tee /tmp/delta.txt
          grep -Fx 'PREVIOUS_TERMINAL=589' /tmp/delta.txt
          grep -Fx 'CURRENT_TERMINAL=590' /tmp/delta.txt
          grep -Fx 'TERMINAL_DELTA=+1' /tmp/delta.txt
          grep -Fx 'FALSE_POSITIVES_DEMOTED=0' /tmp/delta.txt
          grep -Fx 'FALSE_PENDING_ROWS_TERMINALIZED=1' /tmp/delta.txt
          grep -Fx 'STATUS_CHANGED_ROWS=1' /tmp/delta.txt
          grep -Fx 'DEMOTED_IDS=' /tmp/delta.txt
          grep -Fx "TERMINALIZED_IDS=$OP" /tmp/delta.txt
          grep -Fx "STATUS_CHANGED_IDS=$OP" /tmp/delta.txt
          grep -Fq '| TOTAL | 931 |' /tmp/current.md
          grep -Fq '| PENDING | 341 |' /tmp/current.md
          grep -Fq '| BLOCKED | 0 |' /tmp/current.md
          grep -Fq '| TERMINAL | 590 |' /tmp/current.md

          cp /tmp/current.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/current.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m "chore(laravel): reconcile Pages Posts canonical parity"
          git push origin HEAD

          git rm .github/workflows/tmp-cont-058f41bd1b-recovery.yml
          git commit -m "chore: remove CONT-058F41BD1B recovery workflow"
          git push origin HEAD

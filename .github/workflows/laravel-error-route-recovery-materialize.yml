name: Laravel Error Route Recovery Materialize

on:
  push:
    branches:
      - worker/laravel-AIMW-CONT-455F01DAC7-reconciliation-recovery

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_SHA: 101ea861da6600477f124826406bba21c183814a
      OPERATION_ID: AIMW-CONT-455F01DAC7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Focused Error route acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$(pwd)/database/database.sqlite"
          php artisan migrate:fresh --force
          php artisan test tests/Feature/ErrorRouteTerminalityTest.php

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Point delta authority at exact live base
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text())
          data['previous_reconciliation_sha'] = os.environ['BASE_SHA']
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Run official reconciliation generator chain
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Guard exactly one canonical recovery transition
        run: |
          python - <<'PY'
          import json, os, subprocess
          op = os.environ['OPERATION_ID']
          base_sha = os.environ['BASE_SHA']
          base = json.loads(subprocess.check_output([
              'git','show',f'{base_sha}:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          ], text=True))
          current = json.load(open('/tmp/operation-parity-reconciliation.json'))
          before = {r['operation_id']: r['migration_state'] for r in base['operations']}
          after = {r['operation_id']: r['migration_state'] for r in current['operations']}
          changes = sorted((key, before[key], after[key]) for key in before if before[key] != after[key])
          expected = [(op, 'PENDING', 'ADAPTED')]
          assert changes == expected, f'unexpected canonical transitions: {changes}'
          totals = current['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 584, totals
          assert totals['pending'] == 347, totals
          assert totals['blocked'] == 0, totals
          row = next(r for r in current['operations'] if r['operation_id'] == op)
          assert row['reconciliation']['security_mode'] == 'authenticated_fallback', row['reconciliation']
          assert row['reconciliation']['evidence_mode'] == 'explicit_route_contract', row['reconciliation']
          print('EXACTLY_ONE_RECOVERY_TRANSITION=PASS')
          PY

      - name: Commit generator-backed recovery
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && exit 1
          git commit -m 'docs(laravel): materialize Error route recovery'
          git push origin HEAD:${GITHUB_REF_NAME}

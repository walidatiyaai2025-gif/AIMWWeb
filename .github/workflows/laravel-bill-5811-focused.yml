name: Laravel BILL 5811 Focused

on:
  push:
    branches:
      - worker/laravel-bill-5811b45f89-admin-billing-support-route

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare SQLite
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          touch "$RUNNER_TEMP/bill-5811.sqlite"
          php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/bill-5811.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
      - run: vendor/bin/pint --test app/Http/Controllers/AdminBillingSupportReadController.php app/Providers/AdminBillingSupportRouteServiceProvider.php tests/Feature/AdminBillingSupportRouteTerminalityTest.php
      - run: php artisan test tests/Feature/AdminBillingSupportRouteTerminalityTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/bill-5811.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

name: Laravel AIWMWeb Toggle Diagnostic

on:
  push:
    branches:
      - worker/laravel-ci-repair-bill-toggle-20260917

permissions:
  contents: read

jobs:
  isolate-toggle-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - name: Action uses Class@__invoke
        run: php artisan test --filter=test_action_is_invokable_notation
      - name: Action uses class-only notation
        if: always()
        run: php artisan test --filter=test_action_is_class_only_notation
      - name: Route has web middleware
        if: always()
        run: php artisan test --filter=test_route_has_web_middleware
      - name: Route has auth middleware
        if: always()
        run: php artisan test --filter=test_route_has_auth_middleware
      - name: Route has tenant.context middleware
        if: always()
        run: php artisan test --filter=test_route_has_tenant_context_middleware
      - name: View has operation marker
        if: always()
        run: php artisan test --filter=test_view_has_operation_marker
      - name: View has CSRF marker
        if: always()
        run: php artisan test --filter=test_view_has_csrf_marker
      - name: View has expected_enabled marker
        if: always()
        run: php artisan test --filter=test_view_has_expected_enabled_marker
      - name: Original toggle route contract
        if: always()
        run: php artisan test --filter=test_route_is_session_authenticated_tenant_scoped_csrf_capable_and_visible

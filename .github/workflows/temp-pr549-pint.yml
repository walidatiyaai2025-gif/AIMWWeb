name: Temp PR549 Pint Formatter

on:
  push:
    branches:
      - worker/laravel-bill-723bea8f1d-save-credential-recovery

permissions:
  contents: write

jobs:
  pint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist
      - name: Apply Pint
        working-directory: variants/laravel-aiwmweb/backend
        run: vendor/bin/pint
      - name: Commit formatter output
        run: |
          if git diff --quiet -- variants/laravel-aiwmweb/backend; then
            echo "No Pint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/laravel-aiwmweb/backend
          git commit -m "Fix PR #549 Pint formatting"
          git push

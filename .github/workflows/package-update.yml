name: Package AIMWWeb Update

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Resolve package metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AIWordPressManager.Web\AIWordPressManager.Web.csproj -Raw
          $versions = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($versions.Count -eq 0) { throw 'Project Version was not found.' }
          $version = [string]$versions[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project Version is empty.' }

          $sourceCommit = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ([string]::IsNullOrWhiteSpace($sourceCommit)) { $sourceCommit = $env:GITHUB_SHA }
          if ($sourceCommit.Length -lt 8) { throw 'Source commit is invalid.' }
          $shortCommit = $sourceCommit.Substring(0, 8)
          $artifactName = "AIMWWeb-Update-$version-$shortCommit-win-x64"

          "PackageVersion=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SourceCommit=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ShortCommit=$shortCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ArtifactName=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore for win-x64
        run: dotnet restore .\src\AIWordPressManager.Web\AIWordPressManager.Web.csproj -r win-x64

      - name: Publish update payload
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'artifacts\package\app'
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          dotnet publish .\src\AIWordPressManager.Web\AIWordPressManager.Web.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $publish `
            /p:GitBranch=main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add safe installer and package metadata
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'artifacts\package'
          Copy-Item .\Build\Install-Update.ps1 (Join-Path $package 'Install-Update.ps1') -Force
          Copy-Item .\Build\UPDATE_PACKAGE_README_AR.txt (Join-Path $package 'README_AR.txt') -Force
          @(
            "AIMWWeb $env:PackageVersion",
            "main/source commit: $env:SourceCommit",
            "package workflow commit: $env:GITHUB_SHA",
            "runtime: win-x64",
            "framework: net8.0",
            "deployment: framework-dependent"
          ) | Set-Content (Join-Path $package 'VERSION.txt') -Encoding UTF8

      - name: Verify package contents
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'artifacts\package'
          $required = @(
            'Install-Update.ps1',
            'README_AR.txt',
            'VERSION.txt',
            'app\AIWordPressManager.Web.dll',
            'app\AIWordPressManager.Web.exe',
            'app\web.config'
          )
          foreach ($relative in $required) {
            $path = Join-Path $package $relative
            if (-not (Test-Path $path)) { throw "Missing package file: $relative" }
          }

          $versionText = Get-Content (Join-Path $package 'VERSION.txt') -Raw
          if ($versionText -notmatch [Regex]::Escape($env:SourceCommit)) {
            throw 'VERSION.txt does not contain the exact source commit.'
          }

      - name: Upload installable update package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ArtifactName }}
          path: artifacts/package
          if-no-files-found: error
          retention-days: 90

name: Laravel AIWMWeb Slot 0160 Full Suite Diagnostic

on:
  pull_request:
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/laravel-aiwmweb-slot0160-full-suite-diagnostic.yml'

permissions:
  contents: read

jobs:
  full-suite-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Run full SQLite suite and capture exact PHPUnit output
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/slot0160-full-suite.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot0160-full-suite-${{ github.sha }}
          path: /tmp/slot0160-full-suite.log
          if-no-files-found: error

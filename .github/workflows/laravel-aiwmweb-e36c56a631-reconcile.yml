name: Laravel AIWMWeb E36C56A631 Reconcile

on:
  push:
    branches:
      - 'worker/laravel-sync-e36c56a631-filter-chip'
    paths:
      - '.github/workflows/laravel-aiwmweb-e36c56a631-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-sync-e36c56a631-filter-chip
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json

      - name: Focused AppFilterChip validation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          npm ci
          npx vitest run resources/js/__tests__/app-filter-chip.test.tsx

      - name: Point focused evidence at this pushed composition
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run official reconciliation pipeline
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Require exactly this focused closure to become terminal without regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          row = next(item for item in payload['operations'] if item['operation_id'] == 'AIMW-SYNC-E36C56A631')
          assert row['migration_state'] in {'PORTED', 'ADAPTED', 'VERIFIED_UNAVAILABLE_EXTERNAL'}, row
          totals = payload['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 569, totals
          assert totals['pending'] == 362, totals
          assert totals['blocked'] == 0, totals
          assert payload['validation']['passed'] is True, payload['validation']
          PY

      - name: Install official generated artifacts and self-remove helper
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm .github/workflows/laravel-aiwmweb-e36c56a631-reconcile.yml

      - name: Commit official reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/laravel-aiwmweb-e36c56a631-reconcile.yml
          git commit -m 'chore(laravel): reconcile AIMW-SYNC-E36C56A631 evidence'
          git push origin HEAD:worker/laravel-sync-e36c56a631-filter-chip

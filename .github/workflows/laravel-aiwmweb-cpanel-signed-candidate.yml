name: Laravel AIWMWeb cPanel Signed Staging Candidate

# Manual, non-publishing bridge: prove a signed ZIP can be generated and
# tested on an isolated cPanel staging installation before production attestation.
# NEVER publish a GitHub Release or change live hosting from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: laravel-aiwmweb-signed-candidate
  cancel-in-progress: false

jobs:
  build-signed-staging-candidate:
    if: github.ref == 'refs/heads/main'
    environment: aiwm-cpanel-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      AIWM_MIN_SUPPORTED_VERSION: ${{ vars.AIWM_MIN_SUPPORTED_VERSION }}
      AIWM_SIGNER_ROTATED: ${{ secrets.AIWM_UPDATES_SIGNER_ROTATED }}
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Require current main and both green push CI workflows
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" > "$RUNNER_TEMP/current-main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/push-runs.json"
          python3 variants/laravel-aiwmweb/tools/release/verify-production-ci.py \
            "$RUNNER_TEMP/current-main.json" "$RUNNER_TEMP/push-runs.json" "$SOURCE_SHA"
          id="$(jq -r --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .name == "Laravel AIWMWeb cPanel Setup ZIP"
              and .event == "push" and .status == "completed"
              and .conclusion == "success")]
            | sort_by(.updated_at, .id) | last | .id // empty
          ' "$RUNNER_TEMP/push-runs.json")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'BLOCKED: exact-sha tested Setup ZIP unavailable' >&2; exit 1; }
          number="$(jq -r --argjson id "$id" '.workflow_runs[] | select(.id == $id) | .run_number' "$RUNNER_TEMP/push-runs.json")"
          [[ "$number" =~ ^[0-9]+$ ]] || exit 1
          echo "build_run=$id" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$number" >> "$GITHUB_OUTPUT"

      - name: Enable secure PHP signing runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip
          coverage: none

      - name: Gate rotated signer and minimum installed version
        env:
          AIWM_UPDATES_SECRET_KEY: ${{ secrets.AIWM_UPDATES_SECRET_KEY }}
          AIWM_TRUSTED_KEY: ${{ secrets.AIWM_UPDATES_TRUSTED_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AIWM_SIGNER_ROTATED" == 'yes' ]] || { echo 'BLOCKED: signer rotation not attested' >&2; exit 1; }
          [[ "$AIWM_MIN_SUPPORTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'BLOCKED: explicit minimum installed version required' >&2; exit 1; }
          php -r '
            $secret=base64_decode((string)getenv("AIWM_UPDATES_SECRET_KEY"), true);
            $public=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            if (!is_string($secret) || strlen($secret)!==SODIUM_CRYPTO_SIGN_SECRETKEYBYTES ||
                !is_string($public) || strlen($public)!==SODIUM_CRYPTO_SIGN_PUBLICKEYBYTES ||
                !hash_equals($public,sodium_crypto_sign_publickey_from_secretkey($secret))) {
              fwrite(STDERR,"BLOCKED: signing key pair invalid or mismatched\n");
              exit(1);
            }'

      - name: Prepare exact tested cPanel build
        env:
          BUILD_RUN: ${{ steps.gate.outputs.build_run }}
          VERSION: ${{ steps.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpanel-source" "$RUNNER_TEMP/candidate"
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "AIWMWeb-Laravel-cPanel-$SOURCE_SHA" \
            --dir "$RUNNER_TEMP/cpanel-source"
          test -s "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip"
          python3 variants/laravel-aiwmweb/tools/deploy/prepare_signed_deploy.py \
            "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip" \
            variants/laravel-aiwmweb/backend "$SOURCE_SHA" "$VERSION"

      - name: Sign candidate and cryptographically verify artifacts
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          AIWM_UPDATES_SECRET_KEY: ${{ secrets.AIWM_UPDATES_SECRET_KEY }}
          AIWM_TRUSTED_KEY: ${{ secrets.AIWM_UPDATES_TRUSTED_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          php variants/laravel-aiwmweb/tools/release/build-signed-update.php \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/candidate"
          python3 variants/laravel-aiwmweb/tools/release/verify-signed-update-compat.py \
            "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-update.zip"
          unzip -t "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-signed-bundle.zip" >/dev/null
          php -r '
            $raw=file_get_contents($argv[1]);
            $sig=base64_decode(trim(file_get_contents($argv[2])), true);
            $key=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            $manifest=json_decode($raw, true, 512, JSON_THROW_ON_ERROR);
            if (!is_string($sig) || !is_string($key) ||
                !sodium_crypto_sign_verify_detached($sig, $raw, $key) ||
                $manifest["sha"] !== getenv("SOURCE_SHA") ||
                $manifest["version"] !== getenv("VERSION") ||
                $manifest["minimum_supported_version"] !== getenv("AIWM_MIN_SUPPORTED_VERSION") ||
                !hash_equals($manifest["sha256"],hash_file("sha256",$argv[3]))) {
                fwrite(STDERR,"BLOCKED: candidate signature, source or checksum mismatch\n");
                exit(1);
            }' \
            "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-release.sig" \
            "$RUNNER_TEMP/candidate/AIWMWeb-Laravel-update.zip"
          cp "$RUNNER_TEMP/cpanel-source/AIWMWeb-Setup-v$VERSION.zip" "$RUNNER_TEMP/candidate/"
          unzip -p "$RUNNER_TEMP/candidate/AIWMWeb-Setup-v$VERSION.zip" BUILD-INFO.json > "$RUNNER_TEMP/candidate/BUILD-INFO.json"
          unzip -p "$RUNNER_TEMP/candidate/AIWMWeb-Setup-v$VERSION.zip" RELEASE-NOTES.txt > "$RUNNER_TEMP/candidate/RELEASE-NOTES.txt"
          (
            cd "$RUNNER_TEMP/candidate"
            sha256sum AIWMWeb-Setup-v"$VERSION".zip AIWMWeb-Laravel-update.zip \
              AIWMWeb-Laravel-signed-bundle.zip AIWMWeb-Laravel-release.json \
              AIWMWeb-Laravel-release.sig > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "SIGNED_STAGING_CANDIDATE=v$VERSION SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "NOT_PUBLISHED. NOT_DEPLOYED. Download test artifact and exercise isolated cPanel upgrade before enabling production release." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed candidate for isolated staging only
        uses: actions/upload-artifact@v7
        with:
          name: AIWMWeb-Laravel-SIGNED-STAGING-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

name: Slot0282 Temporary Parity Materializer

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-148B15F121-slot0281-reconcile
    paths:
      - '.github/workflows/slot0282-parity-materialize-temp.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor == 'walidatiyaai2025-gif'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AUTO-148B15F121-slot0281-reconcile
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate canonical parity artifacts
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Assert Slot0282 generated authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          totals = data['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 532, totals
          assert totals['pending'] == 399, totals
          assert totals['blocked'] == 0, totals
          row = next(x for x in data['operations'] if x['operation_id'] == 'AIMW-AUTO-148B15F121')
          assert row['migration_state'] == 'ADAPTED', row
          PY

      - name: Materialize only generated reconciliation files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
            'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          )
          [[ "${changed[*]}" == "${expected[*]}" ]] || {
            printf 'Unexpected generated diff:\n%s\n' "${changed[*]}"
            exit 1
          }
          git config user.name 'walidatiyaai2025-gif'
          git config user.email 'walidatiyaai2025-gif@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'chore(laravel): materialize slot0282 parity reconciliation'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AUTO-148B15F121-slot0281-reconcile

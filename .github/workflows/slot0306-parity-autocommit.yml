name: Slot0306 GetDatabasePath Reconciliation

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-PLAT-F6C1A04662-reconcile-slot0306

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Focused GetDatabasePath acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/DatabasePathTerminalityTest.php

      - name: Preserve pre-reconciliation ledger
        run: cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/slot0306-before.json

      - name: Regenerate canonical parity artifacts
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Assert isolated Slot0306 delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/slot0306-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          before_rows = {row['operation_id']: row for row in before['operations']}
          after_rows = {row['operation_id']: row for row in after['operations']}
          changes = [
              (op_id, before_rows[op_id]['migration_state'], after_rows[op_id]['migration_state'])
              for op_id in sorted(before_rows)
              if before_rows[op_id]['migration_state'] != after_rows[op_id]['migration_state']
          ]
          expected = [('AIMW-PLAT-F6C1A04662', 'PENDING', 'ADAPTED')]
          if changes != expected:
              raise SystemExit(f'non-isolated parity delta: {changes!r}')
          totals = after['totals']
          required = {'total': 931, 'terminal': 559, 'pending': 372, 'blocked': 0, 'adapted': 559}
          for key, value in required.items():
              if totals.get(key) != value:
                  raise SystemExit(f'unexpected {key}: {totals.get(key)} != {value}')
          row = after_rows['AIMW-PLAT-F6C1A04662']
          if (row.get('reconciliation') or {}).get('evidence_mode') != 'focused_service_contract':
              raise SystemExit('GetDatabasePath did not terminalize through focused_service_contract')
          if row.get('laravel_destination') != 'variants/laravel-aiwmweb/backend/config/database.php':
              raise SystemExit('unexpected GetDatabasePath destination')
          print('SLOT0306_ISOLATED_DELTA=PASS')
          PY

      - name: Commit exact generated artifacts
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'No generated parity changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(laravel): commit generated Slot0306 parity artifacts'
          git push origin HEAD:${GITHUB_REF_NAME}

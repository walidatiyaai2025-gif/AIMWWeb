name: UX Regression Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-accessibility:
    name: visual-accessibility (${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.49.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: smoke-public
            filter: FullyQualifiedName~Blazor_bootstrap_asset_is_available_before_authentication|FullyQualifiedName~Public_routes_render_without_server_or_browser_failure|FullyQualifiedName~Keyboard_focus_enters_the_authenticated_application|FullyQualifiedName~Content_view_only_role_can_read_owned_content_without_mutation_affordances|FullyQualifiedName~Add_site_form_accepts_keyboard_input|FullyQualifiedName~Welcome_page_loads_scoped_css_bundle_and_material_layout|FullyQualifiedName~RegistrationUxTests
          - shard: authenticated-routes
            filter: FullyQualifiedName~Authenticated_routes_render_and_pass_accessibility_smoke
          - shard: seo-audit
            filter: FullyQualifiedName~SeoAuditUxTests
          - shard: comments-moderation
            filter: FullyQualifiedName~CommentsModerationUxTests
          - shard: taxonomy-mutations
            filter: FullyQualifiedName~TaxonomyMutationsUxTests
          - shard: media-upload
            filter: FullyQualifiedName~MediaUploadUxTests
          - shard: media-update-delete
            filter: FullyQualifiedName~MediaUpdateDeleteUxTests
          - shard: content-editor-mutations
            filter: FullyQualifiedName~ContentEditorMutationsUxTests
          - shard: approval-execution
            filter: FullyQualifiedName~ApprovalExecutionUxTests
          - shard: session-revocation
            filter: FullyQualifiedName~SessionRevocationUxTests
          - shard: application-user-admin
            filter: FullyQualifiedName~ApplicationUserAdministrationUxTests
          - shard: roles-permissions
            filter: FullyQualifiedName~RolesPermissionsUxTests
          - shard: reports-exports
            filter: FullyQualifiedName~ReportsExportsUxTests
          - shard: settings-database-provider
            filter: FullyQualifiedName~SettingsDatabaseProviderUxTests
          - shard: logs-diagnostics
            filter: FullyQualifiedName~LogsBrowserAcceptanceUxTests
          - shard: backup-restore
            filter: FullyQualifiedName~BackupRestoreBrowserAcceptanceUxTests
          - shard: workspace-hub
            filter: FullyQualifiedName~WorkspaceHubNavigationUxTests
          - shard: ai-center
            filter: FullyQualifiedName~AICenterReadinessUxTests
          - shard: ai-provider-settings
            filter: FullyQualifiedName~AIProviderSettingsAvailabilityUxTests
          - shard: execution-authenticity
            filter: FullyQualifiedName~ExecutionAuthenticityUxTests
          - shard: site-operations
            filter: FullyQualifiedName~SiteOperationsBrowserAcceptanceUxTests
          - shard: visual-breakpoints
            filter: FullyQualifiedName~High_risk_pages_hold_visual_contract_at_key_breakpoints
          - shard: rtl
            filter: FullyQualifiedName~Selected_high_risk_pages_preserve_material_contract_in_arabic_rtl
    env:
      DOTNET_NOLOGO: 1
      UX_REGRESSION_MODE: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify container .NET SDK
        run: dotnet --info

      - name: Restore application solution
        run: dotnet restore AIWordPressManager.Web.sln --disable-parallel

      - name: Build application for browser host
        run: dotnet build AIWordPressManager.Web.sln --configuration Release --no-restore

      - name: Restore UX regression project
        run: dotnet restore tests/AIWordPressManager.UxTests/AIWordPressManager.UxTests.csproj --disable-parallel

      - name: Build UX regression project
        run: dotnet build tests/AIWordPressManager.UxTests/AIWordPressManager.UxTests.csproj --configuration Release --no-restore

      - name: Run ${{ matrix.shard }} visual and accessibility gates
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          dotnet test tests/AIWordPressManager.UxTests/AIWordPressManager.UxTests.csproj \
            --configuration Release \
            --no-build \
            --filter '${{ matrix.filter }}' \
            --blame-hang \
            --blame-hang-timeout 3m \
            --blame-hang-dump-type mini \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=ux-regression-${{ matrix.shard }}.trx"
          test_exit=$?
          finished_at=$(date +%s)
          elapsed_seconds=$((finished_at - started_at))
          {
            echo "### UX regression shard: ${{ matrix.shard }}"
            echo "- Duration: ${elapsed_seconds}s"
            echo "- Exit code: ${test_exit}"
            echo '- Filter: `${{ matrix.filter }}`'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Upload ${{ matrix.shard }} UX regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-regression-evidence-${{ matrix.shard }}
          path: |
            artifacts/ux-regression/**
            tests/AIWordPressManager.UxTests/TestResults/**
          if-no-files-found: warn
          retention-days: 30

name: Laravel AIWMWeb Content Planner Recovery V2 Generate

on:
  push:
    branches:
      - worker/laravel-bill-69825fead5-content-planner-recovery-v2

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip content-planner-generator]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PREVIOUS_RECONCILIATION_SHA: '80adb539c8be76ef5c966ceed04e18e252ff14c2'
      EVIDENCE_SOURCE_SHA: '3ef0d094b3211f0e67966346f1a896d2daf164a9'
      TARGET_OPERATION_ID: 'AIMW-BILL-69825FEAD5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-bill-69825fead5-content-planner-recovery-v2

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register exact pushed route provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = os.environ['PREVIOUS_RECONCILIATION_SHA']
          source = {
              'label': 'Content Planner explicit tenant route recovery',
              'sha': os.environ['EVIDENCE_SOURCE_SHA'],
              'observed_pr_head': os.environ['EVIDENCE_SOURCE_SHA'],
              'domains': ['billing'],
              'operation_ids': [os.environ['TARGET_OPERATION_ID']],
              'route_api_provenance': {
                  os.environ['TARGET_OPERATION_ID']: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/ContentPlannerRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/CanonicalWorkspaceRouteController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/ContentPlannerRouteTerminalityTest.php',
                      'operation_link_test': 'variants/laravel-aiwmweb/backend/tests/Feature/ContentPlannerRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/content-planner-route-terminality.json',
                      'security_mode': 'tenant_scoped'
                  }
              }
          }
          data['countable_sources'] = [
              entry for entry in data.get('countable_sources', [])
              if os.environ['TARGET_OPERATION_ID'] not in (entry.get('route_api_provenance') or {})
          ]
          data['countable_sources'].append(source)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run official 931-operation reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Guard exactly one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          git show "${PREVIOUS_RECONCILIATION_SHA}:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous-reconciliation.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          before = json.loads(Path('/tmp/previous-reconciliation.json').read_text(encoding='utf-8'))
          after = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          before_rows = {row['operation_id']: row for row in before['operations']}
          after_rows = {row['operation_id']: row for row in after['operations']}
          target = os.environ['TARGET_OPERATION_ID']
          assert len(before_rows) == 931 and len(after_rows) == 931
          transitions = []
          for operation_id in sorted(before_rows):
              old = before_rows[operation_id]['migration_state']
              new = after_rows[operation_id]['migration_state']
              if old != new:
                  transitions.append((operation_id, old, new))
          expected = [(target, 'PENDING', 'ADAPTED')]
          if transitions != expected:
              raise SystemExit(f'unexpected canonical transitions: {transitions!r}; expected {expected!r}')
          terminal = sum(row['migration_state'] != 'PENDING' and row['migration_state'] != 'BLOCKED' for row in after_rows.values())
          pending = sum(row['migration_state'] == 'PENDING' for row in after_rows.values())
          blocked = sum(row['migration_state'] == 'BLOCKED' for row in after_rows.values())
          if (terminal, pending, blocked) != (589, 342, 0):
              raise SystemExit(f'unexpected canonical counts: terminal={terminal} pending={pending} blocked={blocked}')
          print('EXACT_TRANSITION=PASS')
          print('TOTAL=931')
          print(f'TERMINAL={terminal}')
          print(f'PENDING={pending}')
          print(f'BLOCKED={blocked}')
          PY

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'docs(laravel): reconcile content planner route [skip content-planner-generator]'
          git push origin HEAD:worker/laravel-bill-69825fead5-content-planner-recovery-v2

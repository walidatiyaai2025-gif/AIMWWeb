name: Laravel AIWMWeb AppButton Materialize

on:
  push:
    branches:
      - worker/laravel-plat-57e0113f24-app-button-click
    paths:
      - '.github/workflows/laravel-aiwmweb-app-button-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch repository refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify exact recovery scope and pin evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          target = 'AIMW-PLAT-57E0113F24'
          recon = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          doc = json.loads(recon.read_text())
          row = next(item for item in doc['operations'] if item['operation_id'] == target)
          assert row['migration_state'] == 'PENDING', row
          assert row['domain'] == 'platform', row
          assert row['kind'] == 'visible_control', row
          assert row['route_screen'] == 'component:AppButton', row
          assert row['visible_control'] == '@Title [OnClick]', row
          assert row['current_source'] == 'src/AIWordPressManager.Web/Components/Shared/AppButton.razor', row
          print('canonical row:', {k: row.get(k) for k in ('operation_id','mutation','tenant_owned','risk','migration_state')})

          manifest_path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['previous_reconciliation_sha'] = 'c1610f53aa18fa2b874901d9db10c803f658ef66'
          manifest['focused_closure_evidence_source_sha'] = '9ba87792857894adf6028e3e27ef444748acf8ec'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          test -z "$(git diff --name-only c1610f53aa18fa2b874901d9db10c803f658ef66 -- src/AIWordPressManager.Web/Components/Shared/AppButton.razor)"
      - name: Run official six-stage reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
      - name: Assert isolated canonical transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          target = 'AIMW-PLAT-57E0113F24'
          before = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          after = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          old = {row['operation_id']: row['migration_state'] for row in before['operations']}
          new = {row['operation_id']: row['migration_state'] for row in after['operations']}
          changed = [(op, old[op], new[op]) for op in old if old[op] != new[op]]
          assert changed == [(target, 'PENDING', 'ADAPTED')], changed
          bt, at = before['totals'], after['totals']
          assert bt['total'] == at['total'] == 931, (bt, at)
          assert at['terminal'] == bt['terminal'] + 1, (bt, at)
          assert at['pending'] == bt['pending'] - 1, (bt, at)
          assert at['blocked'] == bt['blocked'], (bt, at)
          print('isolated transition:', changed)
          print('totals:', at)
          PY
      - name: Materialize canonical output and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/laravel-aiwmweb-app-button-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'chore(laravel): reconcile AppButton click evidence'
          git push origin HEAD:worker/laravel-plat-57e0113f24-app-button-click

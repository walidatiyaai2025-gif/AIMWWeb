name: Laravel AIWMWeb Slot 0029 Reconcile

on:
  push:
    branches:
      - manager/laravel-aiwmweb-post-390-reconciliation
    paths:
      - '.github/workflows/laravel-aiwmweb-slot-0029-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register integrated AI Center route evidence
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^)"
          test "$base_sha" = "af67f421f2850ccb7afc8089aaad15149f7a636a"
          python - "$base_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          base_sha = sys.argv[1]
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          operation_id = 'AIMW-AI-82F795EE67'

          for source in manifest.get('countable_sources', []):
              if operation_id in (source.get('route_api_provenance') or {}):
                  raise SystemExit(f'{operation_id} is already registered')

          manifest['previous_reconciliation_sha'] = base_sha
          manifest['countable_sources'].append({
              'label': 'Canonical AI Center route closure after PR #390 integration',
              'sha': base_sha,
              'observed_pr_head': '6d135cc0aaac7c367ced659538e942475e270e0e',
              'domains': ['ai'],
              'supporting_only': True,
              'route_api_provenance': {
                  operation_id: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/AiCenterRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/AiCenterReadController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/AiCenterRouteTerminalityTest.php',
                      'operation_link_test': 'variants/laravel-aiwmweb/backend/tests/Feature/AiCenterRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/ai-center-route-terminality.json',
                      'security_mode': 'tenant_bound',
                  }
              },
          })
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical parity artifacts
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Verify exact one-operation delta
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha af67f421f2850ccb7afc8089aaad15149f7a636a
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          t = p['totals']
          assert t['total'] == 931, t
          assert t['terminal'] == 467, t
          assert t['pending'] == 464, t
          assert t['blocked'] == 0, t
          row = next(r for r in p['operations'] if r['operation_id'] == 'AIMW-AI-82F795EE67')
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['evidence_mode'] == 'explicit_route_api_contract', row
          assert p['validation']['passed'] is True, p['validation']
          print('SLOT_0029_RECONCILIATION=PASS')
          PY

      - name: Commit generated reconciliation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/laravel-aiwmweb-slot-0029-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/laravel-aiwmweb-slot-0029-reconcile.yml
          git commit -m "Reconcile AIMW-AI-82F795EE67 after integration"
          git push origin HEAD:manager/laravel-aiwmweb-post-390-reconciliation

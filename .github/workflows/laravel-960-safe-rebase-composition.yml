name: Laravel 960 reconcile moved composition safely

on:
  push:
    branches:
      - worker/960-global-users-previous
    paths:
      - '.github/workflows/laravel-960-safe-rebase-composition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current integration without touching other workers or discarding their evidence
        shell: bash
        run: |
          set -euo pipefail
          base="worker/laravel-aiwmweb-closure-composition"
          manifest="variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit "refs/remotes/origin/$base"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "MERGE_CONFLICT_FILES=$conflicts"
            recon_json="variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json"
            recon_md="variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md"
            while IFS= read -r conflicted; do
              case "$conflicted" in
                "$manifest"|"$recon_json"|"$recon_md") ;;
                *) echo "Unexpected conflict: $conflicted; aborting rather than overwriting worker code" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
            git checkout --theirs -- "$manifest" "$recon_json" "$recon_md"
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data=json.loads(p.read_text())
          op='AIMW-SYNC-E0791EA9E9'
          evidence_sha='ee65778c11019a99b638f09e789f63090b6d827e'
          sources=data['focused_closure_operation_sources']
          existing=[s for s in sources if op in s.get('operation_ids',[])]
          assert not existing or (len(existing)==1 and existing[0]['sha']==evidence_sha),existing
          if not existing:
              sources.append({'label':'AIMW-SYNC-E0791EA9E9 GlobalUsersWorkspace PreviousAsync focused closure #960','sha':evidence_sha,'observed_pr_head':evidence_sha,'operation_ids':[op]})
          p.write_text(json.dumps(data,indent=2)+'\n')
          print('MANIFEST_MERGED_NO_DUPLICATE',op,len(sources))
          PY
            git add "$manifest" "$recon_json" "$recon_md"
          fi
          test -f "$manifest"
          git diff --name-only --diff-filter=U | grep . && { echo "Unresolved conflict" >&2; exit 1; } || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild official 931-row reconciliation over merged latest integration
        shell: bash
        run: |
          set -euo pipefail
          tool=variants/laravel-aiwmweb/tools
          python "$tool/finalize_operation_parity.py" --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          for stage in apply_tenant_neutral_route_evidence apply_platform_admin_route_evidence apply_explicit_route_api_provenance apply_focused_closure_evidence apply_focused_service_evidence apply_focused_background_job_evidence; do
            python "$tool/${stage}.py" --input /tmp/parity.json --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/parity.json'))
          rows={r['operation_id']:r for r in d['operations']}
          assert rows['AIMW-SYNC-E0791EA9E9']['migration_state']=='ADAPTED'
          assert d['totals']['total']==931
          assert d['validation']['passed']
          assert d['totals']['terminal']>=892,d['totals']
          print('RECONCILIATION_PASS',d['totals'])
          PY
          cp /tmp/parity.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/parity.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Commit the actual merge and official generated parity, without a force-push
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/laravel-960-safe-rebase-composition.yml
          git commit -m "merge(laravel #960): incorporate current composition and regenerate canonical parity"
          git push origin HEAD:refs/heads/worker/960-global-users-previous
          echo "EXACT_MERGED_PARITY_SHA=$(git rev-parse HEAD)"

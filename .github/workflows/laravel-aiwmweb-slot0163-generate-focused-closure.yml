name: Laravel AIWMWeb Slot 0163 Generate Focused Closure

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-746EDAE589-slot0163
    paths:
      - '.github/workflows/laravel-aiwmweb-slot0163-generate-focused-closure.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      SOURCE_SHA: 6608ebf892c1a57861f927e80928ed01066fcbd1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch exact pushed evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Point focused closure manifest at exact pushed evidence commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run canonical parity reconciliation generator chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Verify selected operation and generated totals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if len(payload['operations']) != 931:
              raise SystemExit(f"unexpected operation denominator: {len(payload['operations'])}")
          row = next(item for item in payload['operations'] if item['operation_id'] == 'AIMW-AI-746EDAE589')
          if row['migration_state'] != 'ADAPTED':
              raise SystemExit(f"selected operation did not terminalize: {row['migration_state']}")
          totals = payload['totals']
          state_total = sum(int(totals[key]) for key in ('ported', 'adapted', 'pending', 'blocked', 'verified_unavailable_external'))
          if state_total != len(payload['operations']):
              raise SystemExit('generated totals do not reconcile')
          print(f"TOTAL={len(payload['operations'])}")
          print(f"TERMINAL={totals['terminal']}")
          print(f"PENDING={totals['pending']}")
          print(f"BLOCKED={totals['blocked']}")
          print('AIMW-AI-746EDAE589=ADAPTED')
          PY
      - name: Commit official generated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'GENERATED_RECONCILIATION_CHANGED=NO'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(laravel): reconcile AI Center clear history parity evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Laravel AIWMWeb Save Plan Delta Validation

on:
  push:
    branches:
      - worker/laravel-bill-5af09adaba-save-plan-recovery-v2
    paths:
      - '.github/workflows/laravel-aiwmweb-save-plan-materialize.yml'

permissions:
  contents: read

jobs:
  validate-single-operation-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch authoritative composition
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Verify exact generated delta and Save plan metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          target = 'AIMW-BILL-5AF09ADABA'
          terminal = {'PORTED', 'ADAPTED', 'VERIFIED_UNAVAILABLE_EXTERNAL'}
          path = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'

          current = json.loads(Path(path).read_text(encoding='utf-8'))
          base_raw = subprocess.check_output([
              'git', 'show', f'origin/worker/laravel-aiwmweb-closure-composition:{path}'
          ], text=True)
          base = json.loads(base_raw)

          assert current['totals']['total'] == 931, current['totals']
          assert current['totals']['terminal'] == 600, current['totals']
          assert current['totals']['pending'] == 331, current['totals']
          assert current['totals']['blocked'] == 0, current['totals']

          base_rows = {row['operation_id']: row for row in base['operations']}
          current_rows = {row['operation_id']: row for row in current['operations']}
          assert set(base_rows) == set(current_rows)

          newly_terminal = [
              op_id for op_id, row in current_rows.items()
              if base_rows[op_id]['migration_state'] not in terminal
              and row['migration_state'] in terminal
          ]
          terminal_regressions = [
              op_id for op_id, row in current_rows.items()
              if base_rows[op_id]['migration_state'] in terminal
              and row['migration_state'] not in terminal
          ]
          state_changes = [
              op_id for op_id, row in current_rows.items()
              if base_rows[op_id]['migration_state'] != row['migration_state']
          ]

          row = current_rows[target]
          assert newly_terminal == [target], newly_terminal
          assert terminal_regressions == [], terminal_regressions
          assert state_changes == [target], state_changes
          assert row['migration_state'] == 'ADAPTED', row
          assert row['kind'] == 'visible_control', row
          assert row['domain'] == 'billing', row
          assert row['mutation'] is True, row
          assert 'SaveAsync' in row['visible_control'], row
          signals = row.get('reconciliation', {}).get('signals', [])
          assert 'test:authorization' in signals, signals
          assert 'test:tenant-isolation' in signals, signals

          print('TOTAL=931')
          print('TERMINAL=600')
          print('PENDING=331')
          print('BLOCKED=0')
          print('NEWLY_TERMINAL=' + ','.join(newly_terminal))
          print('STATE_CHANGES=' + ','.join(state_changes))
          print('TARGET_MUTATION=' + str(row['mutation']).lower())
          print('TARGET_STATE=' + row['migration_state'])
          print('TARGET_SIGNALS=' + ','.join(signals))
          print('SINGLE_OPERATION_DELTA=PASS')
          PY

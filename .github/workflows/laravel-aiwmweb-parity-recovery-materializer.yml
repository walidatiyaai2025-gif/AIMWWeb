name: Laravel AIWMWeb Parity Recovery Materializer

on:
  push:
    branches:
      - 'worker/laravel-AIMW-CONT-85394A0E55-evidence-recovery'
    paths:
      - '.github/laravel-aiwmweb-parity-recovery.trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild using the official six-step reconciliation pipeline
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Guard exactly one canonical terminality transition
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json').read_text())
          print(manifest['previous_reconciliation_sha'])
          PY
          )"
          git show "$previous_sha:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json
          from pathlib import Path
          target = 'AIMW-CONT-85394A0E55'
          old = json.loads(Path('/tmp/previous.json').read_text())
          new = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          old_ops = {row['operation_id']: row for row in old['operations']}
          new_ops = {row['operation_id']: row for row in new['operations']}
          assert set(old_ops) == set(new_ops), 'canonical operation set changed'
          state_changes = [
              (op, old_ops[op]['migration_state'], new_ops[op]['migration_state'])
              for op in sorted(old_ops)
              if old_ops[op]['migration_state'] != new_ops[op]['migration_state']
          ]
          assert state_changes == [(target, 'PENDING', 'ADAPTED')], state_changes
          totals = new['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 584, totals
          assert totals['pending'] == 347, totals
          assert totals['blocked'] == 0, totals
          print('guarded state transition:', state_changes)
          print('guarded totals:', totals)
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$previous_sha"

      - name: Materialize generated authority and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/laravel-aiwmweb-parity-recovery.trigger
          git rm .github/workflows/laravel-aiwmweb-parity-recovery-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git commit -m 'chore(laravel): materialize recovered Error parity authority'
          git push origin HEAD:worker/laravel-AIMW-CONT-85394A0E55-evidence-recovery

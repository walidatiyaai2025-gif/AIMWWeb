name: Temporary Laravel CurrentUser Logs Generator 501

on:
  push:
    branches:
      - tmp/laravel-cd4ada5087-generator-501
    paths:
      - '.github/workflows/tmp-laravel-cd4ada5087-generator-501.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-iden-cd4ada5087-current-user-logs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact pushed evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: Point focused evidence at tested closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          old = data.get('focused_closure_evidence_source_sha')
          assert old == 'f2457deef90a59b809b4c9760802834c63c4e1c6', f'unexpected focused source: {old}'
          data['focused_closure_evidence_source_sha'] = '87292cc70b53c399dcd79aa813151a671bc8032c'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run official generator chain
        shell: bash
        run: |
          set -euo pipefail
          root='variants/laravel-aiwmweb'
          python "$root/tools/finalize_operation_parity.py" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$root/tools/apply_tenant_neutral_route_evidence.py" \
            --input "$root/docs/operation-parity-reconciliation.json" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$root/tools/apply_explicit_route_api_provenance.py" \
            --input "$root/docs/operation-parity-reconciliation.json" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$root/tools/apply_focused_closure_evidence.py" \
            --input "$root/docs/operation-parity-reconciliation.json" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$root/tools/apply_focused_service_evidence.py" \
            --input "$root/docs/operation-parity-reconciliation.json" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
          python "$root/tools/apply_focused_background_job_evidence.py" \
            --input "$root/docs/operation-parity-reconciliation.json" \
            --output "$root/docs/operation-parity-reconciliation.json" \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$root/docs/operation-parity-reconciliation.md" \
            --check-total 931
      - name: Assert exact one-operation terminalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          totals = p['totals']
          assert len(p['operations']) == 931
          assert totals['terminal'] == 568, totals
          assert totals['pending'] == 363, totals
          assert totals['blocked'] == 0, totals
          rows = [r for r in p['operations'] if r.get('operation_id') == 'AIMW-IDEN-CD4ADA5087']
          assert len(rows) == 1, len(rows)
          assert rows[0].get('migration_state') == 'ADAPTED', rows[0]
          validation = p.get('validation') or {}
          assert 'AIMW-IDEN-CD4ADA5087' in (validation.get('focused_closure_contract_terminals') or []), validation
          assert validation.get('passed') is True, validation
          print('TOTAL=931 TERMINAL=568 PENDING=363 BLOCKED=0')
          print('AIMW-IDEN-CD4ADA5087=ADAPTED')
          PY
      - name: Commit generator-backed reconciliation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --exit-code && { echo 'Expected generated reconciliation delta missing'; exit 1; } || true
          git commit -m 'docs(laravel): terminalize AIMW-IDEN-CD4ADA5087 via generator'
          git push origin HEAD:worker/laravel-iden-cd4ada5087-current-user-logs

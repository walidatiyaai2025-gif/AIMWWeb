name: Temporary materialize site email settings route

on:
  push:
    branches:
      - worker/laravel-emai-bfdc050625-site-email-route-20260918

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      AUTHORITY_SHA: e4f36dc5848e727c19c87e9bdcac84489e1f45a2
      OPERATION_ID: AIMW-EMAI-BFDC050625
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Prove exact one-operation delta
        shell: bash
        run: |
          set -euo pipefail
          git show "$AUTHORITY_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json
          from pathlib import Path
          previous=json.loads(Path('/tmp/previous.json').read_text())
          current=json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          prev={r['operation_id']:r for r in previous['operations']}
          cur={r['operation_id']:r for r in current['operations']}
          changed=sorted(op for op in prev if prev[op]['migration_state'] != cur[op]['migration_state'])
          assert changed == ['AIMW-EMAI-BFDC050625'], changed
          assert prev['AIMW-EMAI-BFDC050625']['migration_state'] == 'PENDING'
          assert cur['AIMW-EMAI-BFDC050625']['migration_state'] == 'ADAPTED'
          totals=current['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 608, totals
          assert totals['pending'] == 323, totals
          assert totals['blocked'] == 0, totals
          assert current['validation']['passed'] is True
          print('exact_delta=1 total=931 terminal=608 pending=323 blocked=0')
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha "$AUTHORITY_SHA"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Run focused Laravel acceptance
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
          vendor/bin/pint --test tests/Feature/SiteEmailSettingsRouteTerminalityTest.php
          php artisan test tests/Feature/SiteEmailSettingsRouteTerminalityTest.php

      - name: Commit generator-backed reconciliation and self-clean helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-materialize-site-email-settings-route.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json
          git commit -m 'reconcile: materialize site email settings route'
          git push origin HEAD:${GITHUB_REF_NAME}

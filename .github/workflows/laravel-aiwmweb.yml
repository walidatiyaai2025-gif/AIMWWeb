name: Laravel AIWMWeb

on:
  pull_request:
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/laravel-aiwmweb.yml'
  push:
    branches: [main, worker/laravel-aiwmweb-accept-parity]
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/laravel-aiwmweb.yml'

permissions:
  contents: read

jobs:
  parity-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh parity ledger
        run: python variants/laravel-aiwmweb/tools/capability_census.py --refresh
      - name: Enforce parity ledger and fake/dead-function census
        run: python variants/laravel-aiwmweb/tools/acceptance_gate.py

  tenant-core-sqlite:
    needs: parity-preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  tenant-core-mysql:
    needs: parity-preflight
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aiwm
          MYSQL_USER: aiwm
          MYSQL_PASSWORD: aiwm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, dom, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Migrate against production-like MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aiwm
          DB_USERNAME: aiwm
          DB_PASSWORD: aiwm
        run: php artisan migrate:fresh --force
      - name: Run tenant and contract tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aiwm
          DB_USERNAME: aiwm
          DB_PASSWORD: aiwm
        run: php artisan test --testsuite=Feature

  wordpress-rest-integration:
    needs: parity-preflight
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli, pdo_mysql, dom, curl
          coverage: none
      - name: Provision disposable WordPress
        run: bash variants/laravel-aiwmweb/tests/wordpress/bootstrap-wordpress.sh
      - name: Verify authenticated REST read/mutate/reread
        env:
          WP_BASE_URL: http://127.0.0.1:8090
          WP_APP_USER: aiwm-integration
          WP_APP_PASSWORD: aiwm-integration-app-password
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          base = os.environ['WP_BASE_URL']
          auth = base64.b64encode(f"{os.environ['WP_APP_USER']}:{os.environ['WP_APP_PASSWORD']}".encode()).decode()
          headers = {'Authorization': f'Basic {auth}', 'Content-Type': 'application/json'}
          def req(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(r) as response:
                  return json.load(response)
          post = req('/wp-json/wp/v2/posts', 'POST', {'title': 'Laravel AIWMWeb contract', 'status': 'draft'})
          pid = post['id']
          reread = req(f'/wp-json/wp/v2/posts/{pid}')
          assert reread['id'] == pid and reread['status'] == 'draft'
          updated = req(f'/wp-json/wp/v2/posts/{pid}', 'POST', {'title': 'Laravel AIWMWeb verified mutation'})
          reread2 = req(f'/wp-json/wp/v2/posts/{pid}')
          assert reread2['title']['rendered'] == 'Laravel AIWMWeb verified mutation'
          print(json.dumps({'post_id': pid, 'status': reread2['status']}))
          PY

  frontend:
    needs: parity-preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

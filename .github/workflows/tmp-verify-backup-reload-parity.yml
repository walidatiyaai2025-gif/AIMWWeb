name: Temporary verify backup reload parity stability

on:
  push:
    branches:
      - recovery/laravel-backup-reload-hardening-final-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/recon.json
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md /tmp/recon.md
          python -c "import json; d=json.load(open('/tmp/recon.json')); t=d['totals']; assert len(d['operations'])==931; assert t['terminal']==606; assert t['pending']==325; assert t['blocked']==0; print('PARITY_STABLE=931/606/325/0')"
      - name: Self-clean validation helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-verify-backup-reload-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: self-clean backup parity verifier'
          git push origin HEAD:recovery/laravel-backup-reload-hardening-final-20260917

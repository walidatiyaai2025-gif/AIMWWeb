name: Laravel AIWMWeb Parity Sync Temporary 3025

on:
  push:
    branches:
      - worker/laravel-reconcile-AIMW-PLAT-3025C8E82B
    paths:
      - '.github/workflows/laravel-aiwmweb-parity-sync-temp-3025.yml'

permissions:
  contents: write

jobs:
  sync-generated-parity:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-reconcile-AIMW-PLAT-3025C8E82B

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Commit generator output only
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'Canonical reconciliation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(laravel): sync generated temporary directory reconciliation'
          git push origin HEAD:worker/laravel-reconcile-AIMW-PLAT-3025C8E82B

name: Temporary logs copy parity materialization

on:
  push:
    branches:
      - worker/laravel-bill-2138cd95b2-logs-copy-visible-20260917
    paths:
      - '.github/workflows/tmp-materialize-logs-copy-parity.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact focused closure evidence snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text())
          manifest['focused_closure_evidence_source_sha'] = '69e298563e87397aa25aaf8c14d9b7ec48c9f8f8'
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
      - name: Verify target closure and totals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          assert payload['totals']['total'] == 931
          assert payload['totals']['terminal'] == 605
          assert payload['totals']['pending'] == 326
          assert payload['totals']['blocked'] == 0
          rows = {row['operation_id']: row for row in payload['operations']}
          row = rows['AIMW-BILL-2138CD95B2']
          assert row['migration_state'] == 'ADAPTED'
          assert row['reconciliation']['evidence_mode'] == 'focused_closure_contract'
          assert row['reconciliation']['source_sha'] == '69e298563e87397aa25aaf8c14d9b7ec48c9f8f8'
          print('LOGS_COPY_PARITY_MATERIALIZATION=VERIFIED')
          PY
      - name: Commit exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --exit-code && { echo 'Expected generated parity changes but none were produced.'; exit 1; } || true
          git commit -m 'docs: rematerialize AIMW-BILL-2138CD95B2 reconciliation [parity-materialized]'
          git push origin HEAD:worker/laravel-bill-2138cd95b2-logs-copy-visible-20260917

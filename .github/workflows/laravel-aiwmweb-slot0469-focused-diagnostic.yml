name: Laravel AIWMWeb Slot0469 Focused Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 495 && github.head_ref == 'worker/laravel-iden-bf78057c28-signout'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pushed refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pre-focused canonical payload
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/recon.json --output /tmp/recon.json --summary-output /tmp/summary.json --markdown-output /tmp/recon.md --check-total 931
      - name: Evidence document is discoverable at configured source
        run: |
          cd variants/laravel-aiwmweb/tools
          python - <<'PY'
          import json
          import apply_focused_closure_evidence as focused
          import reconcile_operation_parity as reconcile
          manifest=json.loads(reconcile.MANIFEST.read_text())
          sha=manifest['focused_closure_evidence_source_sha']
          paths=focused.evidence_paths(sha)
          target='variants/laravel-aiwmweb/docs/closure-evidence/current-user-sign-out-terminality.json'
          assert target in paths, (sha, target, paths[-20:])
          doc=focused.load_evidence(sha,target)
          assert focused.operation_id(doc)=='AIMW-IDEN-BF78057C28'
          assert focused.terminal_state(doc) in focused.TERMINAL_STATES
          PY
      - name: Canonical row is pending visible control
        run: |
          cd variants/laravel-aiwmweb/tools
          python - <<'PY'
          import json
          p=json.load(open('/tmp/recon.json'))
          r=next(x for x in p['operations'] if x['operation_id']=='AIMW-IDEN-BF78057C28')
          assert r['kind']=='visible_control', r
          assert r['migration_state']=='PENDING', r
          PY
      - name: Production operation marker is discoverable
        run: |
          cd variants/laravel-aiwmweb/tools
          python - <<'PY'
          import json
          import reconcile_operation_parity as reconcile
          manifest=json.loads(reconcile.MANIFEST.read_text())
          sha=manifest['focused_closure_evidence_source_sha']
          snap=reconcile.load_snapshot({'label':'diagnostic','sha':sha,'domains':['identity']})
          hits=[f.path for f in snap.code if 'AIMW-IDEN-BF78057C28' in f.text]
          assert hits, hits
          PY
      - name: Focused operation test marker is discoverable
        run: |
          cd variants/laravel-aiwmweb/tools
          python - <<'PY'
          import json
          import reconcile_operation_parity as reconcile
          manifest=json.loads(reconcile.MANIFEST.read_text())
          sha=manifest['focused_closure_evidence_source_sha']
          snap=reconcile.load_snapshot({'label':'diagnostic','sha':sha,'domains':['identity']})
          hits=[f.path for f in snap.tests if 'AIMW-IDEN-BF78057C28' in f.text]
          assert hits, hits
          PY
      - name: Focused security contract passes
        run: |
          cd variants/laravel-aiwmweb/tools
          python - <<'PY'
          import json
          import apply_focused_closure_evidence as focused
          import reconcile_operation_parity as reconcile
          p=json.load(open('/tmp/recon.json'))
          r=next(x for x in p['operations'] if x['operation_id']=='AIMW-IDEN-BF78057C28')
          manifest=json.loads(reconcile.MANIFEST.read_text())
          snap=reconcile.load_snapshot({'label':'diagnostic','sha':manifest['focused_closure_evidence_source_sha'],'domains':['identity']})
          tests=[f for f in snap.tests if 'AIMW-IDEN-BF78057C28' in f.text]
          ok,signals=focused.security_contract(r,tests)
          assert ok,(r.get('mutation'),r.get('risk'),signals)
          PY
      - name: Focused verifier terminalizes sign out
        run: |
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/recon.json --output /tmp/recon-focused.json --summary-output /tmp/summary-focused.json --markdown-output /tmp/recon-focused.md --check-total 931
          python - <<'PY'
          import json
          p=json.load(open('/tmp/recon-focused.json'))
          r=next(x for x in p['operations'] if x['operation_id']=='AIMW-IDEN-BF78057C28')
          assert r['migration_state']=='ADAPTED', r
          assert p['totals']['terminal']==562, p['totals']
          assert p['totals']['pending']==369, p['totals']
          PY

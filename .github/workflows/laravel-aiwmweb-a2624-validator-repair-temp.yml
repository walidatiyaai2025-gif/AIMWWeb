name: Laravel AIWMWeb A2624 Validator Repair Temporary

on:
  push:
    branches:
      - worker/laravel-AIMW-PLAT-A2624EDC66-reconciliation-recovery
    paths:
      - '.github/workflows/laravel-aiwmweb-a2624-validator-repair-temp.yml'

permissions:
  contents: write

jobs:
  repair-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-AIMW-PLAT-A2624EDC66-reconciliation-recovery
      - name: Add exact tenant-neutral service closure contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/backend/tests/Feature/PlatformServicesParityClosureTest.php')
          text = path.read_text()
          needle = "    private const STRICT_TENANT_NEUTRAL_FOCUSED_SERVICE_OPERATIONS = [\n"
          entry = """        'AIMW-PLAT-A2624EDC66' => [
              'route_screen' => 'service:ApplicationPathService',
              'current_source' => 'src/AIWordPressManager.Infrastructure/Paths/ApplicationPathService.cs',
              'visible_control' => 'GetApplicationDataDirectory',
              'destination' => 'variants/laravel-aiwmweb/backend/config/filesystems.php',
              'acceptance_test' => 'variants/laravel-aiwmweb/backend/tests/Feature/ApplicationDataDirectoryTerminalityTest.php',
              'evidence_path' => 'variants/laravel-aiwmweb/docs/closure-evidence/application-data-directory-terminality.json',
              'signals' => [
                  'operation:AIMW-PLAT-A2624EDC66',
                  'service:ApplicationPathService',
                  'member:GetApplicationDataDirectory',
                  'test:variants/laravel-aiwmweb/backend/tests/Feature/ApplicationDataDirectoryTerminalityTest.php',
                  'evidence:variants/laravel-aiwmweb/docs/closure-evidence/application-data-directory-terminality.json',
              ],
          ],
"""
          if entry in text:
              raise SystemExit(0)
          if needle not in text:
              raise SystemExit('STRICT_TENANT_NEUTRAL_FOCUSED_SERVICE_OPERATIONS anchor missing')
          path.write_text(text.replace(needle, needle + entry, 1))
      - name: Commit repair only
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/backend/tests/Feature/PlatformServicesParityClosureTest.php
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(laravel): admit exact application data service closure'
          git push origin HEAD:worker/laravel-AIMW-PLAT-A2624EDC66-reconciliation-recovery

name: Laravel AIWMWeb Slot0318 Materialize Generated Reconciliation

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 494 && github.head_ref == 'worker/laravel-aiwmweb-AIMW-BILL-90CF990147-slot0318'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-BILL-90CF990147-slot0318
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
      - name: Commit generated outputs and remove one-shot helper
        run: |
          rm .github/workflows/laravel-aiwmweb-slot0318-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/laravel-aiwmweb-slot0318-materialize.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(laravel): materialize generated parity for AIMW-BILL-90CF990147'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-BILL-90CF990147-slot0318

name: TEMP Format AIMW-BILL-4DCB58743D

on:
  push:
    branches:
      - recovery/laravel-bill-4dcb58743d-media-delete-final-20260918
    paths:
      - '.github/workflows/tmp-format-aiwm-bill-4dcb58743d.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/laravel-bill-4dcb58743d-media-delete-final-20260918
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install PHP dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist
      - name: Apply Pint only to this closure's PHP files
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          vendor/bin/pint             app/Content/MediaDeleteService.php             app/Content/Remote/NativeWordPressRestPath.php             app/Http/Controllers/ContentApiController.php             tests/Feature/MediaDeleteTerminalityTest.php
      - name: Commit formatting repair and self-remove
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-format-aiwm-bill-4dcb58743d.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/backend/app/Content/MediaDeleteService.php                   variants/laravel-aiwmweb/backend/app/Content/Remote/NativeWordPressRestPath.php                   variants/laravel-aiwmweb/backend/app/Http/Controllers/ContentApiController.php                   variants/laravel-aiwmweb/backend/tests/Feature/MediaDeleteTerminalityTest.php                   .github/workflows/tmp-format-aiwm-bill-4dcb58743d.yml
          git diff --cached --check
          git commit -m 'style(laravel): format media delete closure'
          git push origin HEAD:recovery/laravel-bill-4dcb58743d-media-delete-final-20260918

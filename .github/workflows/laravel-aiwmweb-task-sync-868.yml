name: Laravel AIWMWeb Task Sync 868

on:
  push:
    branches:
      - worker/868-sites-close-form
    paths:
      - '.github/workflows/laravel-aiwmweb-task-sync-868.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch current composition
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge composition and preserve #868 evidence
        shell: bash
        run: |
          set -euo pipefail
          REG=variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json
          OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json")
          data=json.loads(p.read_text())
          op="AIMW-CONT-FBA95BDC1D"
          entry=next(e for e in data["focused_closure_operation_sources"] if op in e.get("operation_ids", []))
          Path("/tmp/issue868-source.json").write_text(json.dumps(entry, ensure_ascii=False, indent=2)+"\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/worker/laravel-aiwmweb-closure-composition
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            for f in "$REG" "$OUT_JSON" "$OUT_MD"; do
              if git diff --name-only --diff-filter=U -- "$f" | grep -q .; then
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unresolved"
              exit 1
            fi
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json")
          data=json.loads(p.read_text())
          entry=json.loads(Path("/tmp/issue868-source.json").read_text())
          op="AIMW-CONT-FBA95BDC1D"
          data["focused_closure_operation_sources"]=[
              e for e in data["focused_closure_operation_sources"]
              if op not in e.get("operation_ids", [])
          ]
          data["focused_closure_operation_sources"].append(entry)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n")
          PY

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input "$OUT_JSON" --output "$OUT_JSON" --summary-output /tmp/operation-parity-summary.json \
            --markdown-output "$OUT_MD" --check-total 931

          rm -f .github/workflows/laravel-aiwmweb-task-sync-868.yml
          git add "$REG" "$OUT_JSON" "$OUT_MD" .github/workflows/laravel-aiwmweb-task-sync-868.yml
          git add -u
          git commit -m "merge(laravel): sync #868 with closure composition"
          git push origin "HEAD:${{ github.ref_name }}"

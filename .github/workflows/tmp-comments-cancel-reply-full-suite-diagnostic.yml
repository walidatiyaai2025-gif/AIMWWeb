name: TEMP Comments CancelReply Full Suite Diagnostic

on:
  push:
    branches:
      - worker/laravel-comm-843a2f029b-cancel-reply-recovery-2

permissions:
  contents: read

jobs:
  sqlite-full-suite-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Capture full PHPUnit output
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/comments-cancel-reply-full-suite.txt
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/comments-cancel-reply-full-suite.exitcode
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: comments-cancel-reply-full-suite-${{ github.sha }}
          path: |
            /tmp/comments-cancel-reply-full-suite.txt
            /tmp/comments-cancel-reply-full-suite.exitcode
          if-no-files-found: error

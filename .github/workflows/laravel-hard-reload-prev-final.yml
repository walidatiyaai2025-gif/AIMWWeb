        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'); d=json.loads(p.read_text())
          d['base_main_sha']='bd6d272748753e21b65655901eaed8bb65a267c7'

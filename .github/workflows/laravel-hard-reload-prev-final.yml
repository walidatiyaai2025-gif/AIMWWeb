          rm .github/workflows/laravel-hard-reload-prev-final.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'fix(laravel): bind previous reconciliation to authority head' && git push origin HEAD:worker/laravel-plat-4bae8344af-recovery

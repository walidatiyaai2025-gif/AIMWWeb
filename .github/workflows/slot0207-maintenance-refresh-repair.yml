name: Slot0207 Maintenance Refresh Repair

on:
  pull_request:
    branches:
      - worker/laravel-aiwmweb-closure-composition
    paths:
      - 'variants/laravel-aiwmweb/**'
      - '.github/workflows/slot0207-maintenance-refresh-repair.yml'

permissions:
  contents: read

jobs:
  validate-and-reconcile:
    if: github.head_ref == 'worker/laravel-aiwmweb-AIMW-AI-C5BC29CF27-slot0206'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist

      - name: Print exact Pint diff
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint app/Http/Controllers/SiteOperationsMaintenanceRefreshController.php tests/Feature/SiteOperationsMaintenanceRefreshPreviewTerminalityTest.php
          git --no-pager diff -- app/Http/Controllers/SiteOperationsMaintenanceRefreshController.php tests/Feature/SiteOperationsMaintenanceRefreshPreviewTerminalityTest.php
          exit 1

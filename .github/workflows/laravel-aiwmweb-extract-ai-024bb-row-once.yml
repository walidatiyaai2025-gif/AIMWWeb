name: Laravel AIWMWeb Extract AI 024BB Row Once

on:
  pull_request:
    paths:
      - '.github/workflows/laravel-aiwmweb-extract-ai-024bb-row-once.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract exact canonical row and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          operation_id = 'AIMW-AI-024BB0971B'
          source = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          matches = [row for row in payload.get('operations', []) if row.get('operation_id') == operation_id]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one row for {operation_id}, found {len(matches)}')
          row = matches[0]
          if row.get('migration_state') != 'PENDING':
              raise SystemExit(f'{operation_id} is no longer PENDING: {row.get("migration_state")}')
          out = Path('variants/laravel-aiwmweb/docs/diagnostics')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'AIMW-AI-024BB0971B.json').write_text(json.dumps(row, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/laravel-aiwmweb-extract-ai-024bb-row-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/diagnostics/AIMW-AI-024BB0971B.json
          git commit -m 'chore(laravel): extract AI 024BB canonical row'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

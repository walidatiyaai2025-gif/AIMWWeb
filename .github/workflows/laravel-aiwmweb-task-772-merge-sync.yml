name: Laravel AIWMWeb Task 772 Merge Sync

on:
  push:
    branches:
      - worker/772-content-hub-site-links
    paths:
      - '.github/workflows/laravel-aiwmweb-task-772-merge-sync.yml'

permissions:
  contents: write

jobs:
  merge-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      TARGET_BRANCH: worker/772-content-hub-site-links
      COMPOSITION_BRANCH: worker/laravel-aiwmweb-closure-composition
      OPERATION_ID: AIMW-CONT-276925F148
      HELPER_PATH: .github/workflows/laravel-aiwmweb-task-772-merge-sync.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/772-content-hub-site-links
          fetch-depth: 0

      - name: Merge latest composition and materialize atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          TASK_SNAPSHOT_SHA="$(git rev-parse HEAD)"
          SOURCE_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('variants/laravel-aiwmweb/docs/closure-evidence/content-hub-site-links-terminality.json')
          print(json.loads(p.read_text())['evidence_source_sha'])
          PY
          )"
          echo "task_snapshot=${TASK_SNAPSHOT_SHA}"
          echo "evidence_source=${SOURCE_SHA}"

          for attempt in 1 2 3 4 5; do
            echo "merge-sync attempt ${attempt}/5"
            git reset --hard "${TASK_SNAPSHOT_SHA}"
            git clean -fd
            git fetch origin "${COMPOSITION_BRANCH}"
            BASE_SHA="$(git rev-parse "origin/${COMPOSITION_BRANCH}")"
            echo "candidate base=${BASE_SHA}"

            set +e
            git merge --no-ff --no-commit "origin/${COMPOSITION_BRANCH}"
            merge_rc=$?
            set -e
            if [[ ${merge_rc} -ne 0 ]]; then
              echo "merge reported conflicts; resolving generator-owned/current-composition files"
            fi

            for path in               variants/laravel-aiwmweb/backend/resources/js/app.tsx               variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json               variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json               variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
            do
              git checkout "origin/${COMPOSITION_BRANCH}" -- "${path}"
              git add "${path}"
            done

            unexpected="$(git diff --name-only --diff-filter=U || true)"
            if [[ -n "${unexpected}" ]]; then
              echo "Unexpected merge conflicts remain:"
              echo "${unexpected}"
              exit 1
            fi

            python - <<'PY'
            from pathlib import Path
            import json
            import os

            app = Path('variants/laravel-aiwmweb/backend/resources/js/app.tsx')
            s = app.read_text()
            import_anchor = "import { ContentHubAllSitesControl } from './content-hub-all-sites-control';"
            import_line = "import { ContentHubSiteLinksControl } from './content-hub-site-links-control';"
            if import_line not in s:
                if import_anchor not in s:
                    raise SystemExit('content hub import anchor missing')
                s = s.replace(import_anchor, import_anchor + '\n' + import_line, 1)

            lines = s.splitlines()
            for i, line in enumerate(lines):
                if "route.key === 'content-hub'" in line:
                    if 'ContentHubSiteLinksControl' not in line:
                        needle = '<ContentHubAllSitesControl context={context} />'
                        if needle not in line:
                            raise SystemExit('content hub route anchor missing')
                        lines[i] = line.replace(needle, needle + '<ContentHubSiteLinksControl context={context} />', 1)
                    break
            else:
                raise SystemExit('content hub route missing')
            app.write_text('\n'.join(lines) + '\n')

            source_sha = os.environ['SOURCE_SHA']
            base_sha = os.environ['BASE_SHA']
            op = os.environ['OPERATION_ID']

            sources = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
            data = json.loads(sources.read_text())
            entry = {
                'label': 'AIMW-CONT-276925F148 GlobalContentHub dynamic site links focused closure',
                'sha': source_sha,
                'observed_pr_head': source_sha,
                'operation_ids': [op],
            }
            for key in ('countable_sources', 'focused_closure_operation_sources'):
                data[key] = [row for row in data[key] if op not in row.get('operation_ids', [])]
                data[key].append(entry)
            sources.write_text(json.dumps(data, indent=2) + '\n')

            evidence = Path('variants/laravel-aiwmweb/docs/closure-evidence/content-hub-site-links-terminality.json')
            payload = json.loads(evidence.read_text())
            payload.setdefault('provenance', {})['base_composition_sha'] = base_sha
            payload['provenance']['base_branch'] = 'worker/laravel-aiwmweb-closure-composition'
            payload['provenance']['branch'] = 'worker/772-content-hub-site-links'
            payload['provenance']['issue'] = 772
            payload['materialized'] = True
            payload['evidence_source_sha'] = source_sha
            evidence.write_text(json.dumps(payload, indent=2) + '\n')
            PY

            OUT_JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
            OUT_MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
            TMP_SUMMARY=/tmp/operation-parity-summary.json
            python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931
            python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT_JSON" --output "$OUT_JSON" --summary-output "$TMP_SUMMARY" --markdown-output "$OUT_MD" --check-total 931

            SOURCE_SHA="${SOURCE_SHA}" python - <<'PY'
            import json
            import os
            from pathlib import Path
            op = os.environ['OPERATION_ID']
            sha = os.environ['SOURCE_SHA']
            data = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
            rows = []
            def walk(node):
                if isinstance(node, dict):
                    if node.get('operation_id') == op:
                        rows.append(node)
                    for value in node.values():
                        walk(value)
                elif isinstance(node, list):
                    for value in node:
                        walk(value)
            walk(data)
            assert rows, f'{op} missing from reconciliation'
            row = rows[0]
            assert row.get('migration_state') == 'ADAPTED', row
            assert row.get('reconciliation', {}).get('source_sha') == sha, row
            PY

            git fetch origin "${COMPOSITION_BRANCH}"
            END_BASE_SHA="$(git rev-parse "origin/${COMPOSITION_BRANCH}")"
            if [[ "${END_BASE_SHA}" != "${BASE_SHA}" ]]; then
              echo "composition moved during materialization: ${BASE_SHA} -> ${END_BASE_SHA}; retrying"
              continue
            fi

            git rm "${HELPER_PATH}"
            git add               variants/laravel-aiwmweb/backend/resources/js/app.tsx               variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json               variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json               variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md               variants/laravel-aiwmweb/docs/closure-evidence/content-hub-site-links-terminality.json

            git commit -m "merge: sync #772 closure with latest Laravel composition"
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "merge-sync committed against stable base ${BASE_SHA}"
            exit 0
          done

          echo "composition moved during all merge-sync attempts; refusing stale integration"
          exit 1
        env:
          SOURCE_SHA: aba6003ed1ea50b25b99b50b06488f240d31a132
          BASE_SHA: ''

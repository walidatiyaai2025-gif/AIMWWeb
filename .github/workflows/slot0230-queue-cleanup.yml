name: Slot0230 Clear Superseded Enqueue Queue

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227
    paths:
      - '.github/workflows/slot0230-queue-cleanup.yml'

permissions:
  actions: write
  contents: write

jobs:
  clear-and-self-clean:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227
          fetch-depth: 0

      - name: Cancel superseded queued runs on this branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          KEEP_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          keep_sha = os.environ['KEEP_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'slot0230-queue-cleanup',
          }
          url = f"https://api.github.com/repos/{repo}/actions/runs?branch={urllib.parse.quote(branch)}&status=queued&per_page=100"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          cancelled = []
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') == keep_sha:
                  continue
              run_id = int(run['id'])
              cancel_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
              cancel_req = urllib.request.Request(cancel_url, method='POST', headers=headers, data=b'')
              try:
                  with urllib.request.urlopen(cancel_req) as response:
                      response.read()
                  cancelled.append(run_id)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise
          print('Cancelled superseded queued runs:', cancelled)
          PY

      - name: Remove helper and push cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/slot0230-queue-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/slot0230-queue-cleanup.yml
          git commit -m 'ci(laravel): remove Slot0230 queue helper'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AUTO-070652AEB0-slot0227

      - name: Cancel newly superseded queued runs from helper head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          export KEEP_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          keep_sha = os.environ['KEEP_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'slot0230-queue-cleanup',
          }
          url = f"https://api.github.com/repos/{repo}/actions/runs?branch={urllib.parse.quote(branch)}&status=queued&per_page=100"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          cancelled = []
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') == keep_sha:
                  continue
              run_id = int(run['id'])
              cancel_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
              cancel_req = urllib.request.Request(cancel_url, method='POST', headers=headers, data=b'')
              try:
                  with urllib.request.urlopen(cancel_req) as response:
                      response.read()
                  cancelled.append(run_id)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise
          print('Cancelled helper-head queued runs:', cancelled)
          PY

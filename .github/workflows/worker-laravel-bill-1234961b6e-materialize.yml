name: Worker Laravel Settings Language Toggle Materialize

on:
  push:
    branches:
      - worker/laravel-bill-1234961b6e-settings-language-toggle

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[parity-materialized]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - name: Focused frontend validation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          set -euo pipefail
          npm ci
          npx vitest run --config vitest.config.ts resources/js/__tests__/settings-language-toggle-control.test.tsx resources/js/__tests__/settings-ai-providers-link-control.test.tsx
          npm run typecheck
      - name: Capture authoritative pre-materialization state
        run: cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/reconciliation-before.json
      - name: Point focused evidence at exact pushed implementation head
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          payload['focused_closure_evidence_source_sha'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Materialize official reconciliation
        run: |
          set -euo pipefail
          out=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          summary=/tmp/operation-parity-summary.json
          md=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          git diff --check
      - name: Guard exactly one canonical transition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/reconciliation-before.json').read_text())
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          bid = {r['operation_id']: r for r in before['operations']}
          aid = {r['operation_id']: r for r in after['operations']}
          assert len(bid) == len(aid) == 931
          changes = []
          for op_id in sorted(bid):
              if bid[op_id]['migration_state'] != aid[op_id]['migration_state']:
                  changes.append((op_id, bid[op_id]['migration_state'], aid[op_id]['migration_state']))
          assert changes == [('AIMW-BILL-1234961B6E', 'PENDING', 'ADAPTED')], changes
          states = [r['migration_state'] for r in after['operations']]
          terminal = sum(s in {'PORTED','ADAPTED','VERIFIED_UNAVAILABLE_EXTERNAL'} for s in states)
          pending = states.count('PENDING')
          blocked = states.count('BLOCKED')
          assert terminal == 601, terminal
          assert pending == 330, pending
          assert blocked == 0, blocked
          print('exact transition guard PASS: TOTAL 931 / TERMINAL 601 / PENDING 330 / BLOCKED 0')
          PY
      - name: Commit exact generated artifacts and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/worker-laravel-bill-1234961b6e-materialize.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(laravel): materialize settings language toggle parity [parity-materialized]'
          git push origin HEAD:worker/laravel-bill-1234961b6e-settings-language-toggle

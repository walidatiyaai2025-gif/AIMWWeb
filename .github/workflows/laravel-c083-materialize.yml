name: Laravel C083 Parity Materializer

on:
  push:
    branches:
      - worker/laravel-comm-c083d47bc4-manage-site

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PREVIOUS_SHA: af561dc541128e562de21486fd0be713f9632d64
      EVIDENCE_SHA: 83af462fad7228c404deab6f1dbe001322f79554
      OPERATION_ID: AIMW-COMM-C083D47BC4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-comm-c083d47bc4-manage-site
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact pushed evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: Pin exact reconciliation and focused evidence authorities
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          payload['previous_reconciliation_sha'] = os.environ['PREVIOUS_SHA']
          payload['focused_closure_evidence_source_sha'] = os.environ['EVIDENCE_SHA']
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Run official six-step reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
      - name: Prove exactly one canonical transition
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          rel = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          previous = json.loads(subprocess.check_output(['git', 'show', f"{os.environ['PREVIOUS_SHA']}:{rel}"], text=True))
          current = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          before = {row['operation_id']: row['migration_state'] for row in previous['operations']}
          after = {row['operation_id']: row['migration_state'] for row in current['operations']}
          assert set(before) == set(after) and len(after) == 931
          changed = [op for op in after if before[op] != after[op]]
          assert changed == [os.environ['OPERATION_ID']], changed
          op = os.environ['OPERATION_ID']
          assert before[op] == 'PENDING', (op, before[op])
          assert after[op] == 'ADAPTED', (op, after[op])
          totals = current['totals']
          assert totals['total'] == 931
          assert totals['terminal'] == 591
          assert totals['pending'] == 340
          assert totals['blocked'] == 0
          assert current['domains']['comments']['terminal'] == 6
          assert current['domains']['comments']['pending'] == 2
          assert current['visible_controls']['terminal'] == 139
          assert current['visible_controls']['pending'] == 307
          print('EXACTLY_ONE_TRANSITION=PASS', op)
          print('TOTAL=931 TERMINAL=591 PENDING=340 BLOCKED=0')
          PY
      - name: Materialize official generated artifacts and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm -f .github/workflows/laravel-c083-materialize.yml .github/workflows/laravel-c083-focused.yml
          git add -A \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            .github/workflows/laravel-c083-materialize.yml \
            .github/workflows/laravel-c083-focused.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: materialize C083 official parity reconciliation'
          git push origin HEAD:worker/laravel-comm-c083d47bc4-manage-site

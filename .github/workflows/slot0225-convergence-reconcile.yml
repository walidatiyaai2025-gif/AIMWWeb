name: Slot0225 Convergence Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-97A9F6A324-slot0225

permissions:
  contents: write

concurrency:
  group: slot0225-convergence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AUTO-97A9F6A324-slot0225
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate canonical reconciliation
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Assert exact one-operation Slot0225 delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          assert data['totals']['total'] == 931, data['totals']
          assert data['totals']['terminal'] == 520, data['totals']
          assert data['totals']['pending'] == 411, data['totals']
          assert data['totals']['blocked'] == 0, data['totals']
          row = next(r for r in data['operations'] if r['operation_id'] == 'AIMW-AUTO-97A9F6A324')
          assert row['migration_state'] == 'ADAPTED', row
          print('SLOT0225_GENERATOR_DELTA=PASS')
          PY

      - name: Commit generated artifacts and remove temporary workflow
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          rm .github/workflows/slot0225-convergence-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  .github/workflows/slot0225-convergence-reconcile.yml
          if git diff --cached --quiet; then
            echo 'No generated reconciliation delta to commit.'
            exit 1
          fi
          git commit -m 'chore(laravel): reconcile Slot0225 parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AUTO-97A9F6A324-slot0225

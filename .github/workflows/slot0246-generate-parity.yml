name: Slot0246 Generate Parity

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-DBF5562324-slot0246
    paths:
      - '.github/workflows/slot0246-generate-parity.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate canonical parity artifacts
        shell: bash
        run: |
          set -euo pipefail
          out='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931

      - name: Commit generated artifacts verbatim
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Canonical parity artifacts already match the generator.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'docs(laravel): regenerate Cancel parity reconciliation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

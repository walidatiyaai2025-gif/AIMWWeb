name: Slot0182 Reconcile Commit

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-BC89B13AF8-slot0182

permissions:
  contents: write

jobs:
  reconcile-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[slot0182-generated]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AI-BC89B13AF8-slot0182
          fetch-depth: 0

      - name: Fetch evidence and authoritative composition refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize focused evidence manifest and assert one-line semantic delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          expected = '7a61804b523ebe7cb300d4de5235b1e705ec6093'
          assert payload['focused_closure_evidence_source_sha'] == expected
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY

          manifest='variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
          numstat="$(git diff --numstat origin/worker/laravel-aiwmweb-closure-composition -- "$manifest")"
          printf 'manifest numstat: %s\n' "$numstat"
          test "$numstat" = $'1\t1\tvariants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'

      - name: Rebuild canonical reconciliation using repository generator
        shell: bash
        run: |
          set -euo pipefail
          json='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output "$json" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input "$json" \
            --output "$json" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input "$json" \
            --output "$json" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input "$json" \
            --output "$json" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input "$json" \
            --output "$json" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931

      - name: Verify exact recovered operation and generated totals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          totals = payload['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 510, totals
          assert totals['pending'] == 421, totals
          assert totals['blocked'] == 0, totals

          row = next(r for r in payload['operations'] if r['operation_id'] == 'AIMW-AI-BC89B13AF8')
          assert row['migration_state'] == 'ADAPTED', row
          assert row['reconciliation']['source_sha'] == '7a61804b523ebe7cb300d4de5235b1e705ec6093', row
          assert row['acceptance_test'] == 'variants/laravel-aiwmweb/backend/tests/Feature/SiteOperationDetailsRouteTerminalityTest.php', row
          PY
          git diff --check

      - name: Commit generator-owned reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'chore(laravel): reconcile site-operation back parity [slot0182-generated]'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-BC89B13AF8-slot0182

name: Generate Automation phase closure evidence

on:
  push:
    branches:
      - worker/laravel-aiwmweb-automation-phase-closure
    paths:
      - '.github/workflows/automation-phase-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate exact per-operation evidence contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('variants/laravel-aiwmweb/docs/closure-evidence')
          root.mkdir(parents=True, exist_ok=True)

          visible = {
              'AIMW-AUTO-3C8B141746': 'automation-new-job',
              'AIMW-AUTO-647F50CC73': 'automation-refresh',
              'AIMW-AUTO-E4269EADC3': 'automation-schedules-refresh',
              'AIMW-AUTO-7C13E2AA0B': 'automation-schedules-connect-site',
              'AIMW-AUTO-6EB9542C7A': 'automation-schedules-cancel-edit',
              'AIMW-AUTO-B2CDFF403F': 'execution-center-sync-site',
              'AIMW-AUTO-C11296372B': 'global-pages-execution-link',
              'AIMW-AUTO-66466C8C7F': 'home-execution-link',
              'AIMW-AUTO-C4A8DCCFEF': 'reports-export-automation',
          }
          services = {
              'AIMW-AUTO-FE8B6EAC62': ('bulk-status-execution-service', 'src/AIWordPressManager.Web/Services/BulkStatusExecutionService.cs', 'BulkStatusExecutionService', 'RunAsync', 'variants/laravel-aiwmweb/backend/app/Automation/BulkStatusExecutionService.php'),
              'AIMW-AUTO-2B8A1146F8': ('bulk-trash-execution-service', 'src/AIWordPressManager.Web/Services/BulkTrashExecutionService.cs', 'BulkTrashExecutionService', 'RunAsync', 'variants/laravel-aiwmweb/backend/app/Automation/BulkTrashExecutionService.php'),
              'AIMW-AUTO-FF4812A204': ('execution-center-pause-service', 'src/AIWordPressManager.Web/Services/ExecutionCenterService.cs', 'ExecutionCenterService', 'Pause', 'variants/laravel-aiwmweb/backend/app/Automation/ExecutionCenterService.php'),
              'AIMW-AUTO-E57D5E6134': ('execution-center-resume-service', 'src/AIWordPressManager.Web/Services/ExecutionCenterService.cs', 'ExecutionCenterService', 'Resume', 'variants/laravel-aiwmweb/backend/app/Automation/ExecutionCenterService.php'),
              'AIMW-AUTO-730076001E': ('execution-center-user-pause-service', 'src/AIWordPressManager.Web/Services/ExecutionCenterUserCommandService.cs', 'ExecutionCenterUserCommandService', 'Pause', 'variants/laravel-aiwmweb/backend/app/Automation/ExecutionCenterUserCommandService.php'),
              'AIMW-AUTO-4C1DD607BB': ('execution-center-user-resume-service', 'src/AIWordPressManager.Web/Services/ExecutionCenterUserCommandService.cs', 'ExecutionCenterUserCommandService', 'Resume', 'variants/laravel-aiwmweb/backend/app/Automation/ExecutionCenterUserCommandService.php'),
          }
          background = {
              'AIMW-AUTO-AFDB35513B': ('job-cancellation-registry', 'IJobCancellationRegistry'),
              'AIMW-AUTO-50F3EC7087': ('execution-job-store', 'IExecutionJobStore'),
              'AIMW-AUTO-CA7398A8F6': ('execution-job-list-item', 'ExecutionJobListItem'),
          }
          target_ids = set(visible) | set(services) | set(background)
          assert len(target_ids) == 18

          # Refuse duplicate evidence ownership before creating anything.
          for path in root.glob('*.json'):
              try:
                  doc = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              text = json.dumps(doc)
              hits = sorted(op for op in target_ids if op in text)
              if hits:
                  raise SystemExit(f'existing closure evidence already owns target operation(s) {hits}: {path}')

          common = {
              'schema_version': 1,
              'authority': 'AIMWWeb Issue #257',
              'target_variant': 'LARAVEL_AIWMWEB',
          }
          for op, slug in visible.items():
              doc = {
                  **common,
                  'operation': {
                      'operation_id': op,
                      'domain': 'automation',
                      'kind': 'visible_control',
                      'terminal_state': 'ADAPTED',
                      'tenant_owned': True,
                  },
                  'acceptance': {
                      'production_marker': 'variants/laravel-aiwmweb/backend/resources/js/automation-phase-controls.tsx',
                      'focused_test': 'variants/laravel-aiwmweb/backend/tests/Feature/AutomationPhaseVisibleControlsTerminalityTest.php',
                      'proofs': ['exact operation identity', 'tenant-derived navigation/action binding', 'foreign-tenant fail-closed assertion'],
                  },
                  'scope': {'generated_reconciliation_modified': False, 'fake_success': False},
              }
              (root / f'{slug}-terminality.json').write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')

          service_test = 'variants/laravel-aiwmweb/backend/tests/Feature/AutomationPhaseServiceTerminalityTest.php'
          for op, (slug, source, service, member, destination) in services.items():
              doc = {
                  **common,
                  'operation_id': op,
                  'terminal_state': 'ADAPTED',
                  'canonical_operation': {
                      'domain': 'automation',
                      'kind': 'service',
                      'source': source,
                      'service': service,
                      'member': member,
                  },
                  'service_closure_contract': {
                      'implementation_sha': '__SOURCE_SHA__',
                      'destination_path': destination,
                      'acceptance_test': service_test,
                  },
                  'security': {'tenant_isolation': 'focused cross-tenant ModelNotFound proof', 'fake_success': False},
              }
              (root / f'{slug}-terminality.json').write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')

          background_test = 'variants/laravel-aiwmweb/backend/tests/Feature/AutomationPhaseBackgroundContractsTest.php'
          destination = 'variants/laravel-aiwmweb/backend/app/Jobs/AutomationBackgroundContracts.php'
          for op, (slug, identity) in background.items():
              doc = {
                  **common,
                  'evidence_mode': 'focused_background_job_contract',
                  'operation_id': op,
                  'domain': 'automation',
                  'terminal_state': 'ADAPTED',
                  'source_sha': '__SOURCE_SHA__',
                  'canonical_identity': identity,
                  'laravel': {'destination': destination, 'acceptance_test': background_test},
                  'security': {'tenant_isolation': 'focused tenant A/B partition proof', 'stale_identity': 'registration-id stale safety proof'},
              }
              (root / f'{slug}-terminality.json').write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')

          created = []
          for path in root.glob('*.json'):
              text = path.read_text(encoding='utf-8')
              if any(op in text for op in target_ids):
                  created.append(path)
          if len(created) != 18:
              raise SystemExit(f'expected exactly 18 target evidence files, found {len(created)}')
          print('AUTOMATION_EVIDENCE_FILES=18')
          PY
      - name: Commit evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-phase-evidence.yml
          git add variants/laravel-aiwmweb/docs/closure-evidence
          git diff --cached --check
          git commit -m 'docs(laravel): add final Automation phase evidence contracts'
          git pull --rebase origin worker/laravel-aiwmweb-automation-phase-closure
          git push origin HEAD:worker/laravel-aiwmweb-automation-phase-closure

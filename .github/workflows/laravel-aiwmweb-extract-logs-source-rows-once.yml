name: Laravel AIWMWeb Extract Logs Source Rows Once

on:
  pull_request:
    paths:
      - '.github/workflows/laravel-aiwmweb-extract-logs-source-rows-once.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract canonical rows for LogsAndErrors source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source_path = 'src/AIWordPressManager.Web/Components/Pages/LogsAndErrors.razor'
          p = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          rows = [row for row in payload.get('operations', []) if row.get('current_source') == source_path]
          if not rows:
              raise SystemExit('no LogsAndErrors canonical rows found')
          out = Path('variants/laravel-aiwmweb/docs/diagnostics/LogsAndErrors.rows.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(rows, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/laravel-aiwmweb-extract-logs-source-rows-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/diagnostics/LogsAndErrors.rows.json
          git commit -m 'chore(laravel): extract LogsAndErrors canonical rows'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

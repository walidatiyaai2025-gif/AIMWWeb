name: Slot31 Generator Reconciliation

on:
  push:
    branches:
      - worker/laravel-AIMW-CONT-8B3518EF80-error-open-logs

permissions:
  contents: write

jobs:
  reconcile-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      SOURCE_SHA: '8fd472342e77d444d0932ea26617858d2832ef43'
      PREVIOUS_RECONCILIATION_SHA: '03eec4559a16904783f1e1fe1ad085c1437c7719'
      OPERATION_ID: 'AIMW-CONT-8B3518EF80'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-AIMW-CONT-8B3518EF80-error-open-logs
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register exact focused closure source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          text = path.read_text()
          data = json.loads(text)
          old_previous = f'"previous_reconciliation_sha": "{data["previous_reconciliation_sha"]}"'
          new_previous = f'"previous_reconciliation_sha": "{os.environ["PREVIOUS_RECONCILIATION_SHA"]}"'
          text = text.replace(old_previous, new_previous, 1)
          old_focused = f'"focused_closure_evidence_source_sha": "{data["focused_closure_evidence_source_sha"]}"'
          new_focused = f'"focused_closure_evidence_source_sha": "{os.environ["SOURCE_SHA"]}"'
          text = text.replace(old_focused, new_focused, 1)
          parsed = json.loads(text)
          assert parsed['previous_reconciliation_sha'] == os.environ['PREVIOUS_RECONCILIATION_SHA']
          assert parsed['focused_closure_evidence_source_sha'] == os.environ['SOURCE_SHA']
          path.write_text(text)
          PY
      - name: Run canonical generator pipeline
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
      - name: Verify exactly one semantic parity delta
        shell: bash
        run: |
          set -euo pipefail
          git show "$PREVIOUS_RECONCILIATION_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          old = json.loads(Path('/tmp/previous.json').read_text())
          new = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          totals = new['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 469, totals
          assert totals['pending'] == 462, totals
          assert totals['blocked'] == 0, totals
          old_map = {x['operation_id']: x['migration_state'] for x in old['operations']}
          new_map = {x['operation_id']: x['migration_state'] for x in new['operations']}
          changed = [(k, old_map[k], new_map[k]) for k in old_map if old_map[k] != new_map[k]]
          assert changed == [(os.environ['OPERATION_ID'], 'PENDING', 'ADAPTED')], changed
          row = next(x for x in new['operations'] if x['operation_id'] == os.environ['OPERATION_ID'])
          assert row['reconciliation']['evidence_mode'] == 'focused_closure_contract', row['reconciliation']
          assert row['reconciliation']['source_sha'] == os.environ['SOURCE_SHA'], row['reconciliation']
          print(changed)
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha "$PREVIOUS_RECONCILIATION_SHA"
      - name: Remove temporary runner and commit generated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/slot31-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'Reconcile AIMW-CONT-8B3518EF80 after recovery'
          git push origin HEAD:worker/laravel-AIMW-CONT-8B3518EF80-error-open-logs

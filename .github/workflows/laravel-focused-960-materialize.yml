name: Laravel focused parity generation issue 960

on:
  push:
    branches:
      - worker/960-global-users-previous
    paths:
      - '.github/workflows/laravel-focused-960-materialize.yml'
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch exact evidence and composition refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild through official canonical generator chain
        shell: bash
        run: |
          set -euo pipefail
          tool=variants/laravel-aiwmweb/tools
          python "$tool/finalize_operation_parity.py" --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          for stage in apply_tenant_neutral_route_evidence apply_platform_admin_route_evidence apply_explicit_route_api_provenance apply_focused_closure_evidence apply_focused_service_evidence apply_focused_background_job_evidence; do
            python "$tool/${stage}.py" --input /tmp/parity.json --output /tmp/parity.json --summary-output /tmp/parity-summary.json --markdown-output /tmp/parity.md --check-total 931
          done
          python - <<'PY'
          import json
          data=json.load(open('/tmp/parity.json'))
          rows={r['operation_id']:r for r in data['operations']}
          row=rows['AIMW-SYNC-E0791EA9E9']
          assert row['migration_state']=='ADAPTED', row
          assert data['totals']['total']==931, data['totals']
          assert data['validation']['passed'], data['validation']
          print('CANONICAL_MATERIALIZER_PASS',row['operation_id'],row['migration_state'],data['totals'])
          PY
          cp /tmp/parity.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/parity.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --stat -- variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Commit only official generated reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo "Generator outputs already current"
          else
            git commit -m "chore(laravel #960): materialize canonical previous-page reconciliation"
            git push origin HEAD:refs/heads/worker/960-global-users-previous
          fi

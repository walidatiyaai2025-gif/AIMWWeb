name: Laravel AIWMWeb PR395 Generated Reconciliation Repair

on:
  push:
    branches:
      - worker/laravel-AIMW-AI-3CDB30A4C2-site-operation-details

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register exact recovered evidence and refresh focused acceptance metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          operation_id = 'AIMW-AI-3CDB30A4C2'
          source_sha = 'aa328fe4daabf8e5042abe568e10e7719a9d3ad4'
          previous_sha = 'c36f4944e8e511704a580874d09a398ac069820e'
          manifest_path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['previous_reconciliation_sha'] = previous_sha
          source = {
              'label': 'AIMW-AI-3CDB30A4C2 site operation details route closure',
              'sha': source_sha,
              'observed_pr_head': source_sha,
              'domains': ['ai'],
              'supporting_only': True,
              'operation_evidence': {
                  operation_id: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/SiteOperationDetailsRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/SiteOperationDetailsReadController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SiteOperationDetailsRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/site-operation-details-route-terminality.json',
                  }
              },
          }
          def owns(entry):
              return (
                  entry.get('label') == source['label']
                  or operation_id in (entry.get('operation_evidence') or {})
                  or operation_id in (entry.get('operation_ids') or [])
              )
          manifest['countable_sources'] = [x for x in manifest['countable_sources'] if not owns(x)] + [source]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          evidence_path = Path('variants/laravel-aiwmweb/docs/closure-evidence/site-operation-details-route-terminality.json')
          evidence = json.loads(evidence_path.read_text())
          evidence['implementation_snapshot_sha'] = source_sha
          evidence['exact_tested_sha'] = source_sha
          evidence['exact_tested_sha_ci'] = {
              'pr_plan_link': {'run_id': 33982887279, 'result': 'success'},
              'laravel_aiwmweb_cross_domain_security': {'run_id': 33982887247, 'result': 'success'},
              'laravel_aiwmweb_acceptance': {'run_id': 33982887333, 'result': 'success'},
              'sqlite_full_php_suite': 'success',
              'mysql_fresh_rollback_forward_and_full_php_suite': 'success',
              'redis_queue_scheduler': 'success',
              'wordpress_disposable_runtime': 'success',
              'wordpress_real_rest_e2e': 'success',
              'frontend_typecheck_tests_build': 'success',
              'frontend_production_build': 'success',
              'runtime_artifacts': 'success',
              'acceptance_gate': 'success',
              'production_compose_runtime': 'success',
          }
          evidence['canonical_denominator'] = {
              'source': f'authoritative closure composition {previous_sha}',
              'total': 931,
              'current_terminal': 471,
              'current_pending': 460,
              'current_blocked': 0,
              'candidate_terminal_after_authorized_integration_and_regeneration': 472,
              'candidate_pending_after_authorized_integration_and_regeneration': 459,
              'generated_reconciliation_modified': False,
              'note': 'Candidate delta is exactly one operation and is materialized only by the repository generator in this recovery wave.',
          }
          evidence['terminality']['evidence_bearing_head_ci'] = f'recovered exact head {source_sha} passed Plan Link, Cross-Domain Security, and full Laravel AIWMWeb Acceptance before generator reconciliation'
          evidence_path.write_text(json.dumps(evidence, indent=2) + '\n')

          test_path = Path('variants/laravel-aiwmweb/backend/tests/Feature/SiteOperationDetailsRouteTerminalityTest.php')
          text = test_path.read_text()
          text = text.replace(
              'test_exact_canonical_operation_is_the_pending_guid_site_operation_details_route',
              'test_exact_canonical_operation_is_the_adapted_guid_site_operation_details_route',
          )
          text = text.replace(
              "$this->assertSame('PENDING', $operation['migration_state']);",
              "$this->assertSame('ADAPTED', $operation['migration_state']);",
          )
          test_path.write_text(text)
          PY

      - name: Regenerate canonical operation parity with repository tooling
        shell: bash
        run: |
          set -euo pipefail
          out='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input "$out" \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input "$out" \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931

      - name: Prove exact one-operation delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          operation_id = 'AIMW-AI-3CDB30A4C2'
          previous_sha = 'c36f4944e8e511704a580874d09a398ac069820e'
          current = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          previous = json.loads(subprocess.check_output([
              'git', 'show', previous_sha + ':variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          ], text=True))
          totals = current['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 472, totals
          assert totals['pending'] == 459, totals
          assert totals['blocked'] == 0, totals
          current_rows = {x['operation_id']: x for x in current['operations']}
          previous_rows = {x['operation_id']: x for x in previous['operations']}
          changed = sorted(
              op_id for op_id, row in current_rows.items()
              if row['migration_state'] != previous_rows[op_id]['migration_state']
          )
          assert changed == [operation_id], changed
          assert previous_rows[operation_id]['migration_state'] == 'PENDING'
          assert current_rows[operation_id]['migration_state'] == 'ADAPTED'
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha c36f4944e8e511704a580874d09a398ac069820e

      - name: Commit generator-backed reconciliation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr395-generated-reconciliation-repair.yml
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            variants/laravel-aiwmweb/docs/closure-evidence/site-operation-details-route-terminality.json \
            variants/laravel-aiwmweb/backend/tests/Feature/SiteOperationDetailsRouteTerminalityTest.php
          git diff --cached --check
          git commit -m 'chore(laravel): reconcile AIMW-AI-3CDB30A4C2 parity'
          git push origin HEAD:worker/laravel-AIMW-AI-3CDB30A4C2-site-operation-details

name: Laravel AIWMWeb E36C3E1427 Materialize

on:
  push:
    branches:
      - worker/laravel-bill-e36c3e1427-remove-credential
    paths:
      - '.github/workflows/laravel-aiwmweb-e36c3e1427-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_SHA: 'ded56b10b202256dc544036d93893400251b5552'
      EVIDENCE_SHA: '03f5547aa261081bdc535103fcbcb3be88fdb288'
      OPERATION_ID: 'AIMW-BILL-E36C3E1427'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact refs and prove base lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/worker/laravel-aiwmweb-closure-composition)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git cat-file -e "$EVIDENCE_SHA^{commit}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Point generator inputs at exact current base and immutable credential evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = os.environ['BASE_SHA']
          data['focused_closure_evidence_source_sha'] = os.environ['EVIDENCE_SHA']
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run official six-stage reconciliation generator
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Prove exactly one generator-backed transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          terminal = {'PORTED', 'ADAPTED', 'VERIFIED_UNAVAILABLE_EXTERNAL'}
          old = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          new = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          old_by_id = {row['operation_id']: row for row in old['operations']}
          new_by_id = {row['operation_id']: row for row in new['operations']}
          assert old_by_id.keys() == new_by_id.keys(), 'operation universe changed'
          changes = sorted(
              (op_id, old_by_id[op_id]['migration_state'], new_by_id[op_id]['migration_state'])
              for op_id in old_by_id
              if old_by_id[op_id]['migration_state'] != new_by_id[op_id]['migration_state']
          )
          expected = [(os.environ['OPERATION_ID'], 'PENDING', 'ADAPTED')]
          assert changes == expected, f'unexpected reconciliation changes: {changes}'
          assert len(old['operations']) == 931 == len(new['operations'])
          old_terminal = sum(row['migration_state'] in terminal for row in old['operations'])
          new_terminal = sum(row['migration_state'] in terminal for row in new['operations'])
          old_pending = sum(row['migration_state'] == 'PENDING' for row in old['operations'])
          new_pending = sum(row['migration_state'] == 'PENDING' for row in new['operations'])
          old_blocked = sum(row['migration_state'] == 'BLOCKED' for row in old['operations'])
          new_blocked = sum(row['migration_state'] == 'BLOCKED' for row in new['operations'])
          assert (old_terminal, old_pending, old_blocked) == (577, 354, 0)
          assert (new_terminal, new_pending, new_blocked) == (578, 353, 0)
          print(f'ISOLATED_TRANSITION={changes[0][0]}:{changes[0][1]}->{changes[0][2]}')
          print('COUNTS=931/578/353/0')
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$BASE_SHA"

      - name: Stage generator-owned artifacts for focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run focused Laravel security acceptance on generated terminal state
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$PWD/database/database.sqlite"
          : > "$DB_DATABASE"
          php artisan migrate:fresh --force
          php artisan test --filter SiteSettingsRemoveCredentialTerminalityTest

      - name: Commit generator-owned artifacts and self-delete materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/laravel-aiwmweb-e36c3e1427-materialize.yml
          git diff --cached --check
          git commit -m 'docs(laravel-aiwmweb): materialize E36C3E1427 reconciliation'
          git push origin HEAD:worker/laravel-bill-e36c3e1427-remove-credential

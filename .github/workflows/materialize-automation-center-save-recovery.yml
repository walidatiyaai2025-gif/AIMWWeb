name: Materialize Automation Center Save recovery parity

on:
  push:
    branches:
      - worker/laravel-bill-bc1c75ce0d-recovery-final
    paths:
      - 'variants/laravel-aiwmweb/docs/closure-evidence/automation-center-save-terminality.json'
      - '.github/workflows/materialize-automation-center-save-recovery.yml'

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-bill-bc1c75ce0d-recovery-final
      - name: Fetch exact refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin pushed evidence source and previous authority
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text())
          data['previous_reconciliation_sha'] = '52585af0bc9da8d0b9680893419d923a33ebad35'
          data['focused_closure_evidence_source_sha'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Run official reconciliation generator chain
        shell: bash
        run: |
          set -euo pipefail
          OUT='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          MD='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          SUM='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py --current "$OUT" --previous-sha 52585af0bc9da8d0b9680893419d923a33ebad35
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          current = json.loads(out.read_text())
          previous = json.loads(subprocess.check_output(['git','show','52585af0bc9da8d0b9680893419d923a33ebad35:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'], text=True))
          target = 'AIMW-BILL-BC1C75CE0D'
          old = {x['operation_id']: x['migration_state'] for x in previous['operations']}
          new = {x['operation_id']: x['migration_state'] for x in current['operations']}
          changed = sorted(k for k in old if old[k] != new[k])
          assert changed == [target], changed
          assert old[target] == 'PENDING', old[target]
          assert new[target] == 'ADAPTED', new[target]
          totals = current['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 602, totals
          assert totals['pending'] == 329, totals
          assert totals['blocked'] == 0, totals
          print(json.dumps({'changed': changed, 'totals': totals}, indent=2))
          PY
      - name: Commit generated reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-automation-center-save-recovery.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'Materialize recovered AIMW-BILL-BC1C75CE0D parity reconciliation'
          git push origin HEAD:worker/laravel-bill-bc1c75ce0d-recovery-final

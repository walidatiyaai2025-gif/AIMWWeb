name: Laravel AIWMWeb Parity Reconciliation

on:
  pull_request:
    paths:
      - 'variants/laravel-aiwmweb/tools/reconcile_operation_parity.py'
      - 'variants/laravel-aiwmweb/tools/finalize_operation_parity.py'
      - 'variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py'
      - 'variants/laravel-aiwmweb/tools/operation_parity_delta.py'
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
      - 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
      - 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
      - 'variants/laravel-aiwmweb/docs/closure-evidence/composed-closure-rehearsal.json'
      - '.github/workflows/laravel-aiwmweb-parity-reconciliation.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin temporary approvals reconciliation to exact live composition
        if: github.event.pull_request.head.ref == 'manager/laravel-aiwmweb-approvals-route-evidence-reconcile'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_sha = 'e4762b35f077944d7dd1ded8691219c5f06ddcb5'
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['focused_closure_evidence_source_sha'] = source_sha
          for source in manifest.get('countable_sources', []):
              source['label'] = 'Live Laravel closure composition after MainLayout controls closure'
              source['sha'] = source_sha
              source['observed_pr_head'] = source_sha
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Rebuild and validate operation-level reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Write back temporary approvals reconciliation artifacts
        if: github.event.pull_request.head.ref == 'manager/laravel-aiwmweb-approvals-route-evidence-reconcile'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(laravel): refresh approvals reconciliation artifacts'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify committed reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/operation-parity-reconciliation.json
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md /tmp/operation-parity-reconciliation.md

      - name: Compare with previous canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json').read_text())
          print(manifest['previous_reconciliation_sha'])
          PY
          )"
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$previous_sha"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-aiwmweb-operation-parity-reconciliation
          path: |
            /tmp/operation-parity-reconciliation.json
            /tmp/operation-parity-reconciliation.md
            /tmp/operation-parity-summary.json

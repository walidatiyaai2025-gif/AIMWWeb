name: Laravel AIWMWeb Parity Reconciliation

on:
  pull_request:
    paths:
      - 'variants/laravel-aiwmweb/tools/reconcile_operation_parity.py'
      - 'variants/laravel-aiwmweb/tools/finalize_operation_parity.py'
      - 'variants/laravel-aiwmweb/tools/operation_parity_delta.py'
      - 'variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json'
      - 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
      - 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
      - '.github/workflows/laravel-aiwmweb-parity-reconciliation.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and validate operation-level reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Verify committed reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/operation-parity-reconciliation.json
          cmp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md /tmp/operation-parity-reconciliation.md

      - name: Compare with previous canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json').read_text())
          print(manifest['previous_reconciliation_sha'])
          PY
          )"
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$previous_sha"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-aiwmweb-operation-parity-reconciliation
          path: |
            /tmp/operation-parity-reconciliation.json
            /tmp/operation-parity-reconciliation.md
            /tmp/operation-parity-summary.json

      - name: Persist exact refreshed rehearsal reconciliation once
        if: always() && github.event.pull_request.head.ref == 'worker/laravel-aiwmweb-closure-composition'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(parity): refresh composed closure reconciliation'
          git push origin HEAD:${{ github.head_ref }}

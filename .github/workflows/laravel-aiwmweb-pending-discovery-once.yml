name: Laravel AIWMWeb Pending Discovery Once

on:
  push:
    branches:
      - manager/laravel-aiwmweb-pending-discovery-424

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact pending inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          payload = json.loads(src.read_text(encoding='utf-8'))
          rows = [row for row in payload.get('operations', []) if row.get('migration_state') == 'PENDING']
          Path('/tmp/pending-closure-candidates.json').write_text(json.dumps(rows, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          from collections import Counter
          summary = {
              'total': len(rows),
              'by_kind': dict(Counter(str(r.get('kind')) for r in rows)),
              'by_domain': dict(Counter(str(r.get('domain')) for r in rows)),
              'row_keys': sorted({k for r in rows for k in r.keys()}),
          }
          Path('/tmp/pending-closure-summary.json').write_text(json.dumps(summary, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pending-closure-inventory-424-full
          path: |
            /tmp/pending-closure-candidates.json
            /tmp/pending-closure-summary.json
            variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json

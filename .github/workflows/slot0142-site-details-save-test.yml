name: Slot 0142 Site Details Save Test Parity

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-387F3E5D5F-site-details-save-test-slot0142

permissions:
  contents: write

jobs:
  reconcile-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 659240c3a0b45fa652d180dfc64de6025016a18e
      SOURCE_SHA: 9466016d7e038b3d65047786ed485b446b8e4cd6
      OPERATION_ID: AIMW-AI-387F3E5D5F
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: npm ci

      - name: Focused Pint gate
        working-directory: variants/laravel-aiwmweb/backend
        run: vendor/bin/pint --test tests/Feature/SiteDetailsSaveTestControlTerminalityTest.php

      - name: Focused PHP gate
        working-directory: variants/laravel-aiwmweb/backend
        run: php artisan test --filter=SiteDetailsSaveTestControlTerminalityTest

      - name: Focused frontend gate
        working-directory: variants/laravel-aiwmweb/backend
        run: npm test -- --run resources/js/__tests__/site-details-save-test-control.test.tsx

      - name: Frontend typecheck
        working-directory: variants/laravel-aiwmweb/backend
        run: npm run typecheck

      - name: Pin focused closure source to exact pushed evidence SHA
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text())
          payload['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Run canonical five-stage generator
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Guard exactly one canonical transition
        run: |
          git show "$BASE_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/base.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = json.loads(Path('/tmp/base.json').read_text())
          cur = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          b = {r['operation_id']: r for r in base['operations']}
          c = {r['operation_id']: r for r in cur['operations']}
          changed = sorted(k for k in b if b[k]['migration_state'] != c[k]['migration_state'])
          op = os.environ['OPERATION_ID']
          print('STATE_CHANGED_IDS=' + ','.join(changed))
          if changed != [op]:
              raise SystemExit(f'unexpected state transitions: {changed}')
          if b[op]['migration_state'] != 'PENDING' or c[op]['migration_state'] != 'ADAPTED':
              raise SystemExit(f'bad focused transition: {b[op]["migration_state"]} -> {c[op]["migration_state"]}')
          totals = cur['totals']
          if (totals['total'], totals['terminal'], totals['pending'], totals['blocked']) != (931, 494, 437, 0):
              raise SystemExit(f'unexpected totals: {totals}')
          print('ONE_OPERATION_GUARD=PASS')
          print(f"TOTAL={totals['total']} TERMINAL={totals['terminal']} PENDING={totals['pending']} BLOCKED={totals['blocked']}")
          PY

      - name: Commit canonical generated artifacts
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'chore(laravel): reconcile Site Details save-test parity'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-387F3E5D5F-site-details-save-test-slot0142

name: Slot30 Scoped Reconcile

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-4C84DDBEEB-job-failure-gate

permissions:
  contents: write

jobs:
  scoped-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden operation-scoped reconciliation semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          reconcile = Path('variants/laravel-aiwmweb/tools/reconcile_operation_parity.py')
          text = reconcile.read_text()
          text = text.replace(
              'from dataclasses import dataclass\n',
              'from dataclasses import dataclass, field\n',
              1,
          )
          old = '''class Snapshot:\n    label: str\n    sha: str\n    domains: set[str]\n    files: list[FileEvidence]\n    supporting_only: bool = False\n'''
          new = '''class Snapshot:\n    label: str\n    sha: str\n    domains: set[str]\n    files: list[FileEvidence]\n    supporting_only: bool = False\n    operation_ids: set[str] = field(default_factory=set)\n'''
          if old not in text:
              raise SystemExit('Snapshot contract patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''        files=files,\n        supporting_only=bool(source.get("supporting_only", False)),\n    )\n'''
          new = '''        files=files,\n        supporting_only=bool(source.get("supporting_only", False)),\n        operation_ids={str(operation_id) for operation_id in source.get("operation_ids", []) if str(operation_id)},\n    )\n'''
          if old not in text:
              raise SystemExit('Snapshot load patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''    for snap in snapshots:\n        if snap.supporting_only or domain not in snap.domains:\n            continue\n        for file in snap.code:\n'''
          new = '''    operation_id = str(row.get("operation_id") or "")\n    for snap in snapshots:\n        if snap.supporting_only or domain not in snap.domains:\n            continue\n        if snap.operation_ids and operation_id not in snap.operation_ids:\n            continue\n        for file in snap.code:\n'''
          if old not in text:
              raise SystemExit('Scoped-source filter patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''            elif kind == "background_job":\n                if "/Jobs/" in file.path or "job" in Path(file.path).name.lower():\n                    score += 2\n            if best is None or score > best[2]:\n'''
          new = '''            elif kind == "background_job":\n                if "/Jobs/" in file.path or "job" in Path(file.path).name.lower():\n                    score += 2\n                if snap.operation_ids:\n                    job = str(row.get("background_job") or "")\n                    concrete_job = job[1:] if len(job) > 1 and job.startswith("I") and job[1].isupper() else job\n                    if concrete_job and Path(file.path).stem.lower() == concrete_job.lower():\n                        score += 4\n                        reasons.append(f"scoped-job:{concrete_job}")\n            if best is None or score > best[2]:\n'''
          if old not in text:
              raise SystemExit('Scoped background-job preference patch anchor missing')
          text = text.replace(old, new, 1)
          reconcile.write_text(text)

          finalize = Path('variants/laravel-aiwmweb/tools/finalize_operation_parity.py')
          text = finalize.read_text()
          old = '''                "supporting_only": bool(source.get("supporting_only", False)),\n                "explicit_operation_evidence_ids": sorted((source.get("operation_evidence") or {}).keys()),\n'''
          new = '''                "supporting_only": bool(source.get("supporting_only", False)),\n                "operation_ids": sorted(str(operation_id) for operation_id in source.get("operation_ids", [])),\n                "explicit_operation_evidence_ids": sorted((source.get("operation_evidence") or {}).keys()),\n'''
          if old not in text:
              raise SystemExit('Finalizer source-manifest patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''    if invalid_states:\n        errors.append(f"invalid statuses: {', '.join(invalid_states)}")\n\n    source_presence: dict[str, bool] = {}\n'''
          new = '''    if invalid_states:\n        errors.append(f"invalid statuses: {', '.join(invalid_states)}")\n\n    known_operation_ids = set(operation_ids)\n    scoped_ids = [\n        str(operation_id)\n        for source in manifest["countable_sources"]\n        for operation_id in source.get("operation_ids", [])\n        if str(operation_id)\n    ]\n    unknown_scoped_ids = sorted(set(scoped_ids) - known_operation_ids)\n    duplicate_scoped_ids = sorted(\n        operation_id for operation_id, count in Counter(scoped_ids).items() if count > 1\n    )\n    if unknown_scoped_ids:\n        errors.append("operation-scoped evidence references unknown IDs: " + ", ".join(unknown_scoped_ids))\n    if duplicate_scoped_ids:\n        errors.append("operation-scoped evidence duplicates ownership: " + ", ".join(duplicate_scoped_ids))\n\n    source_presence: dict[str, bool] = {}\n'''
          if old not in text:
              raise SystemExit('Finalizer scoped validation patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''        "invalid_statuses": invalid_states,\n        "status_totals_reconcile": state_total == expected,\n'''
          new = '''        "invalid_statuses": invalid_states,\n        "operation_scoped_unknown_ids": unknown_scoped_ids,\n        "operation_scoped_duplicate_ids": duplicate_scoped_ids,\n        "status_totals_reconcile": state_total == expected,\n'''
          if old not in text:
              raise SystemExit('Finalizer validation result patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''    payload["classification_policy"]["blocked_progress_policy"] = "not_counted"\n    payload["classification_policy"]["explicit_route_policy"] = (\n'''
          new = '''    payload["classification_policy"]["blocked_progress_policy"] = "not_counted"\n    payload["classification_policy"]["operation_scoped_source_policy"] = (\n        "a countable source declaring operation_ids may contribute generic evidence only to those canonical IDs; "\n        "the normal code, tenant/security, and test thresholds still apply"\n    )\n    payload["classification_policy"]["explicit_route_policy"] = (\n'''
          if old not in text:
              raise SystemExit('Finalizer classification-policy patch anchor missing')
          text = text.replace(old, new, 1)
          finalize.write_text(text)

          test = Path('variants/laravel-aiwmweb/backend/tests/Unit/JobFailureGateTest.php')
          test_text = test.read_text()
          anchor = 'class JobFailureGateTest extends TestCase\n{\n'
          replacement = 'class JobFailureGateTest extends TestCase\n{\n    // Canonical parity operation: AIMW-AI-4C84DDBEEB\n'
          if anchor not in test_text:
              raise SystemExit('Focused test marker anchor missing')
          test.write_text(test_text.replace(anchor, replacement, 1))

          evidence = Path('variants/laravel-aiwmweb/docs/evidence/AIMW-AI-4C84DDBEEB-job-failure-gate.md')
          evidence_text = evidence.read_text()
          note = '''\n## Slot 0030 recovery hardening\n\nThe recovered Laravel gate reads failure history through `Suggestion::query()` instead of a raw query builder. `Suggestion` inherits the variant's `BelongsToTenant` model contract, so the history lookup is constrained by the mandatory tenant scope in addition to the queue job's tenant context. Canonical operation: `AIMW-AI-4C84DDBEEB`.\n'''
          if '## Slot 0030 recovery hardening' not in evidence_text:
              evidence.write_text(evidence_text.rstrip() + '\n' + note)

          diagnostic = Path('variants/laravel-aiwmweb/docs/evidence/slot30-reconcile-diagnostic.json')
          if diagnostic.exists():
              diagnostic.unlink()
          PY

          git config user.name 'walidatiyaai2025-gif'
          git config user.email 'walidatiyaai2025@gmail.com'
          git add variants/laravel-aiwmweb/tools/reconcile_operation_parity.py \
                  variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
                  variants/laravel-aiwmweb/backend/tests/Unit/JobFailureGateTest.php \
                  variants/laravel-aiwmweb/docs/evidence/AIMW-AI-4C84DDBEEB-job-failure-gate.md
          git add -u variants/laravel-aiwmweb/docs/evidence
          git commit -m 'Harden operation-scoped parity evidence for AIMW-AI-4C84DDBEEB'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-4C84DDBEEB-job-failure-gate
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Register scoped exact-SHA source and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text())
          label = 'AIMW-AI-4C84DDBEEB scoped job failure gate closure'
          source_sha = os.environ['SOURCE_SHA']
          data['previous_reconciliation_sha'] = '5059e73c7b64b1e56f926d589b3f0c9eab11cf5f'
          sources = data['countable_sources']
          sources[:] = [source for source in sources if source.get('label') != label]
          sources.append({
              'label': label,
              'sha': source_sha,
              'observed_pr_head': source_sha,
              'domains': ['ai'],
              'operation_ids': ['AIMW-AI-4C84DDBEEB'],
          })
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Enforce one-operation closure and exact evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          target = 'AIMW-AI-4C84DDBEEB'
          previous_sha = '5059e73c7b64b1e56f926d589b3f0c9eab11cf5f'
          rel = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          previous = json.loads(subprocess.check_output(['git','show',f'{previous_sha}:{rel}'], text=True))
          current = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          before = {row['operation_id']: row['migration_state'] for row in previous['operations']}
          after = {row['operation_id']: row['migration_state'] for row in current['operations']}
          changes = [(operation_id, before[operation_id], after[operation_id]) for operation_id in before if before[operation_id] != after[operation_id]]
          if changes != [(target, 'PENDING', 'ADAPTED')]:
              raise SystemExit(f'illegal parity delta: {changes}')
          totals = current['totals']
          actual = {key: totals[key] for key in ('total','terminal','pending','blocked')}
          expected = {'total': 931, 'terminal': 468, 'pending': 463, 'blocked': 0}
          if actual != expected:
              raise SystemExit(f'unexpected totals: {actual}')
          row = next(row for row in current['operations'] if row['operation_id'] == target)
          if row['laravel_destination'] != 'variants/laravel-aiwmweb/backend/app/Jobs/JobFailureGate.php':
              raise SystemExit(f'unexpected destination: {row["laravel_destination"]}')
          if row['acceptance_test'] != 'variants/laravel-aiwmweb/backend/tests/Unit/JobFailureGateTest.php':
              raise SystemExit(f'unexpected acceptance test: {row["acceptance_test"]}')
          signals = (row.get('reconciliation') or {}).get('signals') or []
          if 'scoped-job:JobFailureGate' not in signals:
              raise SystemExit(f'missing scoped exact-job evidence: {signals}')
          print('SLOT30_SCOPED_DELTA=PASS')
          PY
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

      - name: Commit generated canonical artifacts and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'walidatiyaai2025-gif'
          git config user.email 'walidatiyaai2025@gmail.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/slot30-scoped-reconcile.yml
          git commit -m 'Reconcile AIMW-AI-4C84DDBEEB on live composition'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AI-4C84DDBEEB-job-failure-gate

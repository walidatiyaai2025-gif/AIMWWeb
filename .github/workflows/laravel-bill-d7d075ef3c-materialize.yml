name: Laravel BILL D7D075EF3C Materialize

on:
  push:
    branches:
      - worker/laravel-bill-d7d075ef3c-site-settings-delete
    paths:
      - '.github/workflows/laravel-bill-d7d075ef3c-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist

      - name: Focused security acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: php artisan test tests/Feature/SiteSettingsDeleteTerminalityTest.php

      - name: Pint changed PHP
        working-directory: variants/laravel-aiwmweb/backend
        run: vendor/bin/pint --test app/Http/Controllers/SiteSettingsDeleteController.php app/Http/Controllers/SiteSettingsReadController.php app/Providers/SiteSettingsRouteServiceProvider.php tests/Feature/SiteSettingsDeleteTerminalityTest.php

      - name: Bind exact pushed focused evidence source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = '60dee3313092fd5b08cc15f1136f66a2bbc84cd6'
          data['focused_closure_evidence_source_sha'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Enforce exact-one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          git show 60dee3313092fd5b08cc15f1136f66a2bbc84cd6:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json > /tmp/previous.json
          python - <<'PY'
          import json
          from pathlib import Path
          target = 'AIMW-BILL-D7D075EF3C'
          old = json.loads(Path('/tmp/previous.json').read_text())
          new = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          assert old['totals']['total'] == new['totals']['total'] == 931
          assert old['totals']['terminal'] == 593, old['totals']
          assert old['totals']['pending'] == 338, old['totals']
          assert old['totals']['blocked'] == 0, old['totals']
          assert new['totals']['terminal'] == 594, new['totals']
          assert new['totals']['pending'] == 337, new['totals']
          assert new['totals']['blocked'] == 0, new['totals']
          before = {x['operation_id']: x for x in old['operations']}
          after = {x['operation_id']: x for x in new['operations']}
          changed = [op for op in before if before[op]['migration_state'] != after[op]['migration_state']]
          assert changed == [target], changed
          assert before[target]['migration_state'] == 'PENDING'
          assert after[target]['migration_state'] == 'ADAPTED'
          assert after[target]['acceptance_test'].endswith('SiteSettingsDeleteTerminalityTest.php')
          print('EXACT_ONE_TRANSITION=PASS')
          print('TOTAL=931 TERMINAL=594 PENDING=337 BLOCKED=0')
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha 60dee3313092fd5b08cc15f1136f66a2bbc84cd6

      - name: Commit official generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --exit-code && { echo 'Expected generated parity changes were not produced'; exit 1; } || true
          git commit -m 'Laravel: materialize D7D075EF3C parity closure'
          git push origin HEAD:worker/laravel-bill-d7d075ef3c-site-settings-delete

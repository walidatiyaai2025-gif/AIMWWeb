name: Laravel AIWMWeb About Build Provenance Once

on:
  pull_request:
    paths:
      - '.github/workflows/laravel-aiwmweb-about-build-provenance-once.yml'

permissions:
  contents: write

jobs:
  converge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      EVIDENCE_SHA: ed3f8fa663b105d8b8105b56eb22fc7399baa8f4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Register exact About Build route contracts and refresh parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          ids = {'AIMW-CONT-81B4B20D2D', 'AIMW-CONT-110268CC96'}
          existing = {
              op
              for source in manifest.get('countable_sources', [])
              for op in (source.get('operation_evidence') or {})
          }
          overlap = sorted(ids & existing)
          if overlap:
              raise SystemExit('About Build route evidence already registered: ' + ', '.join(overlap))

          source_sha = os.environ['EVIDENCE_SHA']
          evidence = {
              'AIMW-CONT-81B4B20D2D': {
                  'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/AboutBuildRouteServiceProvider.php',
                  'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/AboutBuildReadController.php',
                  'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/AboutBuildRouteTerminalityTest.php',
                  'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/route-api-terminality.json',
              },
              'AIMW-CONT-110268CC96': {
                  'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/AboutBuildRouteServiceProvider.php',
                  'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/AboutBuildReadController.php',
                  'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/AboutBuildRouteTerminalityTest.php',
                  'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/route-api-terminality.json',
              },
          }
          manifest['countable_sources'].append({
              'label': 'Canonical About Build route provenance',
              'sha': source_sha,
              'observed_pr_head': source_sha,
              'domains': ['content'],
              'operation_evidence': evidence,
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('variants/laravel-aiwmweb/backend/tests/Feature/AboutBuildRouteTerminalityTest.php')
          text = test_path.read_text(encoding='utf-8')
          if text.count("$this->assertSame('PENDING', $row['migration_state']);") != 2:
              raise SystemExit('Unexpected AboutBuildRouteTerminalityTest migration-state assertion count')
          text = text.replace("test_canonical_reconciliation_row_is_the_pending_about_build_route", "test_canonical_reconciliation_row_is_the_adapted_about_build_route")
          text = text.replace("test_canonical_reconciliation_row_is_the_distinct_pending_release_notes_route", "test_canonical_reconciliation_row_is_the_distinct_adapted_release_notes_route")
          text = text.replace("$this->assertSame('PENDING', $row['migration_state']);", "$this->assertSame('ADAPTED', $row['migration_state']);")
          test_path.write_text(text, encoding='utf-8')
          PY

          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
                  variants/laravel-aiwmweb/backend/tests/Feature/AboutBuildRouteTerminalityTest.php
          git commit -m 'chore(laravel): reconcile about-build route provenance'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

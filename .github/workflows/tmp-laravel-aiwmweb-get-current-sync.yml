name: TEMP Laravel AIWMWeb GetCurrent Parity Sync

on:
  push:
    branches:
      - worker/laravel-AIMW-PLAT-57B1A0F5E3-release-notes-get-current

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input /tmp/operation-parity-reconciliation.json --output /tmp/operation-parity-reconciliation.json --summary-output /tmp/operation-parity-summary.json --markdown-output /tmp/operation-parity-reconciliation.md --check-total 931
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
      - name: Commit exact generator output
        run: |
          if git diff --quiet -- variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'docs(laravel): sync GetCurrent parity reconciliation'
          git push origin HEAD:worker/laravel-AIMW-PLAT-57B1A0F5E3-release-notes-get-current

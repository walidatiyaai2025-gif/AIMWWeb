name: Slot 0112 AI Center Usage Reconciliation

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AI-331ED9D5EE-slot0112
    paths:
      - '.github/workflows/slot0112-ai-center-usage-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_SHA: '0913992e07e3bb570a40ea0b6f3f64bdb6651fb3'
      SOURCE_SHA: '9652797dbf90f013ca2cf36b308a50c161fe4999'
      OPERATION_ID: 'AIMW-AI-331ED9D5EE'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin focused closure source
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          doc = json.loads(path.read_text())
          doc['focused_closure_evidence_source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Rebuild canonical reconciliation
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Enforce one-operation transition
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base_path = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          base = json.loads(subprocess.check_output(['git', 'show', f"{os.environ['BASE_SHA']}:{base_path}"], text=True))
          new = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          before = {row['operation_id']: row['migration_state'] for row in base['operations']}
          after = {row['operation_id']: row['migration_state'] for row in new['operations']}
          changed = [(op, before[op], after[op]) for op in sorted(before) if before[op] != after[op]]
          expected = [(os.environ['OPERATION_ID'], 'PENDING', 'ADAPTED')]
          if changed != expected:
              raise SystemExit(f'unexpected migration-state transitions: {changed!r}')
          totals = new['totals']
          expected_totals = {'total': 931, 'terminal': 487, 'pending': 444, 'blocked': 0}
          actual = {key: totals[key] for key in expected_totals}
          if actual != expected_totals:
              raise SystemExit(f'unexpected totals: {actual!r}')
          if not new.get('validation', {}).get('passed'):
              raise SystemExit(f"generator validation failed: {new.get('validation', {}).get('errors')}")
          row = next(row for row in new['operations'] if row['operation_id'] == os.environ['OPERATION_ID'])
          if row.get('reconciliation', {}).get('evidence_mode') != 'focused_closure_contract':
              raise SystemExit('selected operation did not close through focused_closure_contract')
          print(f"ONLY_TRANSITION={changed[0][0]}:{changed[0][1]}->{changed[0][2]}")
          print(f"TOTAL={totals['total']}")
          print(f"TERMINAL={totals['terminal']}")
          print(f"PENDING={totals['pending']}")
          print(f"BLOCKED={totals['blocked']}")
          print(f"PARITY={totals['overall_parity_percent']}")
          PY

      - name: Commit generated authority and remove helper
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/slot0112-ai-center-usage-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git commit -m 'docs(laravel): reconcile AI Center usage navigation'
          git push origin HEAD

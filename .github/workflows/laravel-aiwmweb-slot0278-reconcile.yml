name: Laravel AIWMWeb Slot0278 Reconciliation Materializer

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-EEFDAB3DF8-slot0253
    paths:
      - '.github/workflows/laravel-aiwmweb-slot0278-reconcile.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-AIMW-AUTO-EEFDAB3DF8-slot0253
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical operation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          root='variants/laravel-aiwmweb'
          json="$root/docs/operation-parity-reconciliation.json"
          md="$root/docs/operation-parity-reconciliation.md"
          summary='/tmp/operation-parity-summary.json'
          python "$root/tools/finalize_operation_parity.py" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python "$root/tools/apply_tenant_neutral_route_evidence.py" --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python "$root/tools/apply_explicit_route_api_provenance.py" --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python "$root/tools/apply_focused_closure_evidence.py" --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python "$root/tools/apply_focused_service_evidence.py" --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python "$root/tools/apply_focused_background_job_evidence.py" --input "$json" --output "$json" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/operation-parity-summary.json').read_text())
          t = p['totals']
          assert t['total'] == 931
          assert t['terminal'] == 531
          assert t['pending'] == 400
          assert t['blocked'] == 0
          assert 'AIMW-AUTO-EEFDAB3DF8' in p['validation']['focused_background_job_contract_terminals']
          print('SLOT0278_GENERATED_RECONCILIATION=PASS')
          PY
      - name: Commit generated artifacts and remove one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git rm .github/workflows/laravel-aiwmweb-slot0278-reconcile.yml
          git commit -m 'docs(laravel): regenerate ExecutionJobStore parity reconciliation'
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-AUTO-EEFDAB3DF8-slot0253

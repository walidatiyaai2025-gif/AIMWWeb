name: Temporary Welcome Route Parity Materializer

on:
  push:
    branches:
      - worker/laravel-cont-86346f4c6c-welcome-route

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      BASE_AUTHORITY_SHA: 35ea3bd44a3c6977da8e40ad1dd08c2ff117c9cc
      OPERATION_ID: AIMW-CONT-86346F4C6C
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/laravel-cont-86346f4c6c-welcome-route

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin previous reconciliation to exact authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['previous_reconciliation_sha'] = '35ea3bd44a3c6977da8e40ad1dd08c2ff117c9cc'
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Run official six-stage reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Prove exactly one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$BASE_AUTHORITY_SHA" | tee /tmp/parity-delta.txt
          grep -Fx 'PREVIOUS_TERMINAL=597' /tmp/parity-delta.txt
          grep -Fx 'CURRENT_TERMINAL=598' /tmp/parity-delta.txt
          grep -Fx 'TERMINAL_DELTA=+1' /tmp/parity-delta.txt
          grep -Fx 'FALSE_POSITIVES_DEMOTED=0' /tmp/parity-delta.txt
          grep -Fx 'FALSE_PENDING_ROWS_TERMINALIZED=1' /tmp/parity-delta.txt
          grep -Fx 'STATUS_CHANGED_ROWS=1' /tmp/parity-delta.txt
          grep -Fx "TERMINALIZED_IDS=$OPERATION_ID" /tmp/parity-delta.txt
          grep -Fx "STATUS_CHANGED_IDS=$OPERATION_ID" /tmp/parity-delta.txt
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          row = next(row for row in payload['operations'] if row['operation_id'] == 'AIMW-CONT-86346F4C6C')
          assert row['migration_state'] == 'ADAPTED', row
          assert payload['totals']['total'] == 931, payload['totals']
          assert payload['totals']['terminal'] == 598, payload['totals']
          assert payload['totals']['pending'] == 333, payload['totals']
          assert payload['totals']['blocked'] == 0, payload['totals']
          PY

      - name: Materialize official artifacts
        run: |
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Focused route validation
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          vendor/bin/pint --test app/Providers/PublicWelcomeRouteServiceProvider.php tests/Feature/WelcomeRouteTerminalityTest.php
          php artisan test tests/Feature/WelcomeRouteTerminalityTest.php

      - name: Remove temporary workflow and commit generated authority
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/welcome-route-parity-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit' >&2
            exit 1
          fi
          git commit -m 'Materialize Welcome route parity reconciliation'
          git push origin HEAD:worker/laravel-cont-86346f4c6c-welcome-route

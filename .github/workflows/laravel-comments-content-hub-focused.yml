name: Laravel Comments Content Hub Focused

on:
  push:
    branches:
      - worker/laravel-comm-a0d005681b-content-hub-link

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite
      - name: Focused Laravel acceptance
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate:fresh --force
          php artisan test tests/Feature/CommentsContentHubLinkTerminalityTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: variants/laravel-aiwmweb/backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Focused frontend acceptance
        run: npm test -- --run resources/js/__tests__/comments-content-hub-link.test.tsx

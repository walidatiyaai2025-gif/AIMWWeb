name: Temporary recover backup reload hardening

on:
  push:
    branches:
      - recovery/laravel-backup-reload-hardening-final-20260917

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current-authority page patch
        run: python3 variants/laravel-aiwmweb/tools/tmp_apply_backup_reload_recovery.py
      - name: Install frontend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: npm install --no-audit --no-fund
      - name: Run focused backup reload tests
        working-directory: variants/laravel-aiwmweb/backend
        run: npm test -- --run resources/js/__tests__/backup-reload-control.test.ts resources/js/__tests__/backup-reload-visible-control.test.tsx
      - name: Run frontend typecheck
        working-directory: variants/laravel-aiwmweb/backend
        run: npm run typecheck
      - name: Commit recovered runtime hardening and self-clean helpers
        shell: bash
        run: |
          git rm .github/workflows/tmp-recover-backup-reload-hardening.yml
          git rm variants/laravel-aiwmweb/tools/tmp_apply_backup_reload_recovery.py
          git add variants/laravel-aiwmweb/backend/resources/js/pages.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete backup reload runtime recovery'
          git push origin HEAD:recovery/laravel-backup-reload-hardening-final-20260917

          (js / 'backup-reload-control.ts').write_text("""export const BACKUPS_RELOAD_OPERATION_ID = 'AIMW-BILL-07A0F6427B';

export type BackupReloadOutcome = 'busy' | 'failed' | 'succeeded';

type BackupReloadRefetchResult = {
    error?: unknown;
};

type BackupReloadOptions = {
    busy: boolean;
    refetch: () => Promise<BackupReloadRefetchResult>;
    onSuccess: () => void;
    onFailure: (error: unknown) => void;
};

export async function runAuthoritativeBackupReload({
    busy,
    refetch,
    onSuccess,
    onFailure,
}: BackupReloadOptions): Promise<BackupReloadOutcome> {
    if (busy) return 'busy';

    try {
        const refreshed = await refetch();
        if (refreshed.error != null) {
            onFailure(refreshed.error);
            return 'failed';
        }

        onSuccess();
        return 'succeeded';
    } catch (error) {
        onFailure(error);
        return 'failed';
    }
}
""", encoding='utf-8')

          (tests / 'backup-reload-control.test.ts').write_text("""import { describe, expect, it, vi } from 'vitest';
import { BACKUPS_RELOAD_OPERATION_ID, runAuthoritativeBackupReload } from '../backup-reload-control';

describe('backup reload control', () => {
    it('binds the exact already-terminal canonical operation id', () => {
        expect(BACKUPS_RELOAD_OPERATION_ID).toBe('AIMW-BILL-07A0F6427B');
    });

    it('fails closed while an authoritative reload is already in flight', async () => {
        const refetch = vi.fn(async () => ({ error: null }));
        const onSuccess = vi.fn();
        const onFailure = vi.fn();

        const outcome = await runAuthoritativeBackupReload({ busy: true, refetch, onSuccess, onFailure });

        expect(outcome).toBe('busy');
        expect(refetch).not.toHaveBeenCalled();
        expect(onSuccess).not.toHaveBeenCalled();
        expect(onFailure).not.toHaveBeenCalled();
    });

    it('reports success only after the authoritative reread completes', async () => {
        const events: string[] = [];
        const refetch = vi.fn(async () => {
            events.push('refetch');
            return { error: null };
        });

        const outcome = await runAuthoritativeBackupReload({
            busy: false,
            refetch,
            onSuccess: () => events.push('success'),
            onFailure: () => events.push('failure'),
        });

        expect(outcome).toBe('succeeded');
        expect(events).toEqual(['refetch', 'success']);
    });

    it('surfaces an authoritative reread failure without false success', async () => {
        const failure = new Error('backup reread failed');
        const events: string[] = [];

        const outcome = await runAuthoritativeBackupReload({
            busy: false,
            refetch: async () => {
                events.push('refetch');
                return { error: failure };
            },
            onSuccess: () => events.push('success'),
            onFailure: (error) => {
                expect(error).toBe(failure);
                events.push('failure');
            },
        });

        expect(outcome).toBe('failed');
        expect(events).toEqual(['refetch', 'failure']);
    });

    it('surfaces a thrown reread failure without false success', async () => {
        const failure = new Error('network unavailable');
        const onSuccess = vi.fn();
        const onFailure = vi.fn();

        const outcome = await runAuthoritativeBackupReload({
            busy: false,
            refetch: async () => { throw failure; },
            onSuccess,
            onFailure,
        });

        expect(outcome).toBe('failed');
        expect(onSuccess).not.toHaveBeenCalled();
        expect(onFailure).toHaveBeenCalledWith(failure);
    });
});
""", encoding='utf-8')

          (tests / 'backup-reload-visible-control.test.tsx').write_text("""import React from 'react';
import { QueryClient, QueryClientProvider } from '@tanstack/react-query';
import { fireEvent, render, screen, waitFor } from '@testing-library/react';
import { afterEach, describe, expect, it, vi } from 'vitest';
import { ToastProvider } from '../components';
import type { FrontendContext, WorkspaceRoute } from '../core';
import { LocaleProvider } from '../i18n';
import { WorkspacePage } from '../pages';

const OPERATION_ID = 'AIMW-BILL-07A0F6427B';

function context(overrides: Partial<FrontendContext> = {}): FrontendContext {
    return {
        user: { id: 1, name: 'Backup Admin', email: 'backup-admin@example.test' },
        tenant: { slug: 'alpha', name: 'Alpha' },
        tenants: [{ slug: 'alpha', name: 'Alpha' }],
        permissions: ['backups.view'],
        connectors: [],
        capabilities: {},
        api: { backups: '/tenants/alpha/admin/backups' },
        actions: {},
        ...overrides,
    };
}

const route: WorkspaceRoute = {
    key: 'backups',
    path: '/module/backups',
    group: 'system',
    icon: '⬡',
    label: { en: 'Backup & Restore', ar: 'النسخ الاحتياطي والاستعادة' },
    description: { en: 'Protect and restore tenant-scoped application data.', ar: 'حماية واستعادة بيانات التطبيق الخاصة بالحساب.' },
    apiKey: 'backups',
    permission: 'backups.view',
    controls: ['backups.create', 'backups.restore'],
    kind: 'resource',
};

function renderWorkspace(current = context()) {
    const client = new QueryClient({ defaultOptions: { queries: { retry: false } } });
    return render(
        <QueryClientProvider client={client}>
            <LocaleProvider>
                <ToastProvider>
                    <WorkspacePage context={current} route={route} />
                </ToastProvider>
            </LocaleProvider>
        </QueryClientProvider>,
    );
}

afterEach(() => {
    vi.unstubAllGlobals();
});

describe(`${OPERATION_ID} Reload backups`, () => {
    it('rereads the existing tenant-derived authoritative backup endpoint with GET only', async () => {
        const fetchMock = vi.fn()
            .mockResolvedValueOnce(new Response(JSON.stringify([{ id: 11, status: 'completed' }]), { status: 200, headers: { 'content-type': 'application/json' } }))
            .mockResolvedValueOnce(new Response(JSON.stringify([{ id: 12, status: 'completed' }]), { status: 200, headers: { 'content-type': 'application/json' } }));
        vi.stubGlobal('fetch', fetchMock);

        renderWorkspace();

        expect(await screen.findByText('11')).toBeInTheDocument();
        const reload = screen.getByRole('button', { name: 'Reload backups' });
        expect(reload).toHaveAttribute('data-canonical-operation', OPERATION_ID);
        expect(fetchMock).toHaveBeenCalledTimes(1);
        expect(fetchMock.mock.calls[0][0]).toBe('/tenants/alpha/admin/backups?page=1');

        fireEvent.click(reload);

        expect(await screen.findByText('12')).toBeInTheDocument();
        expect(screen.queryByText('11')).not.toBeInTheDocument();
        await waitFor(() => expect(fetchMock).toHaveBeenCalledTimes(2));
        expect(fetchMock.mock.calls[1][0]).toBe('/tenants/alpha/admin/backups?page=1');
        expect(fetchMock.mock.calls.every(([, options]) => !options || options.method === undefined || options.method === 'GET')).toBe(true);
    });

    it('renders fail-closed when the backup workspace permission is absent', async () => {
        vi.stubGlobal('fetch', vi.fn());
        renderWorkspace(context({ permissions: [] }));
        expect(await screen.findByText('Permission required')).toBeInTheDocument();
        expect(screen.queryByRole('button', { name: 'Reload backups' })).not.toBeInTheDocument();
    });
});
""", encoding='utf-8')


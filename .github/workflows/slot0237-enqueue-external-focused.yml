name: Slot0237 EnqueueExternal Focused

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-0B1BC18769-slot0237

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/pint --test app/Execution/ExecutionCenterExternalEnqueueService.php tests/Feature/ExecutionCenterEnqueueExternalTerminalityTest.php
      - run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Focused and sibling execution-center acceptance
        run: php artisan test tests/Feature/ExecutionCenterEnqueueExternalTerminalityTest.php tests/Feature/ExecutionCenterEnqueueTerminalityTest.php tests/Feature/ExecutionCenterGetJobsTerminalityTest.php tests/Feature/ExecutionCenterGetActivitiesTerminalityTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_aiwmweb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_aiwmweb
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - name: Focused and sibling execution-center acceptance
        run: php artisan test tests/Feature/ExecutionCenterEnqueueExternalTerminalityTest.php tests/Feature/ExecutionCenterEnqueueTerminalityTest.php tests/Feature/ExecutionCenterGetJobsTerminalityTest.php tests/Feature/ExecutionCenterGetActivitiesTerminalityTest.php

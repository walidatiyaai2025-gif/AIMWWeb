name: Laravel AIWMWeb PR394 Generated Reconciliation Repair

on:
  push:
    branches:
      - worker/laravel-AIMW-AI-6EF2330C99-operations-maintenance-route

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate canonical reconciliation with repository tooling
        shell: bash
        run: |
          set -euo pipefail
          out='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input "$out" \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input "$out" \
            --output "$out" \
            --summary-output "$summary" \
            --markdown-output "$md" \
            --check-total 931
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          totals = doc['totals']
          assert totals == {
              **totals,
              'total': 931,
              'terminal': 471,
              'pending': 460,
              'blocked': 0,
          }, totals
          row = next(x for x in doc['operations'] if x['operation_id'] == 'AIMW-AI-6EF2330C99')
          assert row['migration_state'] == 'ADAPTED', row
          PY

      - name: Commit generator-backed artifacts and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr394-generated-reconciliation-repair.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git commit -m 'chore(laravel): reconcile PR #394 parity artifacts'
          git push origin HEAD:worker/laravel-AIMW-AI-6EF2330C99-operations-maintenance-route

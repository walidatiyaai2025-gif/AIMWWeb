name: REL003 Windows Handle Fix

on:
  push:
    branches:
      - lead/rel003-final-offline-recovery-closure

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/rel003-final-offline-recovery-closure
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python Build/rel003-windows-handle-fix.py
      - run: git diff --check
      - run: dotnet restore .\AIWordPressManager.Web.sln
      - run: dotnet build .\AIWordPressManager.Web.sln --configuration Release --no-restore
      - run: dotnet test .\AIWordPressManager.Web.sln --configuration Release --no-build
      - shell: pwsh
        run: |
          Remove-Item Build\rel003-windows-handle-fix.py -Force
          Remove-Item .github\workflows\rel003-windows-handle-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: release SQLite snapshot handles before archive and restore"
          git push origin HEAD:lead/rel003-final-offline-recovery-closure

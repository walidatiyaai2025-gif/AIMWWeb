name: Slot0305 Parity Artifact Autocommit

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-OPER-21EC1BDE45-reconcile-slot0305

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enroll exact pushed Slot0305 focused evidence
        shell: bash
        run: |
          set -euo pipefail
          cp variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json /tmp/slot0305-before.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          expected = 'f66004d1cc10ebd06eba240a27eee39b23b3ef7b'
          current = payload.get('focused_closure_evidence_source_sha')
          if current != expected:
              raise SystemExit(f'unexpected focused evidence source: {current} != {expected}')
          payload['focused_closure_evidence_source_sha'] = 'b31a726c3f424f13e527006b2117c11ac782c64e'
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical parity artifacts
        run: |
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md \
            --check-total 931

      - name: Assert isolated canonical delta
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/slot0305-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text(encoding='utf-8'))
          before_rows = {row['operation_id']: row for row in before['operations']}
          after_rows = {row['operation_id']: row for row in after['operations']}
          changes = [
              (op_id, before_rows[op_id]['migration_state'], after_rows[op_id]['migration_state'])
              for op_id in sorted(before_rows)
              if before_rows[op_id]['migration_state'] != after_rows[op_id]['migration_state']
          ]
          expected = [('AIMW-OPER-21EC1BDE45', 'PENDING', 'ADAPTED')]
          if changes != expected:
              raise SystemExit(f'non-isolated parity delta: {changes!r}')
          totals = after['totals']
          required = {'total': 931, 'terminal': 558, 'pending': 373, 'blocked': 0, 'adapted': 558}
          for key, value in required.items():
              if totals.get(key) != value:
                  raise SystemExit(f'unexpected {key}: {totals.get(key)} != {value}')
          row = after_rows['AIMW-OPER-21EC1BDE45']
          if (row.get('reconciliation') or {}).get('evidence_mode') != 'focused_closure_contract':
              raise SystemExit('runtime Open logs did not terminalize through focused_closure_contract')
          print('SLOT0305_ISOLATED_DELTA=PASS')
          PY

      - name: Commit exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'No generated parity changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(laravel): commit generated Slot0305 parity artifacts'
          git push origin HEAD:${GITHUB_REF_NAME}

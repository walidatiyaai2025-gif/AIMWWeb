name: Laravel AIWMWeb cPanel SSH CD

# Each required Laravel push CI workflow can finish first; the deployment gate
# independently requires BOTH current-main workflows to have passed. Re-running
# an accepted source also requires a fresh exact-head CI recheck.
on:
  workflow_run:
    workflows:
      - Laravel AIWMWeb Acceptance
      - Laravel AIWMWeb cPanel Setup ZIP
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: laravel-aiwmweb-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aiwm-cpanel-production
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AIWM_SIGNER_ROTATED: ${{ secrets.AIWM_UPDATES_SIGNER_ROTATED }}
      AIWM_CPANEL_ACCEPTANCE_VERIFIED: ${{ secrets.AIWM_CPANEL_ACCEPTANCE_VERIFIED }}
      AIWM_TRUSTED_KEY: ${{ secrets.AIWM_UPDATES_TRUSTED_PUBLIC_KEY }}
      AIWM_UPDATES_SECRET_KEY: ${{ secrets.AIWM_UPDATES_SECRET_KEY }}
      AIWM_MIN_SUPPORTED_VERSION: ${{ vars.AIWM_MIN_SUPPORTED_VERSION }}
    steps:
      - name: Checkout immutable candidate only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Require latest main and all current Laravel push CI green
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'BLOCKED: main only'; exit 1; }
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
          if ! python3 variants/laravel-aiwmweb/tools/release/verify-production-ci.py \
             "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/runs.json" "$SOURCE_SHA"; then
            if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo 'BLOCKED: manual retry still requires latest green main CI' >&2
              exit 1
            fi
            echo 'NOT_DEPLOYED: candidate is stale, a required CI workflow is pending, or a gate is red.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id="$(jq -r --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .name == "Laravel AIWMWeb cPanel Setup ZIP"
              and .event == "push" and .status == "completed"
              and .conclusion == "success")]
            | sort_by(.updated_at, .id) | last | .id // empty
          ' "$RUNNER_TEMP/runs.json")"
          number="$(jq -r --argjson id "$id" \
            '.workflow_runs[] | select(.id == $id) | .run_number' "$RUNNER_TEMP/runs.json")"
          [[ "$id" =~ ^[0-9]+$ && "$number" =~ ^[0-9]+$ ]] || { echo 'BLOCKED: no proven Setup ZIP run'; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "package_run=$id" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$number" >> "$GITHUB_OUTPUT"

      - name: Validate production signer, key rotation and SSH configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          AIWM_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.AIWM_DEPLOY_SSH_PRIVATE_KEY }}
          AIWM_DEPLOY_KNOWN_HOSTS: ${{ secrets.AIWM_DEPLOY_KNOWN_HOSTS }}
          AIWM_DEPLOY_HOST: ${{ secrets.AIWM_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ "$AIWM_SIGNER_ROTATED" == 'yes' ]] || { echo 'BLOCKED: compromised signer must be rotated'; exit 1; }
          [[ "$AIWM_CPANEL_ACCEPTANCE_VERIFIED" == 'yes' ]] || { echo 'BLOCKED: independent cPanel acceptance required'; exit 1; }
          [[ -n "$AIWM_UPDATES_SECRET_KEY" && -n "$AIWM_TRUSTED_KEY" ]] || { echo 'BLOCKED: missing trusted production signing keys'; exit 1; }
          [[ -n "$AIWM_DEPLOY_SSH_PRIVATE_KEY" && -n "$AIWM_DEPLOY_KNOWN_HOSTS" && -n "$AIWM_DEPLOY_HOST" ]] || { echo 'BLOCKED: missing SSH connection secrets'; exit 1; }
          [[ "$AIWM_MIN_SUPPORTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'BLOCKED: set explicit minimum compatible deployed version'; exit 1; }
          php -r '
            $private=base64_decode((string)getenv("AIWM_UPDATES_SECRET_KEY"), true);
            $public=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            if (!is_string($private) || strlen($private)!==SODIUM_CRYPTO_SIGN_SECRETKEYBYTES ||
                !is_string($public) || strlen($public)!==SODIUM_CRYPTO_SIGN_PUBLICKEYBYTES ||
                !hash_equals($public, sodium_crypto_sign_publickey_from_secretkey($private))) {
              fwrite(STDERR, "BLOCKED: release signer does not match installed trusted public key\n"); exit(1);
            }'

      - name: Recover only verified build outputs from exact accepted Setup ZIP
        if: steps.gate.outputs.ready == 'true'
        env:
          PACKAGE_RUN: ${{ steps.gate.outputs.package_run }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpanel-build" "$RUNNER_TEMP/deploy"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "AIWMWeb-Laravel-cPanel-$SOURCE_SHA" --dir "$RUNNER_TEMP/cpanel-build"
          test -s "$RUNNER_TEMP/cpanel-build/AIWMWeb-Setup-v$VERSION.zip"
          python3 variants/laravel-aiwmweb/tools/deploy/prepare_signed_deploy.py \
            "$RUNNER_TEMP/cpanel-build/AIWMWeb-Setup-v$VERSION.zip" \
            variants/laravel-aiwmweb/backend "$SOURCE_SHA" "$VERSION"
          php -l variants/laravel-aiwmweb/tools/deploy/remote-apply-signed-update.php
          bash -n variants/laravel-aiwmweb/tools/deploy/ssh-deploy.sh

      - name: Create production Ed25519-signed update from exact build SHA
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          AIWM_MIN_SUPPORTED_VERSION: ${{ env.AIWM_MIN_SUPPORTED_VERSION }}
        run: |
          set -euo pipefail
          php variants/laravel-aiwmweb/tools/release/build-signed-update.php \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/deploy"
          unzip -t "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-signed-bundle.zip" >/dev/null
          php -r '
            $m=file_get_contents($argv[1]);
            $s=base64_decode(trim(file_get_contents($argv[2])), true);
            $p=base64_decode((string)getenv("AIWM_TRUSTED_KEY"), true);
            $v=json_decode($m, true, 512, JSON_THROW_ON_ERROR);
            if (!is_string($s) || !is_string($p) ||
                !sodium_crypto_sign_verify_detached($s,$m,$p) ||
                $v["sha"]!==getenv("SOURCE_SHA") ||
                $v["version"]!==getenv("VERSION") ||
                $v["minimum_supported_version"]!==getenv("AIWM_MIN_SUPPORTED_VERSION") ||
                !hash_equals($v["sha256"],hash_file("sha256",$argv[3]))) {
              fwrite(STDERR,"BLOCKED: signed ZIP provenance/integrity verification failed\n"); exit(1);
            }' \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-release.sig" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-update.zip"

      - name: Recheck exact latest main and green CI immediately before deployment
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 variants/laravel-aiwmweb/tools/release/verify-production-ci.py \
            "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/runs.json" "$SOURCE_SHA"

      - name: Apply signed ZIP to cPanel over pinned SSH
        if: steps.gate.outputs.ready == 'true'
        env:
          BUILD_VERSION: ${{ steps.gate.outputs.version }}
          AIWM_DEPLOY_HOST: ${{ secrets.AIWM_DEPLOY_HOST }}
          AIWM_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.AIWM_DEPLOY_SSH_PRIVATE_KEY }}
          AIWM_DEPLOY_KNOWN_HOSTS: ${{ secrets.AIWM_DEPLOY_KNOWN_HOSTS }}
          AIWM_DEPLOY_USER: ${{ vars.AIWM_DEPLOY_USER }}
          AIWM_DEPLOY_SITE_ROOT: ${{ vars.AIWM_DEPLOY_SITE_ROOT }}
          AIWM_DEPLOY_PORT: ${{ vars.AIWM_DEPLOY_PORT }}
          AIWM_DEPLOY_PHP_BIN: ${{ vars.AIWM_DEPLOY_PHP_BIN }}
          SIGNED_BUNDLE: ${{ runner.temp }}/deploy/AIWMWeb-Laravel-signed-bundle.zip
          RUNNER_SCRIPT: variants/laravel-aiwmweb/tools/deploy/remote-apply-signed-update.php
        run: bash variants/laravel-aiwmweb/tools/deploy/ssh-deploy.sh

      - name: Publish immutable signed Setup and Update release after live health
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Post-deploy state may advance in a newer main run. Never mint a tag
          # associating these bits with a different or outdated Git commit.
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')"
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo 'BLOCKED: main moved before release publication'; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'BLOCKED: immutable release tag already exists; do not overwrite'
            exit 1
          fi
          cp "$RUNNER_TEMP/cpanel-build/AIWMWeb-Setup-v$VERSION.zip" "$RUNNER_TEMP/deploy/"
          unzip -p "$RUNNER_TEMP/deploy/AIWMWeb-Setup-v$VERSION.zip" BUILD-INFO.json > "$RUNNER_TEMP/deploy/BUILD-INFO.json"
          unzip -p "$RUNNER_TEMP/deploy/AIWMWeb-Setup-v$VERSION.zip" RELEASE-NOTES.txt > "$RUNNER_TEMP/deploy/RELEASE-NOTES.txt"
          (
            cd "$RUNNER_TEMP/deploy"
            sha256sum AIWMWeb-Setup-v"$VERSION".zip AIWMWeb-Laravel-update.zip \
              AIWMWeb-Laravel-signed-bundle.zip AIWMWeb-Laravel-release.json \
              AIWMWeb-Laravel-release.sig > SHA256SUMS.txt
          )
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "AIWMWeb Laravel v$VERSION" \
            --notes "Automatic cPanel SSH release. Deployed and health-checked exact source $SOURCE_SHA via the signed Laravel updater." \
            "$RUNNER_TEMP/deploy/AIWMWeb-Setup-v$VERSION.zip" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-signed-bundle.zip" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-update.zip" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-release.json" \
            "$RUNNER_TEMP/deploy/AIWMWeb-Laravel-release.sig" \
            "$RUNNER_TEMP/deploy/BUILD-INFO.json" \
            "$RUNNER_TEMP/deploy/RELEASE-NOTES.txt" \
            "$RUNNER_TEMP/deploy/SHA256SUMS.txt"
          echo "Deployed v$VERSION @ $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

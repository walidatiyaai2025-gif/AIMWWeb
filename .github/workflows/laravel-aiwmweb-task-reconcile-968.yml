name: Laravel #968 exact-head integration (temporary)
on:
  push:
    branches:
      - worker/968-aimw-sync-4b986b2651
    paths:
      - '.github/workflows/laravel-aiwmweb-task-reconcile-968.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laravel-task-968-integration
  cancel-in-progress: false

jobs:
  integrate-and-materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/968-aimw-sync-4b986b2651
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest composition without overwriting sibling runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          test "$(git branch --show-current)" = worker/968-aimw-sync-4b986b2651
          grep -q 'AIMW-SYNC-4B986B2651' variants/laravel-aiwmweb/backend/resources/js/media-optimization-editor-control.tsx
          base='origin/worker/laravel-aiwmweb-closure-composition'
          git show "$base:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/968-current-composition-parity.json
          if git merge-base --is-ancestor "$base" HEAD; then
            echo 'Latest composition already ancestor'
          else
            if ! git merge --no-ff --no-commit "$base"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              for file in "${conflicts[@]}"; do
                case "$file" in
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json|variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md|variants/laravel-aiwmweb/docs/operation-parity-summary.json|variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json)
                    git checkout --theirs -- "$file"
                    git add "$file"
                    ;;
                  *) echo "::error::Unexpected runtime conflict: $file"; exit 1;;
                esac
              done
              test -z "$(git diff --name-only --diff-filter=U)"
            fi
            test -f .git/MERGE_HEAD || { echo '::error::Missing composition merge'; exit 1; }
            test "$(cat .git/MERGE_HEAD)" = "$(git rev-parse "$base")" || { echo '::error::Composition moved during merge'; exit 1; }
          fi
      - name: Preserve #968 evidence and run seven official parity stages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data=json.loads(path.read_text())
          sources=data['focused_closure_operation_sources']
          operation='AIMW-SYNC-4B986B2651'
          matches=[s for s in sources if operation in s.get('operation_ids',[])]
          assert len(matches)<=1, 'Duplicate #968 evidence registration'
          if not matches:
              sources.append({'label':'Issue #968 MediaManager local-only optimization cancel focused closure','sha':'9018fee6f06028e6ff047a154bde9dc6931cc738','observed_pr_head':'9018fee6f06028e6ff047a154bde9dc6931cc738','operation_ids':[operation]})
          assert len([s for s in sources if 'AIMW-EMAI-0AA71A5EF6' in s.get('operation_ids',[])])==1, 'Email evidence missing'
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          OUT=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUM=variants/laravel-aiwmweb/docs/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$OUT" --output "$OUT" --summary-output "$SUM" --markdown-output "$MD" --check-total 931
      - name: Assert all 931 operations preserved, #968 ADAPTED, Email 82/82
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/968-current-composition-parity.json').read_text())
          after=json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          summary=json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-summary.json').read_text())
          old={r['operation_id']:r['migration_state'] for r in before['operations']}
          new={r['operation_id']:r['migration_state'] for r in after['operations']}
          assert len(old)==len(new)==931 and set(old)==set(new)
          terminal={'PORTED','ADAPTED','VERIFIED_UNAVAILABLE_EXTERNAL'}
          regressions=[(op,s,new[op]) for op,s in old.items() if s in terminal and new[op] not in terminal]
          assert not regressions, regressions[:20]
          assert old['AIMW-SYNC-4B986B2651']=='PENDING'
          assert new['AIMW-SYNC-4B986B2651']=='ADAPTED'
          assert new['AIMW-SYNC-425B82511E'] in terminal
          assert new['AIMW-EMAI-0AA71A5EF6'] in terminal
          assert summary['domains']['email']['terminal']==82 and summary['domains']['email']['pending']==0
          assert after['totals']['terminal']>=before['totals']['terminal']+1
          assert summary['totals']['terminal']==after['totals']['terminal']
          print('Official parity:',before['totals']['terminal'],'->',after['totals']['terminal'],'/931; Email 82/82')
          PY
      - name: Retire temporary workflow and push non-forced integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/laravel-aiwmweb-task-reconcile-968.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(laravel #968): preserve Email 82/82 and materialize cancellation parity'
          git push origin HEAD:worker/968-aimw-sync-4b986b2651

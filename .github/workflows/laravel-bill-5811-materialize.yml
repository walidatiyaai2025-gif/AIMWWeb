name: Laravel BILL 5811 Materialize

on:
  push:
    branches:
      - worker/laravel-bill-5811b45f89-admin-billing-support-route
    paths:
      - '.github/workflows/laravel-bill-5811-materialize.yml'

permissions:
  contents: write

env:
  PREVIOUS_SHA: b68e2cd3ad6cbb87b49219c4a33d8683fab432c9
  OPERATION_ID: AIMW-BILL-5811B45F89
  PYTHONHASHSEED: '0'

jobs:
  materialize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Focused implementation validation
        shell: bash
        run: |
          set -euo pipefail
          cd variants/laravel-aiwmweb/backend
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch "$RUNNER_TEMP/bill-5811-materialize.sqlite"
          DB_CONNECTION=sqlite DB_DATABASE="$RUNNER_TEMP/bill-5811-materialize.sqlite" CACHE_STORE=array QUEUE_CONNECTION=sync SESSION_DRIVER=array php artisan migrate:fresh --force
          vendor/bin/pint --test app/Http/Controllers/AdminBillingSupportReadController.php app/Providers/AdminBillingSupportRouteServiceProvider.php tests/Feature/AdminBillingSupportRouteTerminalityTest.php
          DB_CONNECTION=sqlite DB_DATABASE="$RUNNER_TEMP/bill-5811-materialize.sqlite" CACHE_STORE=array QUEUE_CONNECTION=sync SESSION_DRIVER=array php artisan test tests/Feature/AdminBillingSupportRouteTerminalityTest.php
      - name: Pin previous canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          document = json.loads(path.read_text())
          document['previous_reconciliation_sha'] = '${{ env.PREVIOUS_SHA }}'
          path.write_text(json.dumps(document, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Run official reconciliation chain
        shell: bash
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current /tmp/operation-parity-reconciliation.json \
            --previous-sha "$PREVIOUS_SHA"
      - name: Guard exact-one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          previous_sha = os.environ['PREVIOUS_SHA']
          operation_id = os.environ['OPERATION_ID']
          path = 'variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          previous = json.loads(subprocess.check_output(['git', 'show', f'{previous_sha}:{path}'], text=True))
          current = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          before = {row['operation_id']: row['migration_state'] for row in previous['operations']}
          after = {row['operation_id']: row['migration_state'] for row in current['operations']}
          changes = sorted((op, before[op], after[op]) for op in before if before[op] != after[op])
          expected = [(operation_id, 'PENDING', 'ADAPTED')]
          if changes != expected:
              raise SystemExit(f'exact-one transition guard failed: expected {expected}, got {changes}')
          p = previous['totals']
          c = current['totals']
          expected_totals = {
              'total': p['total'],
              'terminal': p['terminal'] + 1,
              'pending': p['pending'] - 1,
              'blocked': p['blocked'],
          }
          actual = {key: c[key] for key in expected_totals}
          if actual != expected_totals:
              raise SystemExit(f'totals guard failed: expected {expected_totals}, got {actual}')
          if c['total'] != 931:
              raise SystemExit(f'denominator changed: {c["total"]}')
          print(f'EXACT_ONE_TRANSITION={operation_id}:PENDING->ADAPTED')
          print(f'TOTAL={c["total"]}')
          print(f'TERMINAL={c["terminal"]}')
          print(f'PENDING={c["pending"]}')
          print(f'BLOCKED={c["blocked"]}')
          PY
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m 'Parity: materialize BILL 5811 exact-one closure'
          git push origin "HEAD:${GITHUB_REF_NAME}"

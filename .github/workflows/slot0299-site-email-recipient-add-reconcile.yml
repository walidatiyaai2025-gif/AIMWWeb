name: Reconcile Slot0299 site email recipient add

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-BILL-07134347F9-slot0299
    paths:
      - '.github/workflows/slot0299-site-email-recipient-add-reconcile.yml'
      - 'variants/laravel-aiwmweb/backend/**'
      - 'variants/laravel-aiwmweb/docs/closure-evidence/site-email-recipient-add-terminality.json'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PREVIOUS_RECONCILIATION_SHA: 4dbe28edca735a9a57d5afe48eecff49e92503aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused Laravel acceptance
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test
          php artisan test --filter=SiteEmailRecipientAddTerminalityTest

      - name: Bind exact pushed snapshot to focused closure evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          source_sha = os.environ['SOURCE_SHA']
          previous_sha = os.environ['PREVIOUS_RECONCILIATION_SHA']
          manifest_path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['focused_closure_evidence_source_sha'] = source_sha
          manifest['previous_reconciliation_sha'] = previous_sha
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'EXACT_SOURCE_SHA={source_sha}')
          PY

      - name: Run canonical parity generator pipeline
        run: |
          set -euo pipefail
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py \
            --input /tmp/operation-parity-reconciliation.json \
            --output /tmp/operation-parity-reconciliation.json \
            --summary-output /tmp/operation-parity-summary.json \
            --markdown-output /tmp/operation-parity-reconciliation.md \
            --check-total 931

      - name: Prove exact one-operation delta
        shell: bash
        run: |
          set -euo pipefail
          git show "$PREVIOUS_RECONCILIATION_SHA:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json
          from pathlib import Path

          target = 'AIMW-BILL-07134347F9'
          before = json.loads(Path('/tmp/previous.json').read_text())
          after = json.loads(Path('/tmp/operation-parity-reconciliation.json').read_text())
          b = {row['operation_id']: row for row in before['operations']}
          a = {row['operation_id']: row for row in after['operations']}
          changed = {op for op in a if a[op].get('migration_state') != b[op].get('migration_state')}
          if changed != {target}:
              raise SystemExit(f'exact delta violation: {sorted(changed)}')
          if b[target]['migration_state'] != 'PENDING' or a[target]['migration_state'] != 'ADAPTED':
              raise SystemExit(f'unexpected transition: {b[target]["migration_state"]}->{a[target]["migration_state"]}')

          totals = after['totals']
          if (totals['total'], totals['terminal'], totals['pending'], totals['blocked']) != (931, 554, 377, 0):
              raise SystemExit(f'unexpected totals: {totals}')
          billing = after['domains']['billing']
          if (billing['total'], billing['terminal'], billing['pending'], billing['blocked']) != (178, 87, 91, 0):
              raise SystemExit(f'unexpected billing totals: {billing}')
          visible = after['visible_controls']
          if (visible['total'], visible['terminal'], visible['pending'], visible['blocked']) != (446, 112, 334, 0):
              raise SystemExit(f'unexpected visible-control totals: {visible}')
          if not after.get('validation', {}).get('passed'):
              raise SystemExit('canonical validation did not pass')
          print('EXACT_DELTA=1')
          print('AIMW-BILL-07134347F9=PENDING->ADAPTED')
          print('TOTAL=931 TERMINAL=554 PENDING=377 BLOCKED=0')
          PY

      - name: Persist generator-owned reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          cp /tmp/operation-parity-reconciliation.md variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/slot0299-site-email-recipient-add-reconcile.yml
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --check
          git commit -m 'docs(laravel): reconcile AIMW-BILL-07134347F9'
          git pull --rebase origin worker/laravel-aiwmweb-AIMW-BILL-07134347F9-slot0299
          git push origin HEAD:worker/laravel-aiwmweb-AIMW-BILL-07134347F9-slot0299

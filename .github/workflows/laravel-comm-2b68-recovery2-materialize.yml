name: Laravel COMM 2B682F7BEC Recovery 2 Materialize

on:
  push:
    branches:
      - worker/laravel-comm-2b682f7bec-recovery-2
    paths:
      - '.github/workflows/laravel-comm-2b68-recovery2-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      AUTHORITY_SHA: 7e64b4f094b06bcf78260e84a9f021fe39baa4f9
      OPERATION_ID: AIMW-COMM-2B682F7BEC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist

      - name: Initialize Laravel test environment
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Focused tenant and runtime security acceptance before materialization
        working-directory: variants/laravel-aiwmweb/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php --filter=test_context_resolves_only_the_authenticated_tenant_site_and_matching_comments_contract
          php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php --filter=test_guest_missing_tenant_permission_foreign_tenant_and_foreign_site_fail_closed
          php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php --filter=test_authorized_explorer_navigation_rereads_authoritative_site_context_without_mutation
          php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php --filter=test_production_wiring_is_read_only_fail_closed_and_scoped_to_the_claimed_control

      - name: Focused frontend fail-closed acceptance
        working-directory: variants/laravel-aiwmweb/backend
        run: |
          npm run --if-present typecheck
          npx vitest run resources/js/__tests__/comments-back-to-explorer-control.test.tsx

      - name: Pint focused PHP
        working-directory: variants/laravel-aiwmweb/backend
        run: vendor/bin/pint --test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php

      - name: Persist fresh pre-materialization proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/closure-evidence/comments-back-to-explorer-terminality.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['recovery_validation'] = {
              'base_authority_sha': os.environ['AUTHORITY_SHA'],
              'validation_input_sha': os.environ['GITHUB_SHA'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'pre_materialization_php_security_methods': 'PASS (4 focused methods)',
              'typescript_typecheck': 'PASS',
              'react_control': 'PASS',
              'pint': 'PASS',
              'result': 'PASS'
          }
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/closure-evidence/comments-back-to-explorer-terminality.json
          git commit -m 'test: record fresh Comments recovery proof'
          git push origin HEAD:worker/laravel-comm-2b682f7bec-recovery-2

      - name: Generate candidate reconciliation for full focused terminality test
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = '${AUTHORITY_SHA}'
          data['focused_closure_evidence_source_sha'] = '${SOURCE_SHA}'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Full focused terminality acceptance on generated candidate
        working-directory: variants/laravel-aiwmweb/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test tests/Feature/CommentsBackToExplorerControlTerminalityTest.php

      - name: Persist full focused proof and bind exact pushed evidence source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/closure-evidence/comments-back-to-explorer-terminality.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          recovery = data.setdefault('recovery_validation', {})
          recovery['full_php_terminality_test'] = 'PASS (5 focused methods on generated candidate)'
          recovery['result'] = 'PASS'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git add variants/laravel-aiwmweb/docs/closure-evidence/comments-back-to-explorer-terminality.json
          git commit -m 'test: record full Comments terminality proof'
          git push origin HEAD:worker/laravel-comm-2b682f7bec-recovery-2
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "FOCUSED_EVIDENCE_SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Run official reconciliation chain from exact pushed proof
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          python - <<PY
          import json, os
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['previous_reconciliation_sha'] = os.environ['AUTHORITY_SHA']
          data['focused_closure_evidence_source_sha'] = os.environ['FOCUSED_EVIDENCE_SOURCE_SHA']
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          JSON=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json
          MD=variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          SUMMARY=/tmp/operation-parity-summary.json
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$JSON" --output "$JSON" --summary-output "$SUMMARY" --markdown-output "$MD" --check-total 931

      - name: Enforce exact-one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          git show "${AUTHORITY_SHA}:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json" > /tmp/previous.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['OPERATION_ID']
          old = json.loads(Path('/tmp/previous.json').read_text())
          new = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          assert old['totals']['total'] == new['totals']['total'] == 931
          assert old['totals']['terminal'] == 594, old['totals']
          assert old['totals']['pending'] == 337, old['totals']
          assert old['totals']['blocked'] == 0, old['totals']
          assert new['totals']['terminal'] == 595, new['totals']
          assert new['totals']['pending'] == 336, new['totals']
          assert new['totals']['blocked'] == 0, new['totals']
          before = {x['operation_id']: x for x in old['operations']}
          after = {x['operation_id']: x for x in new['operations']}
          changed = [op for op in before if before[op]['migration_state'] != after[op]['migration_state']]
          acceptance = str(after[target].get('acceptance_test') or '')
          print('CHANGED=' + ','.join(changed))
          print('TARGET_BEFORE=' + str(before[target].get('migration_state')))
          print('TARGET_AFTER=' + str(after[target].get('migration_state')))
          print('TARGET_ACCEPTANCE_TEST=' + acceptance)
          assert changed == [target], changed
          assert before[target]['migration_state'] == 'PENDING'
          assert after[target]['migration_state'] == 'ADAPTED'
          assert 'CommentsBackToExplorerControlTerminalityTest.php' in acceptance, acceptance
          print('EXACT_ONE_TRANSITION=PASS')
          print('AIMW-COMM-2B682F7BEC:PENDING->ADAPTED')
          print('TOTAL=931 TERMINAL=595 PENDING=336 BLOCKED=0')
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha "$AUTHORITY_SHA"

      - name: Commit official generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          git diff --cached --exit-code && { echo 'Expected generated parity changes were not produced'; exit 1; } || true
          git commit -m 'Laravel: materialize Comments Back to Explorer closure'
          git push origin HEAD:worker/laravel-comm-2b682f7bec-recovery-2

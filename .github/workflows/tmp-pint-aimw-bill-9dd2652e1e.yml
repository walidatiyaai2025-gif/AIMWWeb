name: Temporary Pint AIMW-BILL-9DD2652E1E

on:
  push:
    branches:
      - worker/laravel-AIMW-BILL-9DD2652E1E-cancel-permanently

permissions:
  contents: write

jobs:
  pint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install backend dependencies
        working-directory: variants/laravel-aiwmweb/backend
        run: composer install --no-interaction --prefer-dist

      - name: Format selected security test with repository Pint
        working-directory: variants/laravel-aiwmweb/backend
        run: vendor/bin/pint tests/Feature/BillingCancelPermanentlyTerminalityTest.php

      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/backend/tests/Feature/BillingCancelPermanentlyTerminalityTest.php
          if git diff --cached --quiet; then
            echo 'Pint reported no formatting delta.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'AIMW-BILL-9DD2652E1E: apply Pint formatting'
          git push origin HEAD

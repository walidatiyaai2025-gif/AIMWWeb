name: Materialize AIMW-BILL-B86D339C12

on:
  push:
    branches:
      - worker/laravel-bill-b86d339c12-subscription-plans-route

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Register exact pushed route provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          path = Path('variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json')
          manifest = json.loads(path.read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          operation_id = 'AIMW-BILL-B86D339C12'
          manifest['previous_reconciliation_sha'] = '35ea3bd44a3c6977da8e40ad1dd08c2ff117c9cc'
          sources = manifest.setdefault('countable_sources', [])
          for source in sources:
              provenance = source.get('route_api_provenance') or {}
              if operation_id in provenance:
                  raise SystemExit(f'duplicate provenance for {operation_id}')
          sources.append({
              'label': 'Subscription Plans admin route exact-head closure',
              'sha': head,
              'observed_pr_head': head,
              'domains': ['billing'],
              'supporting_only': True,
              'operation_ids': [operation_id],
              'route_api_provenance': {
                  operation_id: {
                      'destination_path': 'variants/laravel-aiwmweb/backend/app/Providers/SubscriptionPlansAdminRouteServiceProvider.php',
                      'action_path': 'variants/laravel-aiwmweb/backend/app/Http/Controllers/SubscriptionPlansAdminReadController.php',
                      'acceptance_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SubscriptionPlansAdminRouteTerminalityTest.php',
                      'operation_link_test': 'variants/laravel-aiwmweb/backend/tests/Feature/SubscriptionPlansAdminRouteTerminalityTest.php',
                      'evidence_path': 'variants/laravel-aiwmweb/docs/closure-evidence/subscription-plans-admin-route-terminality.json',
                      'security_mode': 'tenant_scoped'
                  }
              }
          })
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          print(f'PROVENANCE_SOURCE_SHA={head}')
          PY

      - name: Run official generator chain
        shell: bash
        run: |
          set -euo pipefail
          out='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          md='variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md'
          summary='/tmp/operation-parity-summary.json'
          python variants/laravel-aiwmweb/tools/finalize_operation_parity.py --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_tenant_neutral_route_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_platform_admin_route_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_explicit_route_api_provenance.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_closure_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_service_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931
          python variants/laravel-aiwmweb/tools/apply_focused_background_job_evidence.py --input "$out" --output "$out" --summary-output "$summary" --markdown-output "$md" --check-total 931

      - name: Enforce exactly one canonical transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          operation_id = 'AIMW-BILL-B86D339C12'
          old = json.loads(subprocess.check_output([
              'git', 'show',
              '35ea3bd44a3c6977da8e40ad1dd08c2ff117c9cc:variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json'
          ], text=True))
          new = json.loads(Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json').read_text())
          old_rows = {r['operation_id']: r['migration_state'] for r in old['operations']}
          new_rows = {r['operation_id']: r['migration_state'] for r in new['operations']}
          changes = [(op, old_rows[op], new_rows[op]) for op in old_rows if old_rows[op] != new_rows[op]]
          expected = [(operation_id, 'PENDING', 'ADAPTED')]
          if changes != expected:
              raise SystemExit(f'unexpected parity delta: {changes}')
          totals = new['totals']
          assert totals['total'] == 931, totals
          assert totals['terminal'] == 598, totals
          assert totals['pending'] == 333, totals
          assert totals['blocked'] == 0, totals
          print('EXACT_ONE_TRANSITION=PASS')
          print('TOTAL=931 TERMINAL=598 PENDING=333 BLOCKED=0')
          PY
          python variants/laravel-aiwmweb/tools/operation_parity_delta.py \
            --current variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
            --previous-sha 35ea3bd44a3c6977da8e40ad1dd08c2ff117c9cc

      - name: Focused Laravel validation
        working-directory: variants/laravel-aiwmweb/backend
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test app/Providers/SubscriptionPlansAdminRouteServiceProvider.php app/Http/Controllers/SubscriptionPlansAdminReadController.php tests/Feature/SubscriptionPlansAdminRouteTerminalityTest.php
          php artisan migrate:fresh --force
          php artisan test --filter=SubscriptionPlansAdminRouteTerminalityTest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Persist official reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add variants/laravel-aiwmweb/docs/operation-parity-evidence-sources.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json \
                  variants/laravel-aiwmweb/docs/operation-parity-reconciliation.md
          if git diff --cached --quiet; then
            echo 'No generated changes to persist' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: materialize subscription plans route parity'
          git push origin HEAD:${GITHUB_REF_NAME}

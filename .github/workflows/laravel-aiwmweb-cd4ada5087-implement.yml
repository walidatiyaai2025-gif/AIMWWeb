name: Laravel AIWMWeb CurrentUser Logs Closure

on:
  push:
    branches:
      - worker/laravel-iden-cd4ada5087-current-user-logs

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-iden-cd4ada5087-current-user-logs
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize focused implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > variants/laravel-aiwmweb/backend/resources/js/current-user-logs-control.tsx <<'EOF'
          import React from 'react';
          import { resolveCapability, tenantUrl, workspaceRoutes, type FrontendContext } from './core';

          export const CURRENT_USER_LOGS_OPERATION_ID = 'AIMW-IDEN-CD4ADA5087';

          export function CurrentUserLogsControl({ context }: { context: FrontendContext }) {
              const logsRoute = workspaceRoutes.find((route) => route.key === 'logs');
              const hasDiagnosticsPermission = context.permissions.includes('diagnostics.view') || context.permissions.includes('*');
              const hasEndpointPermission = context.permissions.includes('operations.manage') || context.permissions.includes('*');
              const routeContractIsExact = Boolean(
                  logsRoute
                  && logsRoute.path === '/module/logs'
                  && logsRoute.apiKey === 'logs'
                  && logsRoute.permission === 'diagnostics.view',
              );
              const capability = logsRoute ? resolveCapability(context, logsRoute) : { state: 'pending_integration' as const };

              if (!routeContractIsExact || !hasDiagnosticsPermission || !hasEndpointPermission || capability.state !== 'enabled') {
                  return null;
              }

              return (
                  <a
                      className="btn current-user-logs-control"
                      href={tenantUrl(context.tenant.slug, logsRoute!.path)}
                      data-canonical-operation={CURRENT_USER_LOGS_OPERATION_ID}
                  >
                      Open logs
                  </a>
              );
          }
          EOF

          cat > variants/laravel-aiwmweb/backend/resources/js/__tests__/current-user-logs-control.test.tsx <<'EOF'
          import React from 'react';
          import { render, screen } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';
          import { CURRENT_USER_LOGS_OPERATION_ID, CurrentUserLogsControl } from '../current-user-logs-control';
          import type { FrontendContext } from '../core';

          const context = (
              slug = 'alpha',
              permissions: string[] = ['diagnostics.view', 'operations.manage'],
              api: Record<string, string> = { logs: '/tenants/alpha/admin/logs' },
          ): FrontendContext => ({
              user: { id: 10, name: 'Alpha Owner', email: 'alpha@example.test' },
              tenant: { slug, name: 'Alpha' },
              tenants: [{ slug, name: 'Alpha' }],
              permissions,
              connectors: [],
              capabilities: {},
              api,
              actions: {},
          });

          describe('AIMW-IDEN-CD4ADA5087 current-user Open logs control', () => {
              it('binds the exact canonical operation to the trusted active tenant logs workspace', () => {
                  render(<CurrentUserLogsControl context={context()} />);
                  const link = screen.getByRole('link', { name: 'Open logs' });
                  expect(CURRENT_USER_LOGS_OPERATION_ID).toBe('AIMW-IDEN-CD4ADA5087');
                  expect(link).toHaveAttribute('data-canonical-operation', CURRENT_USER_LOGS_OPERATION_ID);
                  expect(link).toHaveAttribute('href', '/tenants/alpha/module/logs');
                  expect(document.querySelectorAll(`[data-canonical-operation="${CURRENT_USER_LOGS_OPERATION_ID}"]`)).toHaveLength(1);
              });

              it('derives and encodes the destination only from the server-provided tenant context', () => {
                  window.history.replaceState({}, '', '/tenants/beta/module/posts');
                  render(<CurrentUserLogsControl context={context('alpha/../beta', ['diagnostics.view', 'operations.manage'], { logs: '/tenants/alpha%2F..%2Fbeta/admin/logs' })} />);
                  const link = screen.getByRole('link', { name: 'Open logs' });
                  expect(link).toHaveAttribute('href', '/tenants/alpha%2F..%2Fbeta/module/logs');
                  expect(link.getAttribute('href')).not.toBe('/tenants/beta/module/logs');
              });

              it.each([
                  [['operations.manage'], { logs: '/tenants/alpha/admin/logs' }],
                  [['diagnostics.view'], { logs: '/tenants/alpha/admin/logs' }],
                  [['diagnostics.view', 'operations.manage'], {}],
              ])('fails closed when permissions or the server API contract are incomplete', (permissions, api) => {
                  render(<CurrentUserLogsControl context={context('alpha', permissions as string[], api as Record<string, string>)} />);
                  expect(screen.queryByRole('link', { name: 'Open logs' })).not.toBeInTheDocument();
              });
          });
          EOF

          cat > variants/laravel-aiwmweb/backend/tests/Feature/CurrentUserLogsSecurityTest.php <<'EOF'
          <?php

          namespace Tests\Feature;

          use App\Models\Permission;
          use App\Models\Role;
          use App\Models\Tenant;
          use App\Models\TenantMembership;
          use App\Models\User;
          use App\Tenancy\TenantContext;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Tests\TestCase;

          class CurrentUserLogsSecurityTest extends TestCase
          {
              use RefreshDatabase;

              public function test_guest_cannot_read_tenant_logs(): void
              {
                  $tenant = Tenant::query()->create(['name' => 'Alpha', 'slug' => 'alpha']);
                  $this->getJson("/tenants/{$tenant->slug}/admin/logs")->assertUnauthorized();
              }

              public function test_diagnostics_only_member_fails_closed_at_the_actual_logs_endpoint(): void
              {
                  [, $membership] = $this->tenantMember('alpha', ['tenant.view', 'diagnostics.view']);
                  $this->actingAs($membership->user)->getJson('/tenants/alpha/admin/logs')->assertForbidden();
              }

              public function test_foreign_tenant_route_is_rejected_before_logs_are_read(): void
              {
                  [, $alpha] = $this->tenantMember('alpha', ['tenant.view', 'diagnostics.view', 'operations.manage']);
                  $this->tenantMember('beta', ['tenant.view', 'diagnostics.view', 'operations.manage']);
                  $this->actingAs($alpha->user)->getJson('/tenants/beta/admin/logs')->assertNotFound();
              }

              public function test_authorized_member_reads_only_the_active_tenant_logs_contract(): void
              {
                  [, $membership] = $this->tenantMember('alpha', ['tenant.view', 'diagnostics.view', 'operations.manage']);
                  $response = $this->actingAs($membership->user)->getJson('/tenants/alpha/admin/logs')->assertOk();
                  $response->assertJsonStructure(['data']);
                  $this->assertIsArray($response->json('data'));
              }

              private function tenantMember(string $slug, array $permissions): array
              {
                  $tenant = Tenant::query()->create(['name' => ucfirst($slug), 'slug' => $slug]);
                  $user = User::factory()->create();
                  $context = app(TenantContext::class);
                  $context->activate($tenant);
                  $membership = TenantMembership::query()->create(['user_id' => $user->id, 'status' => 'active']);
                  $role = Role::query()->create(['name' => 'logs-'.$slug.'-'.bin2hex(random_bytes(3))]);
                  foreach ($permissions as $name) {
                      $permission = Permission::query()->firstOrCreate(['name' => $name]);
                      $role->permissions()->syncWithoutDetaching([$permission->id => ['tenant_id' => $tenant->id]]);
                  }
                  $membership->roles()->attach($role, ['tenant_id' => $tenant->id]);
                  $membership->setRelation('user', $user);
                  $context->forget();
                  return [$tenant, $membership];
              }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('variants/laravel-aiwmweb/backend/resources/js/pages.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = "import { AuthoritativeReconciliationError, mutateThenReconcile } from './reconciliation';\n"
          insertion = anchor + "import { CurrentUserLogsControl } from './current-user-logs-control';\n"
          assert text.count(anchor) == 1, 'pages import anchor changed'
          text = text.replace(anchor, insertion, 1)
          old = "if (query.error) return <QueryError error={query.error} retry={() => query.refetch()} />;"
          occurrences = text.count(old)
          assert occurrences >= 2, f'expected dashboard + resource query error anchors, got {occurrences}'
          replacement = "if (query.error) return (\n        <div className=\"workspace-stack\">\n            <QueryError error={query.error} retry={() => query.refetch()} />\n            <CurrentUserLogsControl context={context} />\n        </div>\n    );"
          first = text.find(old)
          second = text.find(old, first + len(old))
          assert second != -1, 'resource query error anchor missing'
          text = text[:second] + replacement + text[second + len(old):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          cd variants/laravel-aiwmweb/backend
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
          vendor/bin/pint --test tests/Feature/CurrentUserLogsSecurityTest.php
          php artisan test tests/Feature/CurrentUserLogsSecurityTest.php
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --run resources/js/__tests__/current-user-logs-control.test.tsx
          npm run build

      - name: Commit implementation then machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/backend/resources/js/current-user-logs-control.tsx variants/laravel-aiwmweb/backend/resources/js/__tests__/current-user-logs-control.test.tsx variants/laravel-aiwmweb/backend/resources/js/pages.tsx variants/laravel-aiwmweb/backend/tests/Feature/CurrentUserLogsSecurityTest.php
          git commit -m 'feat(laravel): secure current-user Open logs parity'
          implementation_sha="$(git rev-parse HEAD)"
          cat > variants/laravel-aiwmweb/docs/closure-evidence/current-user-logs-terminality.json <<EOF

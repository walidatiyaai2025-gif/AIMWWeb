name: Slot 0295 full diagnosis

on:
  push:
    branches:
      - worker/laravel-aiwmweb-AIMW-AUTO-22BC08CEF1-slot0295
    paths:
      - '.github/workflows/slot0295-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variants/laravel-aiwmweb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Run full PHP suite and capture output
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php artisan test --testdox > "$GITHUB_WORKSPACE/slot0295-full-test-output.txt" 2>&1
          rc=$?
          cat "$GITHUB_WORKSPACE/slot0295-full-test-output.txt"
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/slot0295-full-test-exit-code.txt"
          exit 0
      - name: Export exact remaining Automation rows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('../docs/operation-parity-reconciliation.json')
          data = json.loads(p.read_text())
          rows = [r for r in data['operations'] if r.get('domain') == 'automation' and r.get('migration_state') == 'PENDING']
          Path('../../../slot0295-pending-automation.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: slot0295-diagnosis
          path: |
            slot0295-full-test-output.txt
            slot0295-full-test-exit-code.txt
            slot0295-pending-automation.json
          if-no-files-found: error

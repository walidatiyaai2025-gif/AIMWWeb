name: Laravel AIWMWeb Slot 0164 Discover Pending

on:
  push:
    branches:
      - worker/laravel-aiwmweb-slot0164
    paths:
      - '.github/workflows/laravel-aiwmweb-slot0164-discover-pending.yml'

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/laravel-aiwmweb-slot0164
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract live pending inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('variants/laravel-aiwmweb/docs/operation-parity-reconciliation.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          rows = []

          def contains_pending(node):
              if isinstance(node, dict):
                  return any(v == 'PENDING' for v in node.values())
              return False

          def walk(node):
              if isinstance(node, dict):
                  if contains_pending(node):
                      rows.append(node)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)

          walk(data)
          seen = set()
          output = [f'TOP_LEVEL_KEYS={list(data.keys()) if isinstance(data, dict) else type(data).__name__}']
          for row in rows:
              scalars = [(k, v) for k, v in row.items() if not isinstance(v, (dict, list))]
              op_id = None
              for key, value in scalars:
                  if isinstance(value, str) and value.startswith('AIMW-'):
                      op_id = value
                      break
              if op_id and op_id in seen:
                  continue
              if op_id:
                  seen.add(op_id)
              output.append(' | '.join(f'{k}={v}' for k, v in scalars))

          out = Path('variants/laravel-aiwmweb/docs/slot0164-pending-discovery.txt')
          out.write_text('\n'.join(output[:160]) + f'\n\nMATCHING_DICTS={len(rows)}\nUNIQUE_IDS={len(seen)}\n', encoding='utf-8')
          print(f'pending dicts: {len(rows)} unique ids: {len(seen)}')
          PY
      - name: Commit discovery output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add variants/laravel-aiwmweb/docs/slot0164-pending-discovery.txt
          git commit -m 'chore(laravel): inspect slot0164 pending inventory schema'
          git push origin HEAD:worker/laravel-aiwmweb-slot0164
